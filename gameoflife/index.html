<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game of Life</title>
  <meta name="description" content="Small games and stories that always lead back outside. Play one, then go out and find the real thing.">
  <meta name="color-scheme" content="dark">
  <!-- so a pasted link reads as something made on purpose -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Game of Life">
  <meta property="og:description" content="Small games and stories that always lead back outside. Play one, then go out and find the real thing.">
  <meta property="og:url" content="https://mbace1.github.io/Suds-Jack/gameoflife/">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141311'/%3E%3Cpath d='M8 13C8 8 10 4 14 3 13 8 11 11 8 13Z' fill='%238faf6a'/%3E%3Cpath d='M8 13C8 10 6 7 3 6 4 10 6 12 8 13Z' fill='%235f7a4a'/%3E%3C/svg%3E">
  <style>
    /* A quiet research terminal: cold, sparse, monospace, with the picture seen
       through a slightly curved screen (js/crt.js). One phosphor colour carries
       every live element — set from the status line, stored in --accent. */
    :root { --accent: #35e8d8; --accent-dim: #7fd8d0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #06070a; min-height: 100%; }
    body {
      /* Courier New carries no CJK, so name the fallbacks rather than let each
         platform guess a face for the Japanese */
      font-family: 'Courier New', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP',
                   'Yu Gothic', 'MS Gothic', monospace;
      color: #d6d9dd;
      display: flex; justify-content: center;
      padding: 40px 16px 48px;
    }
    #app {
      width: 100%; max-width: 560px;
      /* the page is a column the height of the screen, so the content below
         the title floats to the middle instead of packing against the top
         (main's iteration-33 centring, re-hung on the terminal's own markup:
         the offering group floats, the status line holds the bottom) */
      min-height: calc(100vh - 88px);
      display: flex; flex-direction: column;
    }
    .offer { margin-top: auto; }
    .hub-footer { margin-bottom: auto; }
    .exp { margin-top: 0; }
    .back-btn { margin-bottom: auto; }
    /* keyboard players need to see where they are; the UA ring is too faint
       against this background */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ── hub: a terminal readout, not a menu ─────────── */
    .hub-header { margin-bottom: 14px; }
    .hub-header h1 {
      font-size: 19px; letter-spacing: 5px; font-weight: 400;
      color: #e8ecef; text-transform: uppercase;
    }
    .tagline { margin-top: 10px; color: #8b949c; font-size: 12.5px; line-height: 1.6; }
    /* the rules that bracket the offering — a real terminal's only ornament */
    .rule { height: 1px; background: #232a30; margin: 14px 0; }

    .offer { padding: 12px 0 6px; }
    .offer-name {
      font-size: 17px; letter-spacing: 3px; color: #e8ecef;
      text-transform: uppercase; display: flex; gap: 12px;
    }
    .caret { color: var(--accent); }
    .offer-kind { margin-top: 8px; margin-left: 26px; color: #8b949c; font-size: 13px; }
    .played-note { margin-top: 6px; margin-left: 26px; color: var(--accent-dim); font-size: 12px; }
    .another-btn { margin-left: 18px; }

    .btn {
      font-family: inherit; font-size: 14px; letter-spacing: 2px; cursor: pointer;
      padding: 14px 16px; min-height: 44px; text-transform: uppercase;
      background: none; color: var(--accent); border: none;
    }
    .btn:hover { background: rgba(255, 255, 255, .04); }
    .link-btn {
      font-family: inherit; font-size: 12.5px; cursor: pointer;
      background: none; border: none; color: #99a2a9;
      display: block; padding: 15px 8px; min-height: 44px; text-align: left;
    }
    .link-btn:hover { color: var(--accent-dim); }
    .cycle-hint { margin-top: 14px; font-size: 12px; color: #8b949c; line-height: 1.6; }

    /* the status line: every set-once switch, in two dim rows */
    .hub-footer { display: flex; flex-direction: column; gap: 2px; }
    .status { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
    .lang-row { display: flex; gap: 2px; align-items: center; }
    .lang-btn {
      font-family: inherit; font-size: 12px; cursor: pointer;
      background: none; color: #99a2a9; border: none; letter-spacing: 1px;
      /* a 12px word is a fine thing to read and a poor thing to hit — the
         padding grows the target without changing how tight the row looks */
      padding: 12px 7px; min-height: 44px; min-width: 44px;
    }
    .lang-btn:hover { color: #c8cfd4; }
    .lang-btn.active { color: var(--accent); }
    .footer-link { margin-top: 0 !important; padding-left: 0; }
    .opt-row { align-items: center; }
    .hemi-label { font-size: 11px; color: #8b949c; letter-spacing: 1px; }

    /* the sound garden: a quiet meter of what going outside has earned */
    .garden-note { font-size: 12px; letter-spacing: 4px; color: var(--accent-dim); padding: 6px 0; }
    .garden-note.grew { color: var(--accent); }
    .garden-grew { font-size: 11.5px; color: #8b949c; line-height: 1.6; }

    /* ── experiences ─────────────────────────────────── */
    .exp { display: flex; flex-direction: column; align-items: center; }
    /* the bezel: a physical monitor set into the page, the screen inside it */
    .screen-wrap {
      width: 100%; padding: 9px; border-radius: 14px;
      background: linear-gradient(#15181c, #0a0c0f);
      border: 1px solid #262c33;
      box-shadow: 0 1px 0 #2e353c inset, 0 10px 24px rgba(0, 0, 0, .6);
    }
    .pixel-screen {
      display: block; width: 100%; aspect-ratio: 3 / 2;
      image-rendering: pixelated; image-rendering: crisp-edges;
      border-radius: 7px; background: #000;
      touch-action: manipulation;
    }
    /* the CRT canvas is already at device resolution — the shader draws the
       pixels, so leave the browser's scaling alone */
    .pixel-screen.crt { image-rendering: auto; }
    .exp-text {
      margin-top: 18px; font-size: 15px; line-height: 1.7; color: #d6d9dd;
      /* six lines held open. Beats vary from ~90 to ~340 characters, and sizing
         this to the short ones made the Continue button walk up to 190px up and
         down the screen between taps — you had to re-aim every time. Reserving
         the room costs some empty space on short beats and buys a layout that
         holds still, which is the whole feel of the thing. */
      min-height: 10.2em; width: 100%; white-space: pre-line;
    }
    .exp-text p + p { margin-top: 10px; }
    .exp-buttons { margin-top: 14px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .back-btn { margin-top: 14px; }

    /* ── panels / overlay ────────────────────────────── */
    .panel {
      border: 1px solid #262c33; background: #0c0e12; padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .7);
    }
    .panel h2 {
      color: #e8ecef; font-size: 14px; letter-spacing: 3px; text-transform: uppercase;
    }
    .panel p { margin-top: 10px; font-size: 14px; line-height: 1.6; color: #d6d9dd; }
    .overlay {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(4, 5, 7, 0.9);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .interlude { max-width: 460px; border-color: #33454a; }
    .poem { margin-top: 14px; border-left: 2px solid var(--accent); padding-left: 14px; }
    .poem-body { white-space: pre-line; color: #e8ecef !important; }
    .poem-title { font-size: 12px !important; color: #8b949c !important; }

    /* ── feedback ────────────────────────────────────── */
    .leaf-row { margin-top: 12px; display: flex; gap: 4px; }
    /* a thumb-sized target — five 26px glyphs in a row was a game of darts */
    .leaf-btn {
      font-size: 22px; background: none; border: none; cursor: pointer;
      filter: grayscale(1) brightness(0.6);
      min-width: 44px; min-height: 44px; padding: 2px;
    }
    .leaf-btn.lit { filter: none; }
    .fb-dest { font-size: 11.5px !important; color: #8b949c !important; }
    .fb-text {
      margin-top: 14px; width: 100%; min-height: 64px; resize: vertical;
      font-family: inherit; font-size: 13px; padding: 8px;
      background: #06070a; color: #e8ecef; border: 1px solid #262c33;
    }

    /* ── a phone held sideways ────────────────────────── */
    /* At 360px tall the 3:2 canvas alone was 373px — taller than the screen —
       and the choices sat 150px below the fold. Cap the scene so picture, text
       and buttons all fit without scrolling. */
    /* Touch targets stay 44px here — a phone is exactly where they matter — so
       the room comes out of the scene and the gaps instead. */
    @media (max-height: 560px) {
      body { padding: 6px 12px 12px; }
      .screen-wrap { display: flex; justify-content: center; }
      .pixel-screen { width: auto; max-width: 100%; max-height: 38vh; }
      .exp-text { margin-top: 6px; min-height: 4.4em; font-size: 13px; line-height: 1.5; }
      .exp-buttons { margin-top: 4px; gap: 10px; }
      .btn { margin-top: 4px; padding: 12px 16px; }
      .back-btn { margin-top: 2px; padding: 10px 8px; min-height: 40px; }
      .screen-wrap { padding: 6px; }
      .hub-header { margin-bottom: 10px; }
      .rule { margin: 8px 0; }
    }

    /* the nature-note inside an experience keeps its living green: it is the
       one line that points away from the screen, so it should not look like
       part of the terminal */
    .nature-note { color: #a6e85a; }

    /* a view arrives the way a terminal draws one: quickly, and once. Short
       enough to feel like a redraw rather than an animation. */
    @keyframes term-in { from { opacity: 0 } to { opacity: 1 } }
    .offer, .exp, .panel { animation: term-in .16s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .offer, .exp, .panel { animation: none; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <!-- the arcade shell: a home button and a controller way back -->
  <script type="module" src="../hub/shell.js?v=7"></script>
  <script type="module" src="js/main.js?v=40"></script>
</body>
</html>
