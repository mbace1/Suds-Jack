<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Eeri</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#0a001a;overflow:hidden;touch-action:none;user-select:none}
#c{display:block;position:absolute;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay,#over-dead,#over-win{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:20px
}
#overlay{display:flex;background:linear-gradient(170deg,#0a001a 0%,#200848 50%,#0a001a 100%)}
.stars{position:absolute;inset:0;pointer-events:none}
.o-title{
  font:900 60px/1 'Courier New',monospace;color:#f8d800;
  text-shadow:4px 4px 0 #a06000,0 0 40px #f8d80060;letter-spacing:8px
}
.o-sub{font:15px/1.9 sans-serif;color:#c0aee8;text-align:center}
.o-hint{font:11px/1.7 'Courier New',monospace;color:#7060a0;text-align:center;max-width:340px}
.btn{
  padding:14px 44px;font:700 20px 'Courier New',monospace;letter-spacing:3px;
  border:none;border-radius:10px;cursor:pointer;
  background:#c82020;color:#fff;text-shadow:2px 2px 0 #800;
  box-shadow:0 6px 0 #780000,0 8px 24px #0008;
  transition:transform .07s,box-shadow .07s
}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #780000,0 2px 8px #0006}
#over-dead,#over-win{background:#00000088}
#over-dead h2{font:700 40px sans-serif;color:#f04444;text-shadow:2px 2px 8px #000}
#over-win h2{font:700 40px sans-serif;color:#f8d800;text-shadow:2px 2px 8px #000}
#over-dead p,#over-win p{font:17px sans-serif;color:#ddd}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="o-title">EERI</div>
  <div class="o-sub">Collect coins &bull; Stomp enemies &bull; Reach the flag!</div>
  <div class="o-hint">Arrows / WASD &bull; Space or Z = Jump (hold for higher)<br>Shift = Run &bull; Touch: stick left &bull; jump button right</div>
  <button class="btn" id="btn-start">▶ START</button>
</div>
<div id="over-dead">
  <h2>YOU DIED</h2>
  <p id="dead-msg"></p>
  <button class="btn" id="btn-retry">↩ TRY AGAIN</button>
</div>
<div id="over-win">
  <h2>🎉 LEVEL CLEAR! 🎉</h2>
  <p id="win-msg"></p>
  <button class="btn" id="btn-again">▶ PLAY AGAIN</button>
</div>
<script>
// ═══════════════════════════════════════════════════════════
// CANVAS / RESIZE
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const IW = 480, IH = 272; // internal resolution
let scale = 1, offX = 0, offY = 0;

function resize() {
  const sw = innerWidth, sh = innerHeight;
  scale = Math.min(sw / IW, sh / IH);
  const pw = Math.round(IW * scale), ph = Math.round(IH * scale);
  canvas.width = IW; canvas.height = IH;
  canvas.style.width  = pw + 'px';
  canvas.style.height = ph + 'px';
  offX = Math.round((sw - pw) / 2);
  offY = Math.round((sh - ph) / 2);
  canvas.style.left = offX + 'px';
  canvas.style.top  = offY + 'px';
}
resize();
window.addEventListener('resize', resize);

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const TILE = 16;
let COLS = 0;              // set by the chunk builder
const ROWS = 17;           // 17 * 16 = 272 = IH
const PW = 10, PH = 15;   // player hitbox

// Physics — Mario-quality feel
const GRAVITY_HOLD  =  520;  // gentle gravity while ascending + holding jump
const GRAVITY_FALL  = 1480;  // snappy falling gravity
const JUMP_VEL_WALK = -330;  // walk jump initial velocity (negative = up)
const JUMP_VEL_RUN  = -385;  // run jump (higher arc)
const STOMP_VEL     = -210;  // upward bounce after stomping
const WALK_SPEED    =   90;  // px/s walk
const RUN_SPEED     =  175;  // px/s run
const WALK_ACC      =  870;  // ground acceleration with input
const SKID_ACC      = 1800;  // deceleration when reversing direction
const GROUND_DEC    = 1100;  // ground deceleration, no input
const AIR_ACC       =  360;  // air acceleration
const AIR_DEC       =  170;  // air deceleration, no input
const MAX_FALL      =  560;  // terminal velocity
const COYOTE_T      = 0.10;  // coyote time (s)
const JBUF_T        = 0.12;  // jump buffer (s)

// Tile IDs
const T_EMPTY=0, T_GROUND=1, T_BRICK=2, T_QBLOCK=3, T_QUSED=4,
      T_PIPE_T=5, T_PIPE_B=6, T_SOLID=7;
function isSolid(t) { return t > 0; }

const EW = 14, EH = 14; // enemy hitbox

// ═══════════════════════════════════════════════════════════
// LEVEL BUILDER — ASCII chunks (Flash Prince room format)
// ═══════════════════════════════════════════════════════════
// A level is a sequence of hand-authored chunks stitched left to
// right; the middle chunks are shuffled by a seeded RNG, so every
// seed is a level and the same seed is always the same level.
//
// Each chunk is up to 12 rows of text mapped to map rows 5–16
// (rows above are always sky). Short rows are padded, missing
// leading rows count as sky. Every chunk begins and ends with
// ground so any order stitches cleanly.
//
//   #  ground   %  deep rock   B  brick   ?  ?-block
//   T  pipe mouth   U  pipe body   o  coin   e  enemy
//   S  player spawn   F  goal flag
let map = [];
const qUsed = {};
let spawnX = 40;
let levelSeed = 1;
let coinPts = [], enemyPts = [];

const CHUNK_TOP = 5;               // chunk row 0 = map row 5
const CHUNK_ROWS = ROWS - CHUNK_TOP;

const START_CHUNK = [
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '   S',
  '##########',
  '##########',
];

const END_CHUNK = [
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '',
  '          F',
  '################',
  '################',
];

const MID_CHUNKS = [
  [ // coin arc over brick shelves
    '',
    '',
    '',
    '        o o o',
    '      o       o',
    '     o         o',
    '   BB?B      B?BB',
    '',
    '',
    '        e',
    '####################',
    '####################',
  ],
  [ // two short hops
    '',
    '',
    '',
    '',
    '',
    '',
    '        ??',
    '',
    '',
    '              e',
    '#####  ####  #######',
    '#####  ####  #######',
  ],
  [ // pipe alley
    '',
    '',
    '',
    '',
    '',
    '',
    '      o  o  o',
    '',
    '    TT        TT',
    '    UU   e    UU',
    '####################',
    '####################',
  ],
  [ // rising steps
    '',
    '',
    '',
    '',
    '',
    '',
    '                o o',
    '            ##',
    '        ##  ##',
    '    ##  ##  ##',
    '####################',
    '####################',
  ],
  [ // sky bridge over a wide gap
    '       o  o  o',
    '',
    '',
    '',
    '',
    '',
    '',
    '     ###   ###',
    '',
    '',
    '####            ####',
    '####            ####',
  ],
  [ // ?-block field
    '',
    '',
    '',
    '',
    '      ? ? ?',
    '',
    '    ?       ?',
    '',
    '',
    '         e',
    '####################',
    '####################',
  ],
  [ // enemy gauntlet with brick cover
    '',
    '',
    '',
    '',
    '',
    '',
    '   BBBB      BBBB',
    '',
    '',
    '     e    e     e',
    '####################',
    '####################',
  ],
  [ // run-up gap with coin trail
    '',
    '',
    '',
    '',
    '',
    '        ooooo',
    '',
    '',
    '',
    '',
    '#######     ########',
    '#######     ########',
  ],
  [ // brick tower between pipes
    '',
    '',
    '',
    '',
    '',
    '',
    '         BB',
    '   TT    BB    TT',
    '   UU    BB    UU',
    '   UU    BB    UU',
    '####################',
    '####################',
  ],
  [ // breather hill with prize
    '',
    '',
    '',
    '',
    '        oooo',
    '',
    '      B?B',
    '',
    '',
    '  e',
    '####################',
    '####################',
  ],
];

const MID_PER_LEVEL = 8;

function buildLevel(seed) {
  Object.keys(qUsed).forEach(k => delete qUsed[k]);
  coinPts = []; enemyPts = [];

  const rng = mulberry32(seed);
  const order = [...MID_CHUNKS];
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  const seq = [START_CHUNK, ...order.slice(0, MID_PER_LEVEL), END_CHUNK];

  const widths = seq.map(ch => Math.max(...ch.map(row => row.length)));
  COLS = widths.reduce((a, b) => a + b, 0);
  map = Array.from({length: ROWS}, () => new Array(COLS).fill(T_EMPTY));

  let base = 0;
  seq.forEach((ch, ci) => {
    for (let cr = 0; cr < ch.length; cr++) {
      const mr = CHUNK_TOP + cr;
      const row = ch[cr];
      for (let i = 0; i < row.length; i++) {
        const c = base + i;
        switch (row[i]) {
          case '#': map[mr][c] = T_GROUND; break;
          case '%': map[mr][c] = T_SOLID; break;
          case 'B': map[mr][c] = T_BRICK; break;
          case '?': map[mr][c] = T_QBLOCK; break;
          case 'T': map[mr][c] = T_PIPE_T; break;
          case 'U': map[mr][c] = T_PIPE_B; break;
          case 'o': coinPts.push([c, mr]); break;
          case 'e': enemyPts.push([c, mr]); break;
          case 'S': spawnX = c * TILE + 3; break;
          case 'F': FLAG_COL = c; break;
        }
      }
    }
    base += widths[ci];
  });
}

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let player, enemies, coins, particles, popCoins;
let score, lives, coinCount, flagReached;
let camX = 0, camXv = 0;
let gameState = 'menu';
let prevJumpDown = false;

let FLAG_COL = 0;

function initGame() {
  buildLevel(levelSeed);

  coins = coinPts.map(([c, r]) => ({
    x: c*TILE+TILE/2, y: r*TILE+TILE/2, collected: false, bobT: Math.random()*6.28,
  }));

  player = {
    x: spawnX, y: 15*TILE - PH,
    vx: 0, vy: 0,
    onGround: false,
    wasJumping: false,  // in a jump → use hold gravity
    coyoteTime: 0,
    jumpBuf: 0,
    dir: 1,             // 1=right, -1=left
    frame: 0, frameT: 0,
    skidding: false,
    dead: false, deadT: 0,
    invincible: 0,
    running: false,
  };

  // Enemies come from 'e' markers: the marker tile is the air the
  // enemy stands in, feet on the tile below.
  enemies = enemyPts.map(([c, r]) => ({
    x: c*TILE + TILE/2 - EW/2,
    y: (r+1)*TILE - EH,
    vx: Math.random()<0.5 ? -28 : 28,
    vy: 0, onGround: false,
    dead: false, deadT: 0,
    squished: false, squishT: 0,
    walkT: 0, walkFrame: 0,
  }));

  particles = [];
  popCoins = [];
  score = 0; lives = 3; coinCount = 0; flagReached = false;
  camX = 0; camXv = 0;
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

const touch = { stickId: null, stickOx: 0, stickX: 0, jumpId: null, jumpDown: false };

function inRightZone(clientX) {
  const cx = clientX - offX;
  return cx / scale > IW * 0.5;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (inRightZone(t.clientX)) {
      if (touch.jumpId === null) { touch.jumpId = t.identifier; touch.jumpDown = true; }
    } else {
      if (touch.stickId === null) {
        touch.stickId = t.identifier;
        touch.stickOx = t.clientX;
        touch.stickX = 0;
      }
    }
  }
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.stickId) {
      const maxD = IW * scale * 0.13;
      touch.stickX = Math.max(-1, Math.min(1, (t.clientX - touch.stickOx) / maxD));
    }
  }
}, {passive:false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.stickId) { touch.stickId=null; touch.stickX=0; }
    if (t.identifier === touch.jumpId)  { touch.jumpId=null; touch.jumpDown=false; }
  }
}, {passive:false});

function getInput() {
  const kLeft  = keys['ArrowLeft']  || keys['KeyA'];
  const kRight = keys['ArrowRight'] || keys['KeyD'];
  const kJump  = keys['Space'] || keys['KeyZ'] || keys['KeyW'] || keys['ArrowUp'];
  const kRun   = keys['ShiftLeft'] || keys['ShiftRight'];

  let dx = 0;
  if (kLeft)  dx -= 1;
  if (kRight) dx += 1;
  if (touch.stickId !== null) dx = touch.stickX; // analog override

  const jump = kJump || touch.jumpDown;
  const run  = kRun  || (touch.stickId !== null && Math.abs(touch.stickX) > 0.65);
  return { dx, jump, run };
}

// ═══════════════════════════════════════════════════════════
// TILEMAP HELPERS
// ═══════════════════════════════════════════════════════════
function tileAt(c, r) {
  if (c < 0 || c >= COLS || r < 0) return T_SOLID;
  if (r >= ROWS) return T_SOLID;
  return map[r][c];
}
function solidAt(c, r) { return isSolid(tileAt(c, r)); }

// ═══════════════════════════════════════════════════════════
// PHYSICS — MOVE + COLLIDE
// ═══════════════════════════════════════════════════════════
function moveEntity(ent, dt, w, h, isPlayer) {
  let { x, y, vx, vy } = ent;
  let onGround = false, hitCeil = false;

  // ─── X ───
  x += vx * dt;
  {
    const ry1 = Math.floor(y / TILE);
    const ry2 = Math.floor((y + h - 1) / TILE);
    if (vx > 0) {
      const cx2 = Math.floor((x + w - 1) / TILE);
      for (let r = ry1; r <= ry2; r++) {
        if (solidAt(cx2, r)) { x = cx2 * TILE - w; vx = 0; break; }
      }
    } else if (vx < 0) {
      const cx1 = Math.floor(x / TILE);
      for (let r = ry1; r <= ry2; r++) {
        if (solidAt(cx1, r)) { x = (cx1 + 1) * TILE; vx = 0; break; }
      }
    }
  }

  // ─── Y ───
  y += vy * dt;
  {
    const cx1 = Math.floor(x / TILE);
    const cx2 = Math.floor((x + w - 1) / TILE);
    if (vy >= 0) {
      // Use floor(y+h) so landing exactly on a tile boundary is detected (prevents jitter)
      const ry2 = Math.floor((y + h) / TILE);
      for (let c = cx1; c <= cx2; c++) {
        if (solidAt(c, ry2)) {
          y = ry2 * TILE - h; vy = 0; onGround = true; break;
        }
      }
    } else {
      const ry1 = Math.floor(y / TILE);
      for (let c = cx1; c <= cx2; c++) {
        if (solidAt(c, ry1)) {
          y = (ry1 + 1) * TILE; hitCeil = true;
          if (isPlayer) hitBlockFromBelow(c, ry1);
          vy = 0; break;
        }
      }
    }
  }

  ent.x=x; ent.y=y; ent.vx=vx; ent.vy=vy;
  return { onGround, hitCeil };
}

// ─── Block bump logic ───
function hitBlockFromBelow(c, r) {
  const t = tileAt(c, r);
  if (t === T_QBLOCK && !qUsed[`${c},${r}`]) {
    qUsed[`${c},${r}`] = true;
    map[r][c] = T_QUSED;
    score += 200; coinCount++;
    popCoins.push({ x: c*TILE+TILE/2, y: r*TILE-2, vy: -130, life: 0.75, maxLife: 0.75 });
    spawnBurst(c*TILE+TILE/2, r*TILE+TILE/2, '#f8d800', 5, 1.0);
    updateHUD();
  } else if (t === T_BRICK) {
    map[r][c] = T_EMPTY;
    score += 50;
    spawnBrickDebris(c*TILE, r*TILE);
    updateHUD();
  }
}

// ─── Particles ───
function spawnBurst(x, y, color, n, life) {
  for (let i=0; i<n; i++) {
    const a = Math.random()*Math.PI*2;
    const s = 50 + Math.random()*90;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 70,
      life, maxLife: life, color, size: 2 + Math.random()*3 });
  }
}
function spawnBrickDebris(bx, by) {
  const colors = ['#c84818','#e07040','#804018'];
  for (let i=0; i<6; i++) {
    const side = i%2 ? 1 : -1;
    const c = colors[i%3];
    particles.push({ x: bx+TILE/2, y: by+TILE/2,
      vx: side*(50+Math.random()*100), vy: -210-Math.random()*130,
      life: 0.65, maxLife: 0.65, color: c, size: 4+Math.random()*3 });
  }
}

// ═══════════════════════════════════════════════════════════
// PLAYER UPDATE
// ═══════════════════════════════════════════════════════════
function updatePlayer(dt, inp) {
  if (player.dead) {
    player.deadT -= dt;
    player.vy += 1200 * dt;
    player.y  += player.vy * dt;
    if (player.deadT <= 0) {
      lives--;
      if (lives <= 0) { endDead(); return; }
      respawnPlayer();
    }
    return;
  }

  player.invincible = Math.max(0, player.invincible - dt);

  const maxSpd = inp.run ? RUN_SPEED : WALK_SPEED;
  const inAir  = !player.onGround;

  // ─── Jump buffer ───
  const jumpPressed = inp.jump && !prevJumpDown;
  if (jumpPressed) player.jumpBuf = JBUF_T;
  if (player.jumpBuf > 0) player.jumpBuf -= dt;

  // ─── Coyote time ───
  if (player.onGround) player.coyoteTime = COYOTE_T;
  else player.coyoteTime = Math.max(0, player.coyoteTime - dt);

  // ─── Execute jump ───
  if (player.jumpBuf > 0 && player.coyoteTime > 0) {
    player.vy = inp.run ? JUMP_VEL_RUN : JUMP_VEL_WALK;
    player.wasJumping = true;
    player.jumpBuf = 0;
    player.coyoteTime = 0;
  }

  // ─── Variable gravity ───
  let grav = GRAVITY_FALL;
  if (player.wasJumping && inp.jump && player.vy < 0) grav = GRAVITY_HOLD;
  if (!inp.jump) player.wasJumping = false;
  player.vy = Math.min(player.vy + grav * dt, MAX_FALL);

  // ─── Horizontal movement ───
  if (Math.abs(inp.dx) > 0.05) {
    const dir = Math.sign(inp.dx);
    const reversing = Math.sign(player.vx) !== 0 && Math.sign(player.vx) !== dir && Math.abs(player.vx) > 8;
    const acc = inAir ? AIR_ACC : (reversing ? SKID_ACC : WALK_ACC);
    player.vx += dir * acc * dt;
    // Clamp to max speed (allow some overshoot momentum when running into walk)
    if (Math.abs(player.vx) > maxSpd + 5) {
      player.vx = Math.sign(player.vx) * (maxSpd + 5);
    }
    player.skidding = reversing && !inAir;
    player.dir = dir;
  } else {
    const dec = (inAir ? AIR_DEC : GROUND_DEC) * dt;
    if (Math.abs(player.vx) < dec) player.vx = 0;
    else player.vx -= Math.sign(player.vx) * dec;
    player.skidding = false;
  }

  // ─── Move + collide ───
  const { onGround, hitCeil } = moveEntity(player, dt, PW, PH, true);
  player.onGround = onGround;
  if (onGround) player.wasJumping = false;
  if (hitCeil && player.vy > 0) player.vy = 0; // already set in moveEntity, just belt-and-suspenders

  // ─── Animation ───
  player.running = inp.run && Math.abs(player.vx) > WALK_SPEED * 0.7;
  if (!player.onGround) {
    player.frame = 3; // jump/fall
  } else if (Math.abs(player.vx) > 6) {
    const spd = Math.abs(player.vx);
    player.frameT += dt;
    const rate = 0.12 - spd / 3000;
    if (player.frameT > rate) { player.frameT = 0; player.frame = (player.frame + 1) % 3; }
  } else {
    player.frame = 0; player.frameT = 0;
  }

  // ─── Off-screen death ───
  if (player.y > ROWS * TILE + 48) killPlayer();

  // ─── Coin collection ───
  const pcx = player.x + PW/2, pcy = player.y + PH/2;
  coins.forEach(coin => {
    if (coin.collected) return;
    if (Math.abs(coin.x - pcx) < PW + 7 && Math.abs(coin.y - pcy) < PH + 7) {
      coin.collected = true;
      score += 100; coinCount++;
      spawnBurst(coin.x, coin.y, '#f8d800', 4, 0.45);
      updateHUD();
    }
  });

  // ─── Flag ───
  if (!flagReached && player.x + PW > FLAG_COL * TILE) {
    flagReached = true;
    score += 1000;
    updateHUD();
    setTimeout(endWin, 1600);
  }

  // ─── Enemy collision ───
  for (const en of enemies) {
    if (en.dead || en.squished) continue;
    const px1=player.x, px2=player.x+PW, py1=player.y, py2=player.y+PH;
    const ex1=en.x, ex2=en.x+EW, ey1=en.y, ey2=en.y+EH;
    if (px2>ex1 && px1<ex2 && py2>ey1 && py1<ey2) {
      // Stomp check: player descending, feet near top of enemy
      if (player.vy > 50 && py2 - ey1 < 10 && py1 < ey2 - 4) {
        en.squished = true; en.squishT = 0.35;
        score += 200; updateHUD();
        player.vy = STOMP_VEL;
        spawnBurst(en.x+EW/2, en.y+EH/2, '#a04820', 6, 0.5);
      } else if (player.invincible <= 0) {
        killPlayer();
        break;
      }
    }
  }
}

function killPlayer() {
  if (player.dead || player.invincible > 0) return;
  player.dead = true; player.deadT = 1.4;
  player.vy = -290; player.vx = 0;
  spawnBurst(player.x+PW/2, player.y+PH/2, '#f04040', 8, 0.7);
}

function respawnPlayer() {
  player.x = spawnX; player.y = 15*TILE - PH;
  player.vx = 0; player.vy = 0;
  player.dead = false; player.invincible = 2;
  player.onGround = false; player.wasJumping = false;
  player.frame = 0; player.frameT = 0;
  updateHUD();
}

// ═══════════════════════════════════════════════════════════
// ENEMY UPDATE
// ═══════════════════════════════════════════════════════════
function updateEnemies(dt) {
  enemies.forEach(en => {
    if (en.dead) { en.deadT -= dt; return; }
    if (en.squished) {
      en.squishT -= dt;
      if (en.squishT <= 0) { en.dead = true; en.deadT = 0.4; }
      return;
    }
    en.vy = Math.min(en.vy + GRAVITY_FALL * dt, MAX_FALL);
    const { onGround } = moveEntity(en, dt, EW, EH, false);
    en.onGround = onGround;

    // Turn at walls and ledge edges
    if (onGround) {
      const fc = Math.floor((en.x + (en.vx > 0 ? EW + 1 : -1)) / TILE);
      const bottomR = Math.floor((en.y + EH + 1) / TILE);
      const wallAhead = solidAt(fc, Math.floor((en.y + EH/2) / TILE));
      const floorAhead = solidAt(fc, bottomR);
      if (wallAhead || !floorAhead) en.vx = -en.vx;
    }

    en.walkT += dt;
    if (en.walkT > 0.25) { en.walkT = 0; en.walkFrame = (en.walkFrame + 1) % 2; }
  });
}

// ═══════════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════════
function updateCamera(dt) {
  // Lead ahead in direction of movement
  const lead = player.dir * 70 + player.vx * 0.2;
  const targetX = player.x + PW/2 - IW/2 + lead;
  const clampedX = Math.max(0, Math.min(COLS*TILE - IW, targetX));
  // Smooth follow with spring
  const stiffness = 7;
  camX += (clampedX - camX) * Math.min(1, stiffness * dt);
}

// ═══════════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════════
let hudScore = 0, hudLives = 3, hudCoins = 0;
function updateHUD() { hudScore = score; hudLives = lives; hudCoins = coinCount; }

// ═══════════════════════════════════════════════════════════
// DRAWING
// ═══════════════════════════════════════════════════════════

// ─── Background ───
function drawBg(t) {
  // Animated gradient sky
  const sky = ctx.createLinearGradient(0, 0, 0, IH);
  sky.addColorStop(0,   '#080828');
  sky.addColorStop(0.5, '#1a1060');
  sky.addColorStop(1,   '#3820a0');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, IW, IH);

  // Stars (twinkle)
  ctx.fillStyle = '#ffffff';
  const rng = mulberry32(42);
  for (let i = 0; i < 55; i++) {
    const sx = rng() * IW;
    const sy = rng() * (IH * 0.6);
    const blink = Math.sin(t * 2.5 + i * 1.7) * 0.5 + 0.5;
    ctx.globalAlpha = 0.4 + blink * 0.6;
    ctx.fillRect(Math.round(sx), Math.round(sy), 1, 1);
  }
  ctx.globalAlpha = 1;

  // Distant mountain silhouette
  ctx.fillStyle = '#14084a';
  for (let x = 0; x < IW; x++) {
    const mx = x + camX * 0.15;
    const h = 40 + Math.sin(mx * 0.012) * 18 + Math.sin(mx * 0.031) * 10;
    ctx.fillRect(x, Math.round(IH - 60 - h), 1, Math.round(h + 60));
  }
  ctx.fillStyle = '#0e0638';
  for (let x = 0; x < IW; x++) {
    const mx = x + camX * 0.3;
    const h = 28 + Math.sin(mx * 0.019) * 12 + Math.sin(mx * 0.047) * 6;
    ctx.fillRect(x, Math.round(IH - 40 - h), 1, Math.round(h + 40));
  }
}

// ─── Tiles ───
function drawTiles() {
  const c1 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c2 = Math.min(COLS - 1, Math.ceil((camX + IW) / TILE) + 1);
  for (let r = 0; r < ROWS; r++) {
    for (let c = c1; c <= c2; c++) {
      const t = map[r][c];
      if (t === T_EMPTY) continue;
      const px = Math.round(c * TILE - camX);
      const py = r * TILE;
      drawTile(t, px, py, c, r);
    }
  }
}

function drawTile(t, px, py, c, r) {
  switch(t) {
    case T_GROUND: drawGround(px, py, c, r); break;
    case T_SOLID:  drawGround(px, py, c, r); break;
    case T_BRICK:  drawBrick(px, py); break;
    case T_QBLOCK: drawQBlock(px, py); break;
    case T_QUSED:  drawQUsed(px, py); break;
    case T_PIPE_T: drawPipeTop(px, py, c); break;
    case T_PIPE_B: drawPipeBody(px, py, c); break;
  }
}

function drawGround(px, py, c, r) {
  ctx.fillStyle = '#5c4020';
  ctx.fillRect(px, py, TILE, TILE);
  // Top grass — draw if no solid tile directly above
  const aboveClear = r === 0 || !map[r-1] || !isSolid(map[r-1][c]);
  if (aboveClear) {
    ctx.fillStyle = '#3a7a2a';
    ctx.fillRect(px, py, TILE, 3);
    ctx.fillStyle = '#4a9a34';
    ctx.fillRect(px+1, py+1, 2, 1);
    ctx.fillRect(px+5, py, 2, 2);
    ctx.fillRect(px+10, py+1, 2, 1);
  }
  // Highlight left, dark right
  ctx.fillStyle = '#7a5830';
  ctx.fillRect(px, py+3, 1, TILE-3);
  ctx.fillStyle = '#3a2810';
  ctx.fillRect(px+TILE-1, py+3, 1, TILE-3);
  // Bottom shade
  ctx.fillStyle = '#2a1808';
  ctx.fillRect(px, py+TILE-1, TILE, 1);
}

function drawBrick(px, py) {
  ctx.fillStyle = '#b83c18';
  ctx.fillRect(px, py, TILE, TILE);
  // Mortar lines
  ctx.fillStyle = '#7a2010';
  ctx.fillRect(px, py+6, TILE, 1);
  ctx.fillRect(px+8, py, 1, 6);
  ctx.fillRect(px+4, py+7, 1, TILE-7);
  ctx.fillRect(px+12, py+7, 1, TILE-7);
  // Highlight
  ctx.fillStyle = '#e06040';
  ctx.fillRect(px, py, TILE, 1);
  ctx.fillRect(px, py, 1, 6);
}

function drawQBlock(px, py) {
  ctx.fillStyle = '#c89000';
  ctx.fillRect(px, py, TILE, TILE);
  // Inner lighter
  ctx.fillStyle = '#e8b000';
  ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
  // ? symbol
  ctx.fillStyle = '#fff';
  ctx.fillRect(px+6, py+4, 2, 1);
  ctx.fillRect(px+5, py+3, 4, 1);
  ctx.fillRect(px+5, py+2, 4, 1);
  ctx.fillRect(px+4, py+1, 6, 1);
  ctx.fillRect(px+4, py+0, 6, 1);  // 0 rel to tile not py
  // Recompute: ? mark within the tile
  ctx.fillStyle = '#80600a';
  ctx.fillRect(px+1, py+1, TILE-2, 1);
  ctx.fillRect(px+1, py+1, 1, TILE-2);
  ctx.fillStyle = '#f0c820';
  ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
  // Draw ?
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('?', px+TILE/2, py+TILE-3);
  ctx.textAlign = 'left';
  // Border
  ctx.fillStyle = '#c89000';
  ctx.fillRect(px, py, TILE, 1);
  ctx.fillRect(px, py+TILE-1, TILE, 1);
  ctx.fillRect(px, py, 1, TILE);
  ctx.fillRect(px+TILE-1, py, 1, TILE);
}

function drawQUsed(px, py) {
  ctx.fillStyle = '#806040';
  ctx.fillRect(px, py, TILE, TILE);
  ctx.fillStyle = '#604828';
  ctx.fillRect(px+1, py+1, TILE-2, TILE-2);
  // Highlight
  ctx.fillStyle = '#a07850';
  ctx.fillRect(px, py, TILE, 1);
  ctx.fillRect(px, py, 1, TILE);
}

function drawPipeTop(px, py, c) {
  // Determine left vs right half of pipe
  const isLeft = (c % 2 === 0) || (c > 0 && map[Math.floor(py/TILE)]
    && map[Math.floor(py/TILE)][c-1] !== T_PIPE_T && map[Math.floor(py/TILE)][c-1] !== T_PIPE_B);
  // Cap top (wider than body)
  ctx.fillStyle = '#207028';
  ctx.fillRect(px-2, py, TILE+4, TILE);
  ctx.fillStyle = '#309038';
  ctx.fillRect(px-1, py, TILE+2, 3);
  ctx.fillStyle = '#50c060';
  ctx.fillRect(px, py, TILE, 1);
  ctx.fillStyle = '#106018';
  ctx.fillRect(px-2, py+TILE-1, TILE+4, 1);
}

function drawPipeBody(px, py, c) {
  ctx.fillStyle = '#207028';
  ctx.fillRect(px+1, py, TILE-2, TILE);
  ctx.fillStyle = '#309038';
  ctx.fillRect(px+2, py, 3, TILE);
  ctx.fillStyle = '#106018';
  ctx.fillRect(px+TILE-3, py, 2, TILE);
}

// ─── Flag ───
function drawFlag() {
  const px = Math.round(FLAG_COL * TILE - camX);
  const py = 7 * TILE;
  const ph = 15 * TILE - py;
  // Pole
  ctx.fillStyle = '#b0b0b0';
  ctx.fillRect(px + TILE/2 - 1, py, 3, ph);
  ctx.fillStyle = '#d8d8d8';
  ctx.fillRect(px + TILE/2 - 1, py, 1, ph);
  // Flag
  const flagY = py + Math.sin(Date.now() / 400) * 2;
  ctx.fillStyle = '#e03030';
  ctx.fillRect(px + TILE/2 + 2, Math.round(flagY), 14, 10);
  ctx.fillStyle = '#f05050';
  ctx.fillRect(px + TILE/2 + 2, Math.round(flagY), 14, 2);
  // Ball on top
  ctx.fillStyle = '#f8d800';
  ctx.beginPath();
  ctx.arc(px + TILE/2, py, 4, 0, Math.PI*2);
  ctx.fill();
}

// ─── Player sprite ───
function drawPlayer() {
  const p = player;
  const px = Math.round(p.x - camX);
  const py = Math.round(p.y);

  // Flicker when invincible
  if (p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0) return;

  ctx.save();
  ctx.translate(px + PW/2, py + PH);
  if (p.dir < 0) ctx.scale(-1, 1);

  // ── sprite drawn relative to (0,0) = feet center ──
  const f = p.frame; // 0=stand, 1=walk1, 2=walk2, 3=jump

  // Legs
  if (f === 3) {
    // Jump pose: legs apart
    ctx.fillStyle = '#1840a0';
    ctx.fillRect(-5, -6, 4, 5);
    ctx.fillRect(1, -6, 4, 5);
    ctx.fillStyle = '#c82020'; // shoes
    ctx.fillRect(-6, -4, 4, 3);
    ctx.fillRect(2, -2, 4, 3);
  } else {
    // Walk cycle
    const l1 = f === 1 ? -1 : (f === 2 ? 2 : 0);
    const l2 = f === 1 ? 2 : (f === 2 ? -1 : 0);
    ctx.fillStyle = '#1840a0';
    ctx.fillRect(-5, -5 + l1, 4, 5);
    ctx.fillRect(1, -5 + l2, 4, 5);
    ctx.fillStyle = '#c82020'; // shoes
    ctx.fillRect(-5, -2 + l1, 5, 2);
    ctx.fillRect(1, -2 + l2, 5, 2);
  }

  // Body / overalls
  ctx.fillStyle = '#1840a0';
  ctx.fillRect(-5, -13, 10, 7);
  // Overall bib lighter
  ctx.fillStyle = '#2050c8';
  ctx.fillRect(-3, -12, 6, 5);

  // Head (skin)
  ctx.fillStyle = '#f8c078';
  ctx.fillRect(-5, -20, 10, 8);

  // Eyes
  ctx.fillStyle = '#101010';
  ctx.fillRect(1, -18, 2, 2);

  // Nose
  ctx.fillStyle = '#e8a060';
  ctx.fillRect(-1, -15, 3, 1);

  // Mustache
  ctx.fillStyle = '#704020';
  ctx.fillRect(-3, -14, 7, 1);

  // Cap body
  ctx.fillStyle = '#c01818';
  ctx.fillRect(-5, -24, 10, 5);
  // Cap brim
  ctx.fillRect(-6, -20, 12, 2);
  // Cap highlight
  ctx.fillStyle = '#e02020';
  ctx.fillRect(-4, -24, 8, 1);

  // Overalls straps
  ctx.fillStyle = '#2858d0';
  ctx.fillRect(-2, -14, 1, 3);
  ctx.fillRect(1, -14, 1, 3);

  // Running sparkle
  if (p.running && p.onGround && Math.random() < 0.4) {
    ctx.fillStyle = '#fff';
    const sx = -4 + Math.random()*8, sy = -1 + Math.random()*2;
    ctx.fillRect(sx, sy, 1, 1);
  }

  ctx.restore();
}

// ─── Enemy sprite (round Goomba-like) ───
function drawEnemies(t) {
  enemies.forEach(en => {
    if (en.dead) return;
    const ex = Math.round(en.x - camX);
    const ey = Math.round(en.y);
    const sq = en.squished;

    ctx.save();
    ctx.translate(ex + EW/2, ey + EH);
    if (en.vx > 0) ctx.scale(-1, 1);

    if (sq) {
      // Squished flat
      ctx.fillStyle = '#8b4010';
      ctx.fillRect(-EW/2, -3, EW, 3);
      ctx.fillStyle = '#c05020';
      ctx.fillRect(-EW/2+1, -2, EW-2, 1);
      // Squished eyes
      ctx.fillStyle = '#101010';
      ctx.fillRect(-4, -2, 2, 1);
      ctx.fillRect(2, -2, 2, 1);
    } else {
      // Body
      ctx.fillStyle = '#9b4510';
      ctx.beginPath();
      ctx.ellipse(0, -EH/2, EW/2, EH/2, 0, 0, Math.PI*2);
      ctx.fill();
      // Highlight
      ctx.fillStyle = '#c06828';
      ctx.beginPath();
      ctx.ellipse(-2, -EH/2-2, 3, 3, 0, 0, Math.PI*2);
      ctx.fill();
      // Feet (walk animation)
      const fw = en.walkFrame === 0 ? -1 : 1;
      ctx.fillStyle = '#502008';
      ctx.fillRect(-EW/2-1, -2, 4, 3);
      ctx.fillRect(EW/2-3+fw, -2, 4, 3);
      // Eyes
      ctx.fillStyle = '#fff';
      ctx.fillRect(-4, -EH+2, 3, 3);
      ctx.fillRect(1, -EH+2, 3, 3);
      ctx.fillStyle = '#101010';
      ctx.fillRect(-3, -EH+3, 2, 1);
      ctx.fillRect(2, -EH+3, 2, 1);
      // Angry eyebrows
      ctx.fillStyle = '#200800';
      ctx.fillRect(-5, -EH+1, 4, 1);
      ctx.fillRect(1, -EH+1, 4, 1);
    }

    ctx.restore();
  });
}

// ─── Coins ───
function drawCoins(dt) {
  coins.forEach(coin => {
    if (coin.collected) return;
    coin.bobT += dt;
    const ex = Math.round(coin.x - camX);
    const ey = Math.round(coin.y + Math.sin(coin.bobT * 3) * 2);
    const r = 4;
    // Glow
    ctx.fillStyle = '#f8d80040';
    ctx.beginPath();
    ctx.arc(ex, ey, r+3, 0, Math.PI*2);
    ctx.fill();
    // Coin
    ctx.fillStyle = '#f8d800';
    ctx.beginPath();
    ctx.arc(ex, ey, r, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffe840';
    ctx.beginPath();
    ctx.arc(ex-1, ey-1, 2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#c09800';
    ctx.beginPath();
    ctx.arc(ex+1, ey+1, 1, 0, Math.PI*2);
    ctx.fill();
  });
}

// ─── Particles ───
function drawParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 600 * dt;
    p.life -= dt;
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x - camX - p.size/2), Math.round(p.y - p.size/2), p.size, p.size);
  });
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);
}

// ─── Pop coins (from ? blocks) ───
function drawPopCoins(dt) {
  popCoins.forEach(pc => {
    pc.y += pc.vy * dt;
    pc.vy += 500 * dt;
    pc.life -= dt;
    const a = Math.min(1, pc.life / pc.maxLife * 2);
    ctx.globalAlpha = a;
    ctx.fillStyle = '#f8d800';
    ctx.fillRect(Math.round(pc.x - camX - 4), Math.round(pc.y - 4), 8, 8);
    ctx.fillStyle = '#fff';
    ctx.font = '7px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('+200', Math.round(pc.x - camX), Math.round(pc.y - 8));
    ctx.textAlign = 'left';
  });
  ctx.globalAlpha = 1;
  popCoins = popCoins.filter(pc => pc.life > 0);
}

// ─── HUD ───
function drawHUD() {
  ctx.fillStyle = '#000a';
  ctx.fillRect(0, 0, IW, 18);
  ctx.fillStyle = '#f8d800';
  ctx.font = 'bold 10px "Courier New",monospace';
  ctx.fillText(`♥${hudLives}`, 6, 12);
  ctx.fillText(`⬤${hudCoins}`, 40, 12);
  ctx.fillText(`${hudScore}`, IW/2 - 20, 12);
  ctx.fillStyle = '#a0a0a0';
  ctx.textAlign = 'right';
  ctx.fillText('EERI #' + levelSeed, IW - 6, 12);
  ctx.textAlign = 'left';
}

// ─── Touch controls overlay ───
function drawTouchControls() {
  // Stick indicator on left
  if (touch.stickId !== null) {
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(IW * 0.2, IH - 36, 24, 0, Math.PI*2);
    ctx.fill();
    // Knob
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(IW * 0.2 + touch.stickX * 16, IH - 36, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(IW * 0.2, IH - 36, 24, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 0.08;
    ctx.beginPath();
    ctx.arc(IW * 0.2, IH - 36, 12, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Jump button on right
  const ja = touch.jumpDown ? 0.6 : 0.18;
  ctx.globalAlpha = ja;
  ctx.fillStyle = '#e03030';
  ctx.beginPath();
  ctx.arc(IW * 0.85, IH - 36, 22, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.globalAlpha = touch.jumpDown ? 0.9 : 0.5;
  ctx.fillText('A', IW * 0.85, IH - 31);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
let lastTime = 0, gameTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (gameState !== 'play') return;

  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  gameTime += dt;

  const inp = getInput();
  updatePlayer(dt, inp);
  updateEnemies(dt);
  updateCamera(dt);
  prevJumpDown = inp.jump;

  // ─── Draw ───
  ctx.clearRect(0, 0, IW, IH);
  drawBg(gameTime);
  drawFlag();
  drawTiles();
  drawCoins(dt);
  drawEnemies(gameTime);
  if (!player.dead || player.deadT > 0.8) drawPlayer();
  drawParticles(dt);
  drawPopCoins(dt);
  drawHUD();
  drawTouchControls();
}

// ═══════════════════════════════════════════════════════════
// STATE TRANSITIONS
// ═══════════════════════════════════════════════════════════
function startGame(newLevel = true) {
  if (newLevel) levelSeed = 10000 + Math.floor(Math.random() * 90000);
  initGame();
  updateHUD();
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('over-dead').style.display = 'none';
  document.getElementById('over-win').style.display = 'none';
  gameState = 'play';
  lastTime = performance.now();
}

function endDead() {
  gameState = 'dead';
  document.getElementById('dead-msg').textContent =
    `Score: ${score}  ·  Coins: ${coinCount}`;
  document.getElementById('over-dead').style.display = 'flex';
}

function endWin() {
  gameState = 'win';
  document.getElementById('win-msg').textContent =
    `Score: ${score}  ·  Coins: ${coinCount}  ·  Stage clear!`;
  document.getElementById('over-win').style.display = 'flex';
}

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
function mulberry32(seed) {
  let s = seed;
  return function() {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ═══════════════════════════════════════════════════════════
// BUTTON LISTENERS
// ═══════════════════════════════════════════════════════════
document.getElementById('btn-start').addEventListener('click', () => startGame(true));
document.getElementById('btn-retry').addEventListener('click', () => startGame(false)); // same seed, same level
document.getElementById('btn-again').addEventListener('click', () => startGame(true));

// Start the render loop (menu screen can still show bg)
requestAnimationFrame(loop);
</script>
