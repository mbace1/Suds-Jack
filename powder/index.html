<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Powder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #1a1226; overflow: hidden; touch-action: none; height: 100%; }
    body { cursor: crosshair; }
    #game { display: block; width: 100vw; height: 100vh; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 4; }

    .ui {
      font-family: 'Courier New', monospace; color: #f0e6d2;
      text-shadow: 0 2px 6px rgba(20,10,30,.85); user-select: none; letter-spacing: 1px;
    }

    /* telemetry cluster — instruments, not a scoreboard */
    #cluster { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .panel {
      position: absolute;
      background: linear-gradient(180deg, rgba(29,23,38,.62), rgba(29,23,38,.34));
      border: 1px solid rgba(240,230,210,.22);
      border-radius: 3px; padding: 9px 13px;
      backdrop-filter: blur(3px);
    }
    .lbl { font-size: 9px; letter-spacing: 2.5px; opacity: .62; }
    .val { font-size: 27px; font-weight: bold; line-height: 1.05; }
    .val small { font-size: 11px; opacity: .6; letter-spacing: 1px; }
    .row { display: flex; gap: 16px; }
    .bar { height: 7px; background: rgba(240,230,210,.14); border-radius: 2px; overflow: hidden; margin-top: 3px; }
    .bar > i { display: block; height: 100%; width: 0%; background: #8fe8d8; transition: width .06s linear; }

    #speedo { left: 18px; bottom: 18px; min-width: 168px; }
    #speedo .val { font-size: 44px; }
    #eng { left: 18px; bottom: 132px; min-width: 168px; }
    #dyn { right: 18px; bottom: 18px; min-width: 158px; text-align: right; }
    #race { right: 18px; top: 18px; min-width: 158px; text-align: right; }
    #nav { left: 50%; top: 16px; transform: translateX(-50%); text-align: center; min-width: 250px; }
    #nav #compass { font-size: 17px; font-weight: bold; letter-spacing: 2px; }
    #race .val { font-size: 30px; }

    #msg {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 12; text-align: center; pointer-events: none;
      font-size: 20px; line-height: 1.85; font-weight: bold;
      background: rgba(29,23,38,.66); padding: 26px 40px;
      border: 1px solid rgba(240,230,210,.3); border-radius: 4px;
      backdrop-filter: blur(6px);
    }
    #msg b { font-size: 36px; letter-spacing: 6px; }
    #msg small { font-size: 12px; letter-spacing: 1px; line-height: 2.3; font-weight: normal; }
    #toast {
      position: fixed; bottom: 21%; left: 50%; transform: translateX(-50%);
      z-index: 11; font-size: 20px; font-weight: bold; letter-spacing: 4px;
      pointer-events: none; display: none; color: #8fe8d8;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="ui"></canvas>

  <div id="cluster" class="ui">
    <div class="panel" id="speedo">
      <div class="lbl">GROUND SPEED</div>
      <div class="val"><span id="kph">0</span> <small>KM/H</small></div>
      <div class="lbl" style="margin-top:6px">HULL</div>
      <div class="bar"><i id="dmg" style="background:#ff8a5c"></i></div>
    </div>

    <div class="panel" id="eng">
      <div class="lbl">TURBINE N1</div>
      <div class="val"><span id="n1">0</span> <small>%</small></div>
      <div class="bar"><i id="n1bar"></i></div>
      <div class="lbl" style="margin-top:7px">TGT</div>
      <div class="bar"><i id="heat"></i></div>
    </div>

    <div class="panel" id="dyn">
      <div class="row" style="justify-content:flex-end">
        <div><div class="lbl">LAT G</div><div class="val" style="font-size:20px"><span id="glat">0.00</span></div></div>
        <div><div class="lbl">SLIP</div><div class="val" style="font-size:20px"><span id="slip">0.0</span></div></div>
        <div><div class="lbl">GAP</div><div class="val" style="font-size:20px"><span id="gap">2.6</span></div></div>
      </div>
      <div class="lbl" style="margin-top:5px" id="surf">SALT PAN</div>
    </div>

    <div class="panel" id="race">
      <div class="lbl">CLOCK</div>
      <div class="val"><span id="time">60.0</span></div>
      <div class="row" style="justify-content:flex-end;margin-top:5px">
        <div><div class="lbl">GATES</div><div class="val" style="font-size:18px"><span id="gate">0</span></div></div>
        <div><div class="lbl">RIFT s</div><div class="val" style="font-size:18px"><span id="rift">0</span></div></div>
        <div><div class="lbl">POS</div><div class="val" style="font-size:18px"><span id="pos">1/5</span></div></div>
      </div>
    </div>

    <div class="panel" id="nav">
      <div class="lbl">NEXT GATE</div>
      <div id="compass">RIFT  0m  AHEAD</div>
    </div>
  </div>

  <div id="msg" class="ui"></div>
  <div id="toast" class="ui"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
