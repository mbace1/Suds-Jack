<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark">
  <title>Toko Drop</title>
  <link rel="icon" href="data:,">
  <style>
    /* --void (and theme-color above) are pre-boot copies of TUNING.render.clearColor;
       main.js sets both from it once it runs. */
    :root { --ink: #d9dce2; --dim: #6c707a; --void: #050506; --fault: #ff6a5c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--void); overflow: hidden; }
    body {
      touch-action: none;            /* no pinch, no pull-to-refresh: this is a game surface */
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      color: var(--ink);
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    /* The version, always on screen: "is this the build I think it is" is the
       first question every phone test asks. */
    #ver {
      position: fixed; z-index: 5; pointer-events: none;
      right: max(12px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 13px; letter-spacing: .08em; color: var(--ink); opacity: .82;
    }
    #backend { color: var(--dim); }
    :root { --gold: #f0c040; --amber: #ffb468; --line: rgba(217, 220, 226, .22); }
    #sticks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #hud[hidden] { display: none; }
    #scorebox { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #score { font-size: 22px; letter-spacing: .06em; }
    #mult { margin-left: 8px; color: var(--amber); font-size: 15px; }
    #lives { display: flex; gap: 6px; margin-top: 6px; }
    #lives i { width: 10px; height: 10px; border-radius: 50%; background: #f2efe6; box-shadow: 0 0 6px rgba(242, 239, 230, .6); }
    #fx { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; max-width: min(48vw, 420px); font-size: 11px; letter-spacing: .08em; }
    #fx span { white-space: nowrap; text-shadow: 0 0 6px currentColor; }
    /* MENU sits where 1.x had it, over the clock, top right; the clock under it (owner, 2026-10-24) */
    #clock { position: absolute; right: max(14px, env(safe-area-inset-right)); top: calc(max(6px, env(safe-area-inset-top)) + 52px); font-size: 16px; letter-spacing: .1em; color: var(--amber); text-align: right; max-width: 44vw; }
    @media (max-width: 480px) { #clock { font-size: 13px; letter-spacing: .05em; } }
    #pausebtn { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); pointer-events: auto;
      min-width: 64px; height: 44px; padding: 0 14px; background: rgba(8, 8, 16, .45); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 14px; letter-spacing: .14em; }
    #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,20,20,0) 35%, rgba(255,20,20,.55) 105%); }
    #vignette.on { animation: vig .32s linear forwards; }
    @keyframes vig { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #vignette.on { animation: none; } }
    /* the banner sits in the band under the HUD, clear of the pause button and
       of the floor — never over the middle of the fight (owner, 2026-10-24) */
    #banner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(12px, env(safe-area-inset-top)) + 84px); width: max-content; max-width: min(64vw, 720px);
      padding: 3px 14px; text-align: center; text-wrap: balance; font-size: clamp(13px, 2.4vw, 20px); letter-spacing: min(.22em, .8vw); color: var(--amber);
      background: rgba(8, 8, 16, .55); border-radius: 3px; pointer-events: none; z-index: 5; text-shadow: 0 0 10px rgba(255, 180, 104, .35); }
    #banner[hidden] { display: none; }
    #banner.pop { animation: pop .5s ease-out; }
    @keyframes pop { from { transform: translateX(-50%) translateY(-6px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; width: min(92vw, 460px); max-height: 92vh; overflow-y: auto;
      padding: 18px 18px 14px; background: rgba(5, 5, 6, .82); border: 1px solid var(--line); text-align: center; touch-action: pan-y; }
    #menu[hidden] { display: none; }
    #menu .logo { margin: 2px 0 14px; }
    #menu .logo .name { display: block; font-size: clamp(28px, 7vw, 40px); letter-spacing: .32em; font-weight: 800; }
    #menu .logo .num { display: block; margin-top: 4px; color: var(--amber); letter-spacing: .4em; }
    #menu h2 { font-size: 20px; letter-spacing: .25em; margin: 4px 0 10px; font-weight: 700; }
    #menu h2.win { color: var(--amber); }
    #menu .mode { color: var(--dim); letter-spacing: .3em; margin-bottom: 10px; }
    #menu .item { display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 12px; background: none; color: var(--ink);
      border: 1px solid var(--line); font: inherit; text-align: left; cursor: pointer; }
    #menu .item .label { display: block; font-size: 17px; letter-spacing: .2em; }
    #menu .item .sub { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: var(--dim); letter-spacing: .04em; }
    #menu .item .chart { display: block; width: 100%; max-width: 220px; height: 34px; margin: 6px auto 0; }
    #menu .item .teaches { display: block; margin-top: 3px; font-size: 10px; font-weight: 400; color: var(--dim); opacity: .75; letter-spacing: .04em; }
    #menu .route-wrap { display: flex; justify-content: center; width: 100%; margin: 2px 0 8px; }
    #menu .route-wrap .route { display: block; max-width: 100%; margin: 0 auto; }
    /* the campaign's grid: a row per world, its name then its five rooms */
    #menu .grid { display: grid; grid-template-columns: minmax(56px, auto) repeat(5, minmax(42px, 68px)); gap: 6px; justify-content: center; align-items: center; margin: 4px 0 10px; }
    #menu .grid .wname { font-size: 9px; letter-spacing: .12em; text-align: right; padding-right: 4px; line-height: 1.25; max-width: 96px; }
    #menu .tile { position: relative; aspect-ratio: 1; min-height: 42px; padding: 0; background: rgba(255,255,255,.03); color: var(--ink); border: 1px solid rgba(255,255,255,.22); font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #menu .tile .num { position: absolute; left: 4px; top: 2px; font-size: 9px; color: var(--dim); }
    #menu .tile .grade { position: absolute; right: 4px; bottom: 1px; font-size: 13px; font-weight: 800; }
    #menu .tile.off { opacity: .35; cursor: default; }
    #menu .tile.focus { outline: 2px solid var(--gold); outline-offset: 2px; border-color: var(--gold); }
    @media (max-width: 480px) { #menu .grid { grid-template-columns: repeat(5, minmax(40px, 1fr)); } #menu .grid .wname { grid-column: 1 / -1; text-align: left; margin-top: 2px; max-width: none; } }
    /* a room's card: what it asks, its chart, its lines, START */
    #menu h2.card { color: var(--amber); }
    #menu .goal { letter-spacing: .14em; margin: 2px 0 8px; }
    #menu canvas.chart { display: block; margin: 4px auto 6px; max-width: 100%; }
    #menu > .teaches { font-size: 10px; color: var(--dim); letter-spacing: .04em; margin: 0 0 4px; }
    #menu > .skills { font-size: 11px; color: var(--amber); letter-spacing: .06em; margin: 0 0 8px; }
    #menu .tiers { display: grid; grid-template-columns: auto auto; gap: 3px 14px; justify-content: center; text-align: left; margin: 4px 0 8px; font-size: 13px; }
    #menu .tiers .tg { font-weight: 800; }
    #menu .best { margin: 4px 0 6px; letter-spacing: .1em; font-size: 12px; }
    #menu .item.go .label { font-size: 22px; letter-spacing: .3em; }
    #menu .item.focus { outline: 2px solid var(--gold); outline-offset: 2px; border-color: var(--gold); }
    #menu .item.focus .label { color: var(--gold); }
    #menu .item.off { opacity: .45; cursor: default; }
    #menu .row { display: flex; gap: 8px; }
    #menu .row .item { flex: 1 1 0; min-width: 0; }
    #menu .row .item .label { font-size: 14px; letter-spacing: .12em; }
    /* the start row: ARCADE as large as the other modes, INTRO narrow beside it */
    #menu .row.start .item .label { font-size: 17px; letter-spacing: .2em; }
    #menu .row.start .item.narrow { flex: 0 0 34%; }
    #menu .row.start .item.narrow .label { font-size: 15px; letter-spacing: .16em; }
    #menu .row.start .item.hard { flex: 0 0 42%; }
    #menu .row.start .item.hard .label { font-size: 13px; letter-spacing: .08em; white-space: nowrap; }
    #menu .row.start .item.hard .sub { font-size: 10px; }
    /* a phone held sideways is ~400 px tall: two columns, so the whole title
       (the test switches included) shows without scrolling */
    @media (orientation: landscape) and (max-height: 520px) {
      #menu { width: min(94vw, 820px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; align-content: start; }
      #menu > .logo, #menu > .hint, #menu > h2, #menu > .mode, #menu > .stats, #menu > .world, #menu > .played, #menu > .gelcard, #menu > .grid, #menu > .route-wrap, #menu > .goal, #menu > canvas.chart, #menu > .teaches, #menu > .skills, #menu > .tiers, #menu > .best, #menu > .row.start { grid-column: 1 / -1; }
      #menu .logo { margin: 0 0 4px; }
      #menu .item { margin: 5px 0; }
      #menu .hint { margin-top: 6px; }
      /* the campaign's six rows fit a phone held sideways without scrolling */
      #menu .grid { grid-template-columns: minmax(56px, auto) repeat(5, 42px); gap: 4px; margin: 2px 0 6px; }
      #menu > .mode.camp { display: none; }
      #menu h2 { margin: 0 0 4px; }
      #menu .tile { min-height: 0; }
      #menu > .mode { margin-bottom: 4px; }
    }
    #menu .hint { margin-top: 12px; font-size: 10px; font-weight: 400; line-height: 1.5; color: var(--dim); letter-spacing: .06em; }
    #menu .stats { display: grid; grid-template-columns: auto auto; gap: 6px 16px; justify-content: center; margin: 4px 0 12px; text-align: left; }
    #menu .stats dt { color: var(--dim); letter-spacing: .15em; }
    /* the CAMPAIGN's room list (v25): a world's name over its rooms */
    #menu .world { margin: 12px 0 2px; font-size: 11px; letter-spacing: .2em; color: var(--dim); text-align: left; }
    #menu .played { margin: 2px 0 8px; font-size: 13px; letter-spacing: .08em; }
    /* the GOT YOU card (v22): the gel, alive in its box (render/specimen.js), and how to read it */
    #menu .gelcard { display: flex; gap: 12px; align-items: center; margin: 6px 0 12px; padding: 8px; border: 1px solid var(--gel, #555); text-align: left; }
    #menu .gelcard .specimen { flex: 0 0 auto; width: 104px; height: 88px; }
    #menu .gelcard .words { min-width: 0; }
    #menu .gelcard .head { margin: 0; font-size: 10px; letter-spacing: .2em; color: var(--dim); }
    #menu .gelcard .name { margin: 2px 0 4px; font-size: 17px; letter-spacing: .14em; color: var(--gel, var(--ink)); font-weight: 700; }
    #menu .gelcard .line { margin: 0; font-size: 11px; line-height: 1.45; color: var(--ink); opacity: .8; }
    #menu .stats dd { letter-spacing: .06em; }
    #fault {
      position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
      max-width: min(92vw, 640px); max-height: 60vh; overflow: auto;
      padding: 10px 12px; border: 1px solid var(--fault); background: rgba(5, 5, 6, .92);
      color: var(--fault); font-weight: 400; line-height: 1.4; white-space: pre-wrap;
      user-select: text; -webkit-user-select: text; touch-action: pan-y; z-index: 10;
    }
    #fault[hidden] { display: none; }
  </style>
  <!-- three.js r186, vendored (vendor/README.md). One renderer path: the WebGPU
       build. 'three' and 'three/webgpu' are the SAME URL, so three loads once. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.webgpu.js?v=r186",
      "three/webgpu": "./vendor/three/three.webgpu.js?v=r186",
      "three/tsl": "./vendor/three/three.tsl.js?v=r186"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <canvas id="sticks"></canvas>
  <div id="hud" hidden>
    <div id="scorebox"><span id="score">0</span><span id="mult"></span><div id="lives"></div><div id="fx"></div></div>
    <button id="pausebtn" aria-label="menu">≡ MENU</button>
    <div id="clock"></div>
  </div>
  <div id="banner" hidden></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="ver">2.0 · v40<span id="backend"></span></div>
  <pre id="fault" hidden></pre>
  <script>
    // A failure must be visible on the phone: there is no console there.
    // Capture phase, because a module that fails to load fires `error` on its
    // <script> element, which does not bubble to window. main.js also routes
    // three's own errors here (shader compiles, GPU validation, device loss).
    // Each message shows once, and the box stops growing after 40: an error
    // that repeats every frame must not flood the page it is reporting on.
    (function () {
      var box = document.getElementById('fault'), seen = Object.create(null), lines = [], status = '', button = null;
      function render() {
        box.hidden = !lines.length && !status;
        box.textContent = lines.join('\n') + (status ? (lines.length ? '\n' : '') + status : '');
        if (button) box.appendChild(button);
      }
      function fault(msg) {
        msg = String(msg);
        if (seen[msg] || lines.length >= 40) return;
        seen[msg] = true; lines.push(msg); render();
      }
      function say(msg) { status = msg; render(); }
      window.__fault = fault;
      // A game of ~200 modules is ~200 downloads, and ONE that drops on a
      // phone's connection fails the whole load. The browser then remembers
      // that failure for the life of the page, so importing again here cannot
      // recover; only a fresh page can. So: check every file at once, past the
      // cache (which also replaces a bad copy the cache may hold), and reload,
      // at most twice in two minutes. Past that, name the file and offer the
      // button (v40; the phone hit this at v31 and v39).
      var KEY = 'toko2.reloads';
      function reloads() { try { var r = JSON.parse(sessionStorage.getItem(KEY) || 'null'); return r && Date.now() - r.t < 120000 ? r.n : 0; } catch (e) { return 9; } }
      function reloadSoon(ms) {
        var n = reloads();
        if (n >= 2) return false;
        try { sessionStorage.setItem(KEY, JSON.stringify({ n: n + 1, t: Date.now() })); } catch (e) { return false; }
        setTimeout(function () { location.reload(); }, ms);
        return true;
      }
      function offerReload() {
        button = document.createElement('button');
        button.textContent = 'RELOAD';
        button.style.cssText = 'display:block;margin-top:10px;min-height:44px;padding:0 18px;font:inherit;letter-spacing:.14em;color:inherit;background:none;border:1px solid currentColor';
        button.onclick = function () { try { sessionStorage.removeItem(KEY); } catch (e) {} location.reload(); };
        render();
      }
      // (main.js clears the count once the game is up)
      function check(src) {
        var urls = Object.create(null), queue = [], bad = [], active = 0, done = 0, total = 0;
        return new Promise(function (resolve) {
          function add(u) { if (urls[u]) return; urls[u] = true; total++; queue.push(u); }
          function pump() {
            while (active < 6 && queue.length) one(queue.shift());
            if (!active && !queue.length) resolve(bad);
          }
          function one(u) {
            active++;
            var ctl = window.AbortController ? new AbortController() : null, timer = setTimeout(function () { if (ctl) ctl.abort(); }, 15000);
            fetch(u, { cache: 'reload', signal: ctl ? ctl.signal : undefined }).then(function (r) {
              if (!r.ok) { bad.push(r.status + ' ' + u); return; }
              return r.text().then(function (t) {
                var re = /(?:import|export)[^'"]*?from\s*['"](\.{1,2}\/[^'"]+)['"]|import\s*['"](\.{1,2}\/[^'"]+)['"]/g, m;
                while ((m = re.exec(t))) add(new URL(m[1] || m[2], u).href);
              });
            }).catch(function (err) { bad.push('no answer: ' + u + ' (' + (err && err.message ? err.message : err) + ')'); })
              .then(function () { clearTimeout(timer); active--; done++; say('checking the files: ' + done + ' / ' + total); pump(); });
          }
          add(src);
          // and what the import map points bare names at (three), which no relative import names
          try { var map = JSON.parse(document.querySelector('script[type="importmap"]').textContent).imports; for (var k in map) add(new URL(map[k], location.href).href); } catch (er) {}
          pump();
        });
      }
      addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) {
          var u = el.src || el.href;
          if (el.type === 'module' && el.src && !el.dataset.checked) {
            el.dataset.checked = '1';
            var again = reloads();
            fault((again ? 'it failed again (' + (again + 1) + ' tries): ' : 'a file did not arrive: ') + u.split('/').slice(-2).join('/'));
            // which browser, and whether the arcade's worker stood in the way: what a screenshot needs to say
            var ua = navigator.userAgent, ver = (ua.match(/(?:Chrome|Firefox|Version)\/(\d+)/) || [])[1] || '?';
            fault('browser: ' + (/; wv\)/.test(ua) ? 'in-app WebView ' : /CriOS|Chrome/.test(ua) ? 'Chrome ' : /Firefox/.test(ua) ? 'Firefox ' : /Safari/.test(ua) ? 'Safari ' : '') + ver +
              ((navigator.serviceWorker && navigator.serviceWorker.controller) ? ' · the arcade\'s worker' : '') + (navigator.onLine === false ? ' · offline' : ''));
            check(u).then(function (bad) {
              bad.slice(0, 3).forEach(function (b) { fault('the file that failed: ' + b); });
              if (reloadSoon(bad.length ? 1500 : 300)) say(bad.length ? 'loading again…' : 'every file is there now — loading again…');
              else { say(bad.length ? 'still failing — check the connection, then' : 'every file is there now'); offerReload(); }
            });
            return;
          }
          fault('failed to load ' + u);
          return;
        }
        var where = e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '';
        fault((e.message || 'error') + where);
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        fault('unhandled: ' + (r && r.message ? r.message : r));
      });
    })();
  </script>
  <script type="module" src="js/main.js?v=40"></script>
</body>
</html>
