<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark">
  <title>Toko Drop</title>
  <link rel="icon" href="data:,">
  <style>
    /* --void (and theme-color above) are pre-boot copies of TUNING.render.clearColor;
       main.js sets both from it once it runs. */
    :root { --ink: #d9dce2; --dim: #6c707a; --void: #050506; --fault: #ff6a5c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--void); overflow: hidden; }
    body {
      touch-action: none;            /* no pinch, no pull-to-refresh: this is a game surface */
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      color: var(--ink);
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    /* The version, always on screen: "is this the build I think it is" is the
       first question every phone test asks. */
    #ver {
      position: fixed; z-index: 5; pointer-events: none;
      right: max(12px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 13px; letter-spacing: .08em; color: var(--ink); opacity: .82;
    }
    #backend { color: var(--dim); }
    :root { --gold: #f0c040; --amber: #ffb468; --line: rgba(217, 220, 226, .22); }
    #sticks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
    #hud[hidden] { display: none; }
    #scorebox { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #score { font-size: 22px; letter-spacing: .06em; }
    #mult { margin-left: 8px; color: var(--amber); font-size: 15px; }
    #lives { display: flex; gap: 6px; margin-top: 6px; }
    #lives i { width: 10px; height: 10px; border-radius: 50%; background: #f2efe6; box-shadow: 0 0 6px rgba(242, 239, 230, .6); }
    #clock { position: absolute; right: max(14px, env(safe-area-inset-right)); top: max(12px, env(safe-area-inset-top)); font-size: 16px; letter-spacing: .1em; color: var(--amber); }
    #pausebtn { position: absolute; left: 50%; top: max(6px, env(safe-area-inset-top)); transform: translateX(-50%); pointer-events: auto;
      width: 64px; height: 44px; background: none; border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 14px; letter-spacing: .1em; }
    #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,20,20,0) 35%, rgba(255,20,20,.55) 105%); }
    #vignette.on { animation: vig .32s linear forwards; }
    @keyframes vig { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #vignette.on { animation: none; } }
    #banner { position: fixed; left: 0; right: 0; top: 26%; text-align: center; font-size: clamp(22px, 5vw, 40px); letter-spacing: .3em; color: var(--amber);
      pointer-events: none; z-index: 5; text-shadow: 0 0 18px rgba(255, 180, 104, .45); }
    #banner[hidden] { display: none; }
    #banner.pop { animation: pop .5s ease-out; }
    @keyframes pop { from { transform: scale(1.25); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; width: min(92vw, 460px); max-height: 92vh; overflow-y: auto;
      padding: 18px 18px 14px; background: rgba(5, 5, 6, .82); border: 1px solid var(--line); text-align: center; touch-action: pan-y; }
    #menu[hidden] { display: none; }
    #menu .logo { margin: 2px 0 14px; }
    #menu .logo .name { display: block; font-size: clamp(28px, 7vw, 40px); letter-spacing: .32em; font-weight: 800; }
    #menu .logo .num { display: block; margin-top: 4px; color: var(--amber); letter-spacing: .4em; }
    #menu h2 { font-size: 20px; letter-spacing: .25em; margin: 4px 0 10px; font-weight: 700; }
    #menu h2.win { color: var(--amber); }
    #menu .mode { color: var(--dim); letter-spacing: .3em; margin-bottom: 10px; }
    #menu .item { display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 12px; background: none; color: var(--ink);
      border: 1px solid var(--line); font: inherit; text-align: left; cursor: pointer; }
    #menu .item .label { display: block; font-size: 17px; letter-spacing: .2em; }
    #menu .item .sub { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: var(--dim); letter-spacing: .04em; }
    #menu .item.focus { outline: 2px solid var(--gold); outline-offset: 2px; border-color: var(--gold); }
    #menu .item.focus .label { color: var(--gold); }
    #menu .item.off { opacity: .45; cursor: default; }
    #menu .row { display: flex; gap: 8px; }
    #menu .row .item { flex: 1 1 0; min-width: 0; }
    #menu .row .item .label { font-size: 14px; letter-spacing: .12em; }
    /* a phone held sideways is ~400 px tall: two columns, so the whole title
       (the test switches included) shows without scrolling */
    @media (orientation: landscape) and (max-height: 520px) {
      #menu { width: min(94vw, 820px); display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; align-content: start; }
      #menu > .logo, #menu > .hint, #menu > h2, #menu > .mode, #menu > .stats { grid-column: 1 / -1; }
      #menu .logo { margin: 0 0 4px; }
      #menu .item { margin: 5px 0; }
      #menu .hint { margin-top: 6px; }
    }
    #menu .hint { margin-top: 12px; font-size: 10px; font-weight: 400; line-height: 1.5; color: var(--dim); letter-spacing: .06em; }
    #menu .stats { display: grid; grid-template-columns: auto auto; gap: 6px 16px; justify-content: center; margin: 4px 0 12px; text-align: left; }
    #menu .stats dt { color: var(--dim); letter-spacing: .15em; }
    #menu .stats dd { letter-spacing: .06em; }
    #fault {
      position: fixed; left: max(10px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
      max-width: min(92vw, 640px); max-height: 60vh; overflow: auto;
      padding: 10px 12px; border: 1px solid var(--fault); background: rgba(5, 5, 6, .92);
      color: var(--fault); font-weight: 400; line-height: 1.4; white-space: pre-wrap;
      user-select: text; -webkit-user-select: text; touch-action: pan-y; z-index: 10;
    }
    #fault[hidden] { display: none; }
  </style>
  <!-- three.js r186, vendored (vendor/README.md). One renderer path: the WebGPU
       build. 'three' and 'three/webgpu' are the SAME URL, so three loads once. -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.webgpu.js?v=r186",
      "three/webgpu": "./vendor/three/three.webgpu.js?v=r186",
      "three/tsl": "./vendor/three/three.tsl.js?v=r186"
    }
  }
  </script>
</head>
<body>
  <div id="stage"></div>
  <canvas id="sticks"></canvas>
  <div id="hud" hidden>
    <div id="scorebox"><span id="score">0</span><span id="mult"></span><div id="lives"></div></div>
    <button id="pausebtn" aria-label="pause">II</button>
    <div id="clock"></div>
  </div>
  <div id="banner" hidden></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="menu" class="menu" hidden></div>
  <div id="ver">2.0 · v12<span id="backend"></span></div>
  <pre id="fault" hidden></pre>
  <script>
    // A failure must be visible on the phone: there is no console there.
    // Capture phase, because a module that fails to load fires `error` on its
    // <script> element, which does not bubble to window. main.js also routes
    // three's own errors here (shader compiles, GPU validation, device loss).
    // Each message shows once, and the box stops growing after 40: an error
    // that repeats every frame must not flood the page it is reporting on.
    (function () {
      var box = document.getElementById('fault'), seen = Object.create(null), shown = 0;
      function fault(msg) {
        msg = String(msg);
        if (seen[msg] || shown >= 40) return;
        seen[msg] = true; shown++;
        box.hidden = false;
        box.textContent += msg + '\n';
      }
      window.__fault = fault;
      addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) { fault('failed to load ' + (el.src || el.href)); return; }
        var where = e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '';
        fault((e.message || 'error') + where);
      }, true);
      addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        fault('unhandled: ' + (r && r.message ? r.message : r));
      });
    })();
  </script>
  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
