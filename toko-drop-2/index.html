    /* --void (and theme-color above) are pre-boot copies of TUNING.render.clearColor;
       main.js sets both from it once it runs. */
    :root { --ink: #d9dce2; --dim: #6c707a; --void: #050506; --fault: #ff6a5c; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: var(--void); overflow: hidden; }
    body {
      touch-action: none;            /* no pinch, no pull-to-refresh: this is a game surface */
      user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      font: 600 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
      color: var(--ink);
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    /* The version, always on screen: "is this the build I think it is" is the
       first question every phone test asks. */
    #ver {
      position: fixed; z-index: 5; pointer-events: none;
      right: max(12px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom));
      font-size: 13px; letter-spacing: .08em; color: var(--ink); opacity: .82;
    }
    #backend { color: var(--dim); }
    :root { --gold: #f0c040; --amber: #ffb468; --line: rgba(217, 220, 226, .22); }
    #sticks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
    /* a dark edge on the HUD's text, so it reads over world 2's sunlit slab as over the night (v66); v121: a tight dark
       outline under it, for the ice's snow, where a soft shadow alone left white text on white */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 4;
      text-shadow: 0 0 1px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.75), 0 0 10px rgba(0,0,0,.3); }
    #hud[hidden] { display: none; }
    #scorebox { position: absolute; left: max(14px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top)); }
    #score { font-size: 22px; letter-spacing: .06em; }
    #mult { margin-left: 8px; color: var(--amber); font-size: 15px; }
    /* HEAT (v51): the ×, hotter as it climbs, a bar for how far into it you are, and BANK's pot */
    #mult[data-m="3"], #mult[data-m="4"] { color: #ff9a4a; }
    #mult[data-m="5"], #mult[data-m="6"] { color: #ff6a3a; font-size: 17px; }
    #mult[data-m="7"], #mult[data-m="8"] { color: #ff4a4a; font-size: 19px; text-shadow: 0 0 2px rgba(0,0,0,.8), 0 0 10px rgba(255,80,60,.7); }
    #mult[data-m="w"] { color: #fff; font-size: 21px; text-shadow: 0 0 2px rgba(0,0,0,.85), 0 0 12px rgba(255,235,220,.85), 0 0 3px #ff6a3a; }
    #pot { margin-left: 8px; color: var(--gold); font-size: 13px; }
    #mult { display: inline-block; transform-origin: left center; }
    #mult.pop { animation: heat-pop .32s ease-out; }
    #mult.cold { animation: heat-cold .6s ease-out; }
    @keyframes heat-pop { 0% { transform: scale(1.9); } 100% { transform: scale(1); } }
    @keyframes heat-cold { 0% { color: #8fd8ff; transform: scale(1.4); text-shadow: 0 0 12px #6cf; } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { #mult.pop, #mult.cold { animation: none; } }
    #heat { width: 92px; height: 3px; margin: 3px 0 2px; background: rgba(255,255,255,.12); box-shadow: 0 0 0 1px rgba(0,0,0,.28); }
    #heat > i { display: block; height: 100%; width: 0; background: var(--amber); }
    #heat[data-m="5"] > i, #heat[data-m="6"] > i { background: #ff6a3a; }
    #heat[data-m="7"] > i, #heat[data-m="8"] > i { background: #ff4a4a; }
    #heat[data-m="w"] > i { background: #fff; }
    #menu .mutator { font-size: 11px; color: var(--gold); letter-spacing: .04em; margin: 2px 0 4px; }
    #lives { display: flex; gap: 6px; margin-top: 6px; }
    /* v121: a dark ring round each life, so the three read on the ice's snow as well as on the night */
    #lives i { width: 10px; height: 10px; border-radius: 50%; background: #f2efe6; box-shadow: 0 0 0 1.5px rgba(10, 10, 20, .55), 0 0 6px rgba(242, 239, 230, .5), 0 1px 2px rgba(0, 0, 0, .6); }
    #fx { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; max-width: min(48vw, 420px); font-size: 11px; letter-spacing: .08em; }
    #fx span { white-space: nowrap; text-shadow: 0 0 1px rgba(0,0,0,.95), 0 0 6px currentColor, 0 1px 2px rgba(0,0,0,.75); }
    /* MENU sits where 1.x had it, over the clock, top right; the clock under it (owner, 2026-10-24). v121: the clock and
       a boss's bar stand in one column, so the bar is always under however many lines the clock has */
    #hudr { position: absolute; right: max(14px, env(safe-area-inset-right)); top: calc(max(6px, env(safe-area-inset-top)) + 52px);
      display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
    #clock { font-size: 16px; letter-spacing: .1em; color: var(--amber); text-align: right; max-width: 56vw; white-space: nowrap; }
    /* v121: a room's clock is two lines — the goal, then its seconds and the grade it is on course for, kept whole
       (one line broke wherever a phone's width ran out: "F →" over "C 36k") */
    #clock .ln { display: block; white-space: normal; }
    #clock .ln.whole { white-space: nowrap; }
    @media (max-width: 480px) { #clock { font-size: 13px; letter-spacing: .05em; } }
    /* a boss wave's health (v42): under the clock, every boss of the wave in one bar */
    #bossbar { width: min(44vw, 240px); height: 6px; border: 1px solid var(--line); background: rgba(8, 8, 16, .5); }
    #bossbar[hidden] { display: none; }
    #bossbar i { display: block; height: 100%; width: 100%; transition: width .15s linear; }
    #pausebtn { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(6px, env(safe-area-inset-top)); pointer-events: auto;
      min-width: 64px; height: 44px; padding: 0 14px; background: rgba(8, 8, 16, .45); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 14px; letter-spacing: .14em; }
    #hud.dying #pausebtn { visibility: hidden; }   /* v125: the death beat — the button does nothing then (the state audit) */
    #hud.under #pausebtn { visibility: hidden; }   /* v121: under a panel (the pause, OPTIONS) the run's MENU button is not shown */
    #vignette { position: fixed; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(ellipse at center, rgba(255,20,20,0) 35%, rgba(255,20,20,.55) 105%); }
    #vignette.on { animation: vig .32s linear forwards; }
    @keyframes vig { from { opacity: 1; } to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #vignette.on { animation: none; } }
    /* the banner sits in the band under the HUD, clear of the pause button and
       of the floor — never over the middle of the fight (owner, 2026-10-24) */
    #banner { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(12px, env(safe-area-inset-top)) + 84px); width: max-content; max-width: min(64vw, 720px);
      padding: 3px 14px; text-align: center; text-wrap: balance; font-size: clamp(13px, 2.4vw, 20px); letter-spacing: min(.22em, .8vw); color: var(--amber);
      background: rgba(8, 8, 16, .55); border-radius: 3px; pointer-events: none; z-index: 5; text-shadow: 0 0 10px rgba(255, 180, 104, .35); }
    #banner[hidden] { display: none; }
    #banner.pop { animation: pop .5s ease-out; }
    /* v109: a card — a boss's name in the banner's band as it comes in, WORLD CLEAR in the middle once the fight is
       over (owner: "finished world 1 quite abruptly"); big letters, the banner's amber, a dark plate, no glow */
    #card { position: fixed; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(86vw, 820px); padding: 8px 22px 9px;
      text-align: center; background: rgba(8, 8, 16, .62); border-radius: 4px; pointer-events: none; z-index: 5; color: var(--amber); }
    #card.band { top: calc(max(12px, env(safe-area-inset-top)) + 80px); padding: 4px 16px 5px; }
    #card.band .t { font-size: clamp(17px, 3.2vw, 30px); }
    #card.band .s { margin-top: 2px; font-size: clamp(9px, 1.4vw, 12px); }
    #card.center { top: 38%; }
    #card[hidden] { display: none; }
    #card .t { font-size: clamp(22px, 5.2vw, 46px); letter-spacing: min(.16em, .9vw); line-height: 1.05; }
    #card .s { margin-top: 4px; font-size: clamp(11px, 1.9vw, 16px); letter-spacing: min(.3em, .9vw); opacity: .85; }
    #card.pop { animation: cardIn .45s ease-out; }
    @keyframes cardIn { from { transform: translateX(-50%) scale(1.12); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #card.pop { animation: none; } }
    @keyframes pop { from { transform: translateX(-50%) translateY(-6px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
    #menu { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; width: min(92vw, 460px); max-height: 92vh; overflow-y: auto;
      padding: 18px 18px 14px; background: rgba(5, 5, 6, .82); border: 1px solid var(--line); text-align: center; touch-action: pan-y; }
    #menu[hidden] { display: none; }
    /* v89: the title wears the logo the icon wears (1.x's brushed mark, scripts/itch-logo-1x.png, inlined below as
       --logo so no file travels with it); "no need for 2.0" (owner), so no numeral under it */
    #menu .logo { width: min(62vw, 300px); aspect-ratio: 684 / 416; margin: 2px auto 12px; background: var(--logo) center / contain no-repeat;
      filter: drop-shadow(0 2px 10px rgba(0,0,0,.55)); }
    #menu h2 { font-size: 20px; letter-spacing: .25em; margin: 4px 0 10px; font-weight: 700; }
    #menu h2.win { color: var(--amber); }
    #menu .mode { color: var(--dim); letter-spacing: .3em; margin-bottom: 10px; }
    #menu .item { display: block; width: 100%; min-height: 48px; margin: 8px 0; padding: 10px 12px; background: none; color: var(--ink);
      border: 1px solid var(--line); font: inherit; text-align: left; cursor: pointer; }
    #menu .item .label { display: block; font-size: 17px; letter-spacing: .2em; }
    #menu .item .sub { display: block; margin-top: 4px; font-size: 11px; font-weight: 400; color: var(--dim); letter-spacing: .04em; }
    #menu .item .chart { display: block; width: 100%; max-width: 220px; height: 34px; margin: 6px auto 0; }
    #menu .item .teaches { display: block; margin-top: 3px; font-size: 10px; font-weight: 400; color: var(--dim); opacity: .75; letter-spacing: .04em; }
    #menu .route-wrap { display: flex; justify-content: center; width: 100%; margin: 2px 0 8px; }
    #menu .route-wrap .route { display: block; max-width: 100%; margin: 0 auto; }
    /* the campaign's grid: a row per world, its name then its rooms (--cols, set by ui.js) */
    #menu .grid { display: grid; grid-template-columns: minmax(56px, auto) repeat(var(--cols, 6), minmax(42px, 68px)); gap: 6px; justify-content: center; align-items: center; margin: 4px 0 10px; }
    #menu .grid .wname { font-size: 9px; letter-spacing: .12em; text-align: right; padding-right: 4px; line-height: 1.25; max-width: 96px; }
    #menu .tile { position: relative; aspect-ratio: 1; min-height: 42px; padding: 0; background: rgba(255,255,255,.03); color: var(--ink); border: 1px solid rgba(255,255,255,.22); font: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #menu .tile .num { position: absolute; left: 4px; top: 2px; font-size: 9px; color: var(--dim); }
    #menu .tile .grade { position: absolute; right: 4px; bottom: 1px; font-size: 13px; font-weight: 800; }
    #menu .tile.off { opacity: .35; cursor: default; }
    #menu .tile.focus { outline: 2px solid var(--gold); outline-offset: 2px; border-color: var(--gold); }
    @media (max-width: 480px) { #menu .grid { grid-template-columns: repeat(var(--cols, 6), minmax(40px, 1fr)); } #menu .grid .wname { grid-column: 1 / -1; text-align: left; margin-top: 2px; max-width: none; } }
    /* a room's card: what it asks, its chart, its lines, START */
