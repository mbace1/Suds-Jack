ottom:6px;width:88px;height:88px;font-size:13px}#control-menu{display:none;position:fixed;right:12px;top:max(54px,calc(env(safe-area-inset-top) + 42px));z-index:20;background:#080b08;border:1px solid #58623d;padding:8px;gap:6px;flex-direction:column}#control-menu.open{display:flex}#control-menu button,#gear{appearance:none;border:1px solid #58623d;background:#0d120c;color:#c8ee5a;font:12px monospace;padding:8px 10px}#gear{display:none;position:fixed;right:12px;top:max(12px,env(safe-area-inset-top));z-index:21;pointer-events:auto}body.touch #gear{display:block}</style></head><body><canvas id="screen" width="320" height="192"></canvas><button id="gear" aria-label="Controls">CONTROLS</button><div id="control-menu"><button data-scheme="sticks">DUAL STICKS</button><button data-scheme="buttons">BUTTONS</button></div><div id="touch-ui"><div class="stick left-stick" data-stick="left"></div><div class="stick right-stick" data-stick="right"></div></div><div id="buttons"><div class="dpad"><button class="key up" data-game-key="up">▲</button><button class="key left" data-game-key="left">◀</button><button class="key down" data-game-key="down">▼</button><button class="key right" data-game-key="right">▶</button></div><button class="key jump" data-game-key="jump">JUMP</button></div><script type="module" src="../hub/shell.js?v=29"></script><script type="module" src="js/sprite-proof-v24.js?v=36"></script><script type="module">import{sign}from'../toko/js/signature.js?v=3';sign({corner:'bottom-left',counter:true});</script></body></html>
