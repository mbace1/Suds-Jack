<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Flash Prince — animation bench</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100%;
      overflow: hidden;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* The picture is 320x192 and it is upscaled with hard pixels. Everything
       inside it is already quantised to sixteen colours by the time it gets
       here, so there is nothing left for the browser to soften. */
    #screen {
      display: block;
      width: 100vw; height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      user-select: none;
    }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #c2cede; background: #000;
      font: 13px/1.7 'Courier New', ui-monospace, monospace;
      letter-spacing: .18em; text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="boot">loading</div>

  <!-- the arcade shell: a way back to the hub, and a controller binding for it -->
  <script type="module" src="../hub/shell.js?v=34"></script>
  <script type="module" src="js/main.js?v=47"></script>

  <!-- signed by Toko Midori Games — the badge in the corner, under the HUD,
       taking no input. See ../toko/BRAND.md. It sits bottom-left because the
       health marks are top-right and the way home is top-left. -->
  <script type="module">
    import { sign } from '../toko/js/signature.js?v=1';
    sign({ corner: 'bottom-left' });
  </script>

  <script type="module">
    document.getElementById('boot').remove();
  </script>
</body>
</html>
