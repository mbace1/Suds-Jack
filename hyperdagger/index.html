<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hyper Dagger</title>
  <link rel="manifest" href="manifest.webmanifest?v=71">
  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020202; color: #e8dcc8; font-family: system-ui, sans-serif; }
    #canvas-game, #canvas-ui { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    #canvas-ui { pointer-events: none; }
    #msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,0.72); z-index: 10; padding: 1.5rem; }
    #msg h1 { font-size: 2.2rem; letter-spacing: 0.08em; margin-bottom: 0.4rem; }
    #msg .sub, #msg .keys, #msg .go, #msg .history, #msg .breakdown, #msg .cause { opacity: 0.85; margin: 0.35rem 0; max-width: 36rem; }
    #msg .big { font-size: 1.25rem; margin: 0.6rem 0; }
    #msg button { margin: 0.4rem; padding: 0.55rem 1rem; background: #2a221c; color: #e8dcc8; border: 1px solid #5a4a3a; cursor: pointer; font: inherit; }
    #msg button.on, #msg button.gfocus { border-color: #d8412f; background: #3a2820; }
    #timer, #kills, #gems, #style { position: absolute; z-index: 5; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
    #timer { top: 0.8rem; left: 50%; transform: translateX(-50%); font-size: 1.6rem; letter-spacing: 0.06em; }
    #kills, #gems { top: 0.9rem; font-size: 0.9rem; opacity: 0.75; }
    #kills { left: 1rem; } #gems { right: 1rem; }
    #style { bottom: 1.2rem; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.2s; text-align: center; }
    #styleRank { font-size: 1.4rem; font-weight: 700; } #styleMult { font-size: 0.85rem; opacity: 0.8; }
    #styleFill { height: 3px; width: 0; background: #c81e1e; margin: 0.2rem auto 0; max-width: 8rem; }
    #toast { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); z-index: 8; opacity: 0; transition: opacity 0.2s; pointer-events: none; letter-spacing: 0.1em; text-shadow: 0 1px 3px #000; }
    #toast.show { opacity: 1; }
    #crosshair { display: none; }
    #pauseBtn { position: absolute; top: 0.7rem; right: 0.7rem; z-index: 6; background: transparent; border: 0; color: #e8dcc8; opacity: 0.35; cursor: pointer; font-size: 1.2rem; }
    #pauseBtn:hover { opacity: 1; }
    #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(120,10,10,0.55) 100%); opacity: 0; z-index: 4; transition: opacity 0.15s; }
    body.in-run #msg { display: none; }
    /* THE ACTIVE FRAME. During a run the HUD is clock-only: kills, gems and
       the style badge are readable between runs, not mid-fight, and the
       arcade shell (pause, HOME, signature) retreats almost to nothing so
       the only chrome competing with the arena is the timer. Off-run
       everything returns. main.js already toggled body.in-run in all the
       right places and the gate already asserted this behaviour — the rules
       themselves were simply never written, so the gate was red by three. */
    body.in-run #kills,
    body.in-run #gems,
    body.in-run #style { display: none; }
    body.in-run #timer { font-size: 27px; }
    body.in-run #pauseBtn { opacity: 0.12; }
    body.in-run #pauseBtn:hover { opacity: 1; }
    body.in-run .arcade-home,
    /* !important because toko/js/signature.js sets opacity as an INLINE
       style, which beats a stylesheet rule. toko/ is the shared brand
       module five games import, so the override belongs here, not there. */
    body.in-run .toko-signature { opacity: 0.05 !important; }
    .arcade-home, .toko-signature, #pauseBtn { transition: opacity 0.35s ease; }
  </style>
</head>
<body>
  <canvas id="canvas-game"></canvas>
  <canvas id="canvas-ui"></canvas>
  <div id="vignette"></div>
  <div id="timer">0.0</div>
  <div id="kills">0 kills</div>
  <div id="gems">◆ 0 · LV 1</div>
  <div id="style"><div id="styleRank"></div><div id="styleMult"></div><div id="styleFill"></div></div>
  <div id="toast"></div>
  <div id="crosshair">+</div>
  <button id="pauseBtn" title="Pause">⏸</button>
  <div id="msg"></div>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js",
      "three/addons/": "./vendor/jsm/"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=71"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('sw.js?v=71').catch(() => {});
    }
  </script>
  <script type="module" src="../hub/shell.js?v=17"></script>
  <script type="module">
    import { sign } from '../toko/js/signature.js?v=3';
    sign({ corner: 'bottom-left', counter: true });
  </script>
</body>
</html>
