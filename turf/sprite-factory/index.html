<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF Sprite Factory</title><style>:root{color-scheme:dark;--bg:#11131a;--p:#1a1e28;--l:#343b4a;--t:#edf0f4;--m:#939cab;--g:#75c98b;--w:#d6aa5d;--b:#d66d6d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui}header,main{max-width:1240px;margin:auto;padding:18px}.panel,.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:14px;margin-bottom:14px}h1{font-size:22px;margin:0}h2{font-size:16px}.muted{color:var(--m)}button,select{background:#252b36;color:var(--t);border:1px solid var(--l);border-radius:5px;padding:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.n{font-size:24px;font-weight:700}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.candidate{border:1px solid var(--l);border-radius:7px;padding:9px}.candidate img,.preview img{width:100%;image-rendering:auto;background:#f0f}.badge{display:inline-block;padding:3px 6px;border-radius:4px;background:#313744}.approved{background:var(--g);color:#111}.rejected{background:var(--b)}.revise{background:var(--w);color:#111}.filters{display:flex;gap:8px;flex-wrap:wrap}.preview{display:flex;gap:8px;overflow:auto;align-items:end}.frame{min-width:120px}.frame small{display:block;color:var(--m);margin-top:4px}.empty{padding:18px;border:1px dashed var(--l);color:var(--m)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>TURF Sprite Factory</h1><div class="muted">Approved frames are the only production progress.</div></header><main><section class="stats" id="stats"></section><section class="panel"><h2>Candidate gallery</h2><div class="filters"><select id="char"></select><select id="action"></select><select id="direction"></select><select id="status"><option value="all">all statuses</option><option>candidate</option><option>revise</option><option>approved</option><option>rejected</option></select></div><div id="gallery" class="gallery" style="margin-top:12px"></div></section><section class="panel"><h2>Approved animation preview</h2><p class="muted">Only approved candidates appear. Missing phases stay visibly missing instead of being substituted.</p><div id="preview" class="preview"></div></section></main><script>(async()=>{const [m,c]=await Promise.all([fetch('./manifest.json').then(r=>r.json()),fetch('./candidates.json').then(r=>r.json())]);const $=s=>document.querySelector(s),records=c.records||[];$('#char').innerHTML=m.characters.map(x=>`<option value="${x.id}">${x.label}</option>`).join('');$('#action').innerHTML=Object.keys(m.actions).map(x=>`<option>${x}</option>`).join('');$('#direction').innerHTML=m.directions.map(x=>`<option>${x}</option>`).join('');function stats(){const approved=records.filter(x=>x.status==='approved').length,review=records.filter(x=>x.status==='candidate'||x.status==='revise').length,rejected=records.filter(x=>x.status==='rejected').length;$('#stats').innerHTML=`<div class="card"><div class="muted">Candidates</div><div class="n">${records.length}</div></div><div class="card"><div class="muted">Approved frames</div><div class="n">${approved}</div></div><div class="card"><div class="muted">Needs review</div><div class="n">${review}</div></div><div class="card"><div class="muted">Rejected</div><div class="n">${rejected}</div></div>`}function render(){const ch=$('#char').value,a=$('#action').value,d=$('#direction').value,s=$('#status').value;const list=records.filter(x=>x.character===ch&&x.action===a&&x.direction===d&&(s==='all'||x.status===s)).sort((x,y)=>x.frame-y.frame||x.revision-y.revision);$('#gallery').innerHTML=list.length?list.map(x=>`<article class="candidate">${x.asset?`<img src="${x.asset}" alt="${x.id}">`:''}<p><strong>${x.phase||'frame '+x.frame}</strong> · F${x.frame} v${x.revision}</p><span class="badge ${x.status}">${x.status}</span><p class="muted">${x.notes||''}</p></article>`).join(''):'<div class="empty">No candidates for this selection yet.</div>';const def=m.actions[a],approved=records.filter(x=>x.character===ch&&x.action===a&&x.direction===d&&x.status==='approved');$('#preview').innerHTML=Array.from({length:def.targetFrames},(_,i)=>{const f=i+1,x=approved.filter(r=>r.frame===f).sort((p,q)=>q.revision-p.revision)[0];return x?`<div class="frame"><img src="${x.asset}" alt="frame ${f}"><small>F${f} · ${def.phases?.[i]||''}</small></div>`:`<div class="frame empty">F${f}<small>${def.phases?.[i]||'missing'}</small></div>`}).join('')}[$('#char'),$('#action'),$('#direction'),$('#status')].forEach(x=>x.addEventListener('change',render));stats();render()})().catch(e=>document.querySelector('main').innerHTML=`<section class="panel rejected">Factory data failed to load: ${e.message}</section>`);</script></body></html>
