name: Stage C18 live overlay
on:
  push:
    branches: [deploy/piritori-c18-live]
    paths: ['.github/workflows/stage-c18-live.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_SHA: eb8cf6c86e2c36dc1e6fc6e8fe8749850f1a5079
      SOURCE_SHA: ef7b4785831aacf54cf00d77c5625b9e1c95f6d4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/piritori-c18-live
      - name: Overlay only the tested Piritori package and its hub metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re,json,hashlib,subprocess
          package=os.environ['PACKAGE_SHA'];source=os.environ['SOURCE_SHA']
          subprocess.run(['git','fetch','--depth=1','origin',package],check=True)
          def published(path): return subprocess.check_output(['git','show',f'{package}:{path}'])
          root='piritori-c17/'
          files=['web/crew-run/index.html','web/crew-run/startup.js','web/crew-run/style.css','web/crew-run/ui.js','web/fight-module/main.js','web/fight-module/tactical-ui.js','web/arena-lab/index.html','index.html','VERSIONS.md','release.json']
          for rel in files:
              p=Path(root+rel);assert p.is_file(),str(p);p.write_bytes(published(str(p)))
          receipt=json.loads(Path(root+'release.json').read_bytes())
          assert receipt['build']=='C.18' and receipt['tested_source_head']==source
          for rel,sha in receipt['sha256'].items():
              assert hashlib.sha256(Path(root+rel).read_bytes()).hexdigest()==sha,rel
          def card(text):
              start=text.index("    id: 'optionc-lab',");end=text.index('\n  },',start)
              return start,end,text[start:end]
          p=Path('hub/games.js');original=p.read_bytes().decode();start,end,_=card(original)
          _,_,replacement=card(published('hub/games.js').decode())
          assert 'C.18' in replacement and 'release=18' in replacement
          p.write_bytes((original[:start]+replacement+original[end:]).encode())
          assert "id: 'optionc'," not in p.read_text()
          p=Path('hub/versions.json');old=p.read_bytes().decode();new=published(str(p)).decode()
          pattern=r'"optionc-lab":\s*\{[^}]*\}';replacement=re.search(pattern,new)[0]
          old,count=re.subn(pattern,lambda _:replacement,old);assert count==1;p.write_bytes(old.encode())
          def change(path,old,new):
              p=Path(path);data=p.read_bytes();a=old.encode();b=new.encode()
              assert data.count(a)==1,(path,old,data.count(a));p.write_bytes(data.replace(a,b))
          game=int(re.search(r'games\.js\?v=(\d+)',Path('hub/hub.js').read_text())[1])
          hub=int(re.search(r'hub\.js\?v=(\d+)',Path('hub/hub-entry.js').read_text())[1])
          entry=int(re.search(r'hub-entry\.js\?v=(\d+)',Path('index.html').read_text())[1])
          sw=int(re.search(r"const VERSION = 'v(\d+)'",Path('sw.js').read_text())[1])
          change('hub/hub.js',f'games.js?v={game}',f'games.js?v={game+1}')
          change('hub/hub-entry.js',f'hub.js?v={hub}',f'hub.js?v={hub+1}')
          for path in ['index.html','AnotherHUB/index.html','sw.js']:
              change(path,f'hub-entry.js?v={entry}',f'hub-entry.js?v={entry+1}')
              change(path,f'hub.js?v={hub}',f'hub.js?v={hub+1}')
          change('sw.js',f'games.js?v={game}',f'games.js?v={game+1}')
          change('sw.js',f"const VERSION = 'v{sw}'",f"const VERSION = 'v{sw+1}'")
          allowed=set([root+f for f in files]+['hub/games.js','hub/versions.json','hub/hub.js','hub/hub-entry.js','index.html','AnotherHUB/index.html','sw.js'])
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          assert changed<=allowed,changed-allowed
          print(json.dumps({'build':receipt['build'],'source':source,'package':package,'changed':sorted(changed)}))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/piritori-test playwright
      - run: /tmp/piritori-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Real hub Play link to playable C18 with canvas pixels
        env:
          NODE_PATH: /tmp/piritori-test/node_modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/c18-live-review
          python3 -m http.server 8781 --bind 127.0.0.1 >/tmp/c18-live-server.log 2>&1 &
          cat > /tmp/c18-hub-check.cjs <<'JS'
          const {chromium}=require('playwright'),assert=require('node:assert/strict'),fs=require('node:fs');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--enable-unsafe-swiftshader','--use-angle=swiftshader']});
           const ctx=await browser.newContext({viewport:{width:412,height:915},hasTouch:true,isMobile:true}),p=await ctx.newPage(),errors=[];
           try{
            await p.addInitScript(()=>localStorage.setItem('tokoSting','1'));
            await p.goto('http://127.0.0.1:8781/?release=c18#optionc-lab');
            const card=p.locator('#cab-optionc-lab');await card.waitFor();assert.ok((await card.innerText()).includes('C.18'));assert.equal(await p.locator('#cab-optionc').count(),0);
            const play=card.locator('a.btn.play');assert.ok((await play.getAttribute('href')).includes('release=18'));await play.scrollIntoViewIfNeeded();await play.tap();await p.waitForURL('**/piritori-c17/web/crew-run/**');
            p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const idle=()=>p.waitForFunction(()=>window.fightModule&&!fightModule.metrics().busy&&!fightModule.metrics().layoutPaused,null,{timeout:90000});
            await idle();assert.ok((await p.locator('h1').innerText()).includes('C.18'));
            await p.locator('#crew-deploy').scrollIntoViewIfNeeded();await p.locator('#crew-deploy').tap();await idle();await p.screenshot({path:'/tmp/c18-live-review/phone-battle.png',timeout:90000});
            const before=await p.evaluate(()=>fightModule.snapshot());await p.locator('[data-action=move]').tap();await p.locator('#choices [data-cell]').first().tap();await p.locator('#tactical-preview').getByRole('button',{name:'Cancel',exact:true}).tap();assert.deepEqual(await p.evaluate(()=>fightModule.snapshot()),before);
            await p.locator('#end').tap();await idle();assert.notDeepEqual(await p.evaluate(()=>fightModule.snapshot()),before);
            const pixels=await p.evaluate(()=>new Promise((resolve,reject)=>{
             const first=fightModule.metrics().renderedFrames;const timer=setTimeout(()=>reject(Error('No new frame')),15000);
             function sample(){if(fightModule.metrics().renderedFrames<=first){requestAnimationFrame(sample);return;}try{
              const gl=document.querySelector('#scene').getContext('webgl2');if(!gl||gl.isContextLost()||gl.getParameter(gl.FRAMEBUFFER_BINDING)!==null)throw Error('No visible framebuffer');
              const data=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,data);if(gl.getError()!==gl.NO_ERROR)throw Error('Pixel read error');
              let lit=0,n=0;const colors=new Set();for(let i=0;i<data.length;i+=64){if((data[i]+data[i+1]+data[i+2])/3>12)lit++;n++;colors.add([data[i]>>4,data[i+1]>>4,data[i+2]>>4].join(','));}clearTimeout(timer);resolve({lit:lit/n,colors:colors.size});
             }catch(e){clearTimeout(timer);reject(e)}}requestAnimationFrame(sample);
            }));
            assert.ok(pixels.lit>.15&&pixels.colors>32);assert.deepEqual(errors,[]);
            const result={hubLaunch:true,build:'C.18',source:process.env.SOURCE_SHA,obsoleteCabinetAbsent:true,previewCancelFree:true,endRoundAdvances:true,pixels,errors,physicalDevice:false};fs.writeFileSync('/tmp/c18-live-review/result.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result));
           }finally{await ctx.close();await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/c18-hub-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c18-live-overlay-review
          path: /tmp/c18-live-review
          retention-days: 3
      - name: Commit the scoped tested overlay
        run: |
          rm .github/workflows/stage-c18-live.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Deploy C.18 unified UI and direct rendering without changing other cabinets'
          git push origin HEAD:deploy/piritori-c18-live
