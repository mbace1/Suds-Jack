name: Night Shift package integrity
on:
  pull_request:
    paths:
      - 'piritori-c17/**'
      - 'hub/games.js'
      - 'hub/hub.js'
      - 'hub/hub-entry.js'
      - 'hub/versions.json'
      - 'index.html'
      - 'sw.js'
      - 'test/piritori-c18-package.mjs'
      - 'test/piritori-c18-package-regressions.mjs'
      - 'test/piritori-c18-entry.cjs'
      - '.github/workflows/piritori-c18-package.yml'
permissions:
  contents: read
concurrency:
  group: night-shift-package-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  package-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test/piritori-c18-package-regressions.mjs
      - run: node test/piritori-c18-package.mjs
      - name: Check shipped presentation and offline shell
        run: |
          node --check piritori-c17/web/fight-module/readability.js
          node --check piritori-c17/web/fight-module/main.js
          node --check piritori-c17/web/crew-run/ui.js
          node --check sw.js
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,existsSync} from 'node:fs';
          import {resolve} from 'node:path';
          const sw=readFileSync('sw.js','utf8');
          const block=sw.match(/const SHELL = \[([\s\S]*?)\];/)?.[1];assert.ok(block);
          const entries=[...block.matchAll(/'([^']+)'/g)].map(m=>m[1]);
          assert.equal(new Set(entries).size,entries.length);assert.ok(entries.length>20);
          assert.match(sw,/const VERSION = 'v\d+';/);
          for(const entry of entries)assert.ok(existsSync(resolve(entry.split('?')[0])),entry+' must exist');
          for(const file of ['index.html','hub/hub-entry.js','hub/hub.js']){
            const text=readFileSync(file,'utf8');
            for(const m of text.matchAll(/["']([^"'\s]+\.(?:js|css)\?v=\d+)["']/g)){
              const url=new URL(m[1],'https://package.invalid/'+file);
              if(url.origin==='https://package.invalid')assert.ok(entries.includes('.'+url.pathname+url.search),file+' offline cache missing '+url.pathname+url.search);
            }
          }
          console.log('Offline shell covers the actual root import chain with existing unique files');
          JS
  deployment-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every shipping file on this exact head
        run: node test/piritori-c18-package.mjs
      - run: npm install --prefix /tmp/piritori-test playwright
      - run: /tmp/piritori-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual Hub link, portrait/landscape playthrough and existing bookmark
        env:
          NODE_PATH: /tmp/piritori-test/node_modules
          HUB_BASE_URL: http://127.0.0.1:8781/
          C18_ENTRY_OUTPUT: /tmp/night-shift-entry
        run: |
          python3 -m http.server 8781 --bind 127.0.0.1 --directory . > /tmp/night-shift-server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER"' EXIT
          node test/piritori-c18-entry.cjs
      - name: Record tested checkout
        if: always()
        run: |
          mkdir -p /tmp/night-shift-entry
          git rev-parse HEAD > /tmp/night-shift-entry/hub-commit.txt
          cp piritori-c17/release.json /tmp/night-shift-entry/release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-shift-deployment-entry
          path: /tmp/night-shift-entry
          retention-days: 3
