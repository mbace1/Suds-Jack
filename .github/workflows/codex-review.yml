# Ask Codex for a fresh review when a labelled pull request gets new commits.
#
# Why: Codex reviews on three events only — opening a PR for review, marking a
# draft ready, and somebody commenting "@codex review". Agents here push many
# commits to long-lived branches between those moments, so most of the work
# never gets looked at, and the review that does happen arrives after the code
# has hardened.
#
# Why opt-in: a review on every push to every branch would be noise, and noise
# teaches people to skim. Add the `review` label to a PR and it starts asking;
# remove it and it stops.
#
# No loop risk: `synchronize` fires on pushed commits, never on comments, so the
# comment this posts cannot re-trigger it.

name: request codex review

on:
  pull_request:
    types: [synchronize, labeled]

permissions:
  pull-requests: write

jobs:
  ask:
    if: contains(github.event.pull_request.labels.*.name, 'review')
    runs-on: ubuntu-latest
    steps:
      - name: request a review on the new commits
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                '@codex review',
                '',
                '_Requested automatically: new commits on a pull request labelled `review`.',
                'See `AGENTS.md` for this repository\'s canon documents and its severity',
                'levels — Playable / Gate / Canon / Drift / Polish._',
              ].join('\n'),
            });
