name: Radio Free Helsinki — daily wire

on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Bulletin count
        required: false
        default: '7'
      date:
        description: Optional YYYY-MM-DD override
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: radiofree-daily-wire
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate dated episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RFH_MODEL: ${{ vars.RFH_MODEL }}
          RFH_FEEDS: ${{ vars.RFH_FEEDS }}
          INPUT_COUNT: ${{ inputs.count }}
          INPUT_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--count "${INPUT_COUNT:-7}")
          if [[ -n "${INPUT_DATE:-}" ]]; then args+=(--date "$INPUT_DATE"); fi
          node radiofree/tools/generate-wire.mjs "${args[@]}"

      - name: Resolve Helsinki date
        id: day
        shell: bash
        run: |
          if [[ -n "${{ inputs.date }}" ]]; then
            echo "date=${{ inputs.date }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Europe/Helsinki date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate canonical episode
        run: node radiofree/tools/validate-wire.mjs "radiofree/wire/${{ steps.day.outputs.date }}.json"

      - name: Promote validated episode
        run: node radiofree/tools/promote-wire.mjs --date "${{ steps.day.outputs.date }}"

      - name: Validate live fallback
        run: node radiofree/tools/validate-wire.mjs radiofree/wire.json

      - name: Commit data to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "radio-free-helsinki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radiofree/wire.json radiofree/wire/index.json "radiofree/wire/${{ steps.day.outputs.date }}.json"
          if git diff --cached --quiet; then
            echo "No wire changes to commit"
          else
            git commit -m "Radio Free Helsinki wire ${{ steps.day.outputs.date }}"
            git push origin HEAD:main
          fi

      - name: Publish radiofree subtree to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          for attempt in 1 2 3; do
            rm -rf /tmp/rfh-pages
            git worktree add --detach /tmp/rfh-pages origin/gh-pages
            rm -rf /tmp/rfh-pages/radiofree
            cp -a radiofree /tmp/rfh-pages/radiofree
            (
              cd /tmp/rfh-pages
              git config user.name "radio-free-helsinki-bot"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add radiofree
              if git diff --cached --quiet; then
                echo "gh-pages already has this wire"
                exit 0
              fi
              git commit -m "Publish Radio Free Helsinki wire ${{ steps.day.outputs.date }}"
              if git push origin HEAD:gh-pages; then
                exit 0
              fi
              exit 2
            ) && break || status=$?
            git worktree remove --force /tmp/rfh-pages || true
            if [[ ${status:-0} -ne 2 || $attempt -eq 3 ]]; then exit ${status:-1}; fi
            git fetch origin gh-pages
          done
          git worktree remove --force /tmp/rfh-pages || true
