# Radio Free Helsinki — the morning wire.
#
# Reads the day's real headlines, writes one broadcast, and publishes it. The
# app fetches its bulletins rather than bundling them, so this ships CONTENT
# ONLY: a new `radiofree/wire/<date>.json` and the date on the front of
# `radiofree/wire/index.json`. No build, no cache-token bump, no code.
#
# Two branches on purpose:
#   main      the record — every broadcast that was ever written
#   gh-pages  the site, which is the only branch a listener reads
# The episode goes to both, and in that order. Publishing to gh-pages alone
# would put the archive one branch away from the code, and the next routine
# copy of `radiofree/` from main onto gh-pages would take `wire/index.json`
# with it and delete every generated morning from the archive in one commit.
#
# It writes nothing unless the wire passes the app's own validator, so a bad
# morning leaves yesterday's broadcast up rather than taking the station off
# air. `radiofree/EDITORIAL.md` is the spec the generator is handed; changing
# what the show sounds like is an edit to that file, not to this one.

name: radiofree wire

on:
  schedule:
    # 04:10 UTC — 07:10 in Helsinki through the summer, 06:10 in winter. The
    # generator dates the episode by the HELSINKI day, so the file is never
    # filed under yesterday when the clocks move.
    - cron: '10 4 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Episode date (YYYY-MM-DD). Blank = today in Helsinki.'
        required: false
      count:
        description: 'Bulletins in the broadcast'
        required: false
        default: '5'
      dry_run:
        description: 'Write nothing — draft it and print it'
        type: boolean
        required: false
        default: false

# One broadcast at a time. Two jobs writing wire/index.json would race, and the
# loser would take an episode off the archive without deleting the file.
concurrency:
  group: radiofree-wire
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: check the desk is staffed
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set on this repository — nothing can be written."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: write the broadcast
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RFH_MODEL: ${{ vars.RFH_MODEL }}
          RFH_FEEDS: ${{ vars.RFH_FEEDS }}
          DATE_IN: ${{ inputs.date }}
          COUNT: ${{ inputs.count || '5' }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=""
          [ -n "$DATE_IN" ] && ARGS="$ARGS --date $DATE_IN"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          node radiofree/tools/generate-wire.mjs --count "${COUNT:-5}" $ARGS
          DATE="${DATE_IN:-$(TZ=Europe/Helsinki date +%F)}"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: check it the way the app will
        if: ${{ inputs.dry_run != true }}
        run: node radiofree/tools/validate-wire.mjs "radiofree/wire/${{ steps.write.outputs.date }}.json"

      - name: file it on main
        if: ${{ inputs.dry_run != true }}
        env:
          DATE: ${{ steps.write.outputs.date }}
        run: |
          set -e
          git config user.name  'radio free helsinki'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "radiofree/wire/$DATE.json" radiofree/wire/index.json
          if git diff --cached --quiet; then
            echo "nothing new to file"; exit 0
          fi
          # The English headlines, which carry only invented names. The source
          # headlines stay out of the log on purpose: pairing a real firm with
          # the parody written off it, in public, is the one thing the naming
          # rule exists to prevent (radiofree/EDITORIAL.md).
          HEADS=$(node -e "const j=require('./radiofree/wire/$DATE.json');console.log(j.stories.map(s=>'- '+j.copy.en[s.id].head).join('\n'))")
          git commit -m "radiofree: the wire for $DATE" -m "$HEADS"
          for i in 1 2 3 4; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: put it on air
        if: ${{ inputs.dry_run != true }}
        env:
          DATE: ${{ steps.write.outputs.date }}
        run: |
          set -e
          git fetch origin gh-pages
          git worktree add --track -b gh-pages site origin/gh-pages
          mkdir -p site/radiofree/wire
          # every episode, not just today's. The index is one file: publishing
          # it while an older episode it names is missing from the site turns
          # that date into a 404 in the archive picker.
          cp radiofree/wire/*.json site/radiofree/wire/
          cd site
          git add radiofree/wire
          if git diff --cached --quiet; then
            echo "already on air"; exit 0
          fi
          git commit -m "radiofree: on air — the wire for $DATE"
          for i in 1 2 3 4; do
            git pull --rebase origin gh-pages && git push origin gh-pages && exit 0
            sleep $((2 ** i))
          done
          exit 1
