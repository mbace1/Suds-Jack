# Run the projects' own gates on every push and pull request.
#
# Why this exists: until now the repository had no CI whatever, so a pull
# request page could look entirely healthy while the game was unplayable — the
# only verification was whoever remembered to run the gates locally. Codex
# reviews the code, but nothing was running it.
#
# Scoping: each project gets its own job, gated on paths, so a change to one
# lane never fails on another lane's unrelated breakage. Only the lanes that
# are known green are wired up; add a block per project as each is verified,
# rather than turning everything on at once and teaching people to ignore red.

name: gates

on:
  push:
    branches: ['**']
  pull_request:

# a new push supersedes the run in flight for the same ref
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  piritori:
    name: flow-core · piritori · toko-move
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The bare-node gates need nothing at all — no browser, no GPU, no
      # audio device — which is exactly why they are the ones worth running
      # first: they fail in seconds when they fail.
      - name: the neutral core's contract
        run: node flow-core/test/contract.mjs

      - name: the Era I public map
        run: node piritori/map/validate-map.mjs

      - name: the authored seven-day slice and registered art
        run: node piritori/content/validate-slice.mjs

      - name: the v3 shell contract
        run: node piritori/test/v3-contract.mjs

      - name: the v3 campaign state
        run: node piritori/test/v3-state.mjs

      - name: the v3 formation battle
        run: node piritori/test/v3-battle.mjs

      - name: the rank fights
        run: node piritori/test/fight.mjs

      - name: the market — named goods, deals, and what is in the bag
        run: node piritori/test/market.mjs

      # The asset pipeline's own gate: the manifest is well formed, every
      # spec hashes, and an output at an old hash reads as drift. Needs no
      # key and calls nothing — generation is never run in CI.
      - name: the graphics pipeline's contract
        run: node test/assets-smoke.cjs

      # The browser gate needs Chromium. `--with-deps` pulls the system
      # libraries the headless browser needs on a bare runner.
      - name: install chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: the shared flow engine's daylight entry point
        run: node flow-core/test/smoke.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules

      - name: the Piritori v3 opening and five modes, in a real browser
        run: node piritori/test/v3-playthrough.cjs
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules

  piritori-godot:
    name: piritori · the Godot port
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Godot ships a single self-contained binary and the headless flag needs
      # no display, GPU or audio device — so the whole port is testable on a
      # bare runner. Pinned to the exact version the port was built against;
      # GDScript's parser is strict enough that a minor bump can break a build
      # that was green.
      - name: install godot 4.7.2
        run: |
          curl -sSL -o godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      # The canon seams come first: they are the reason data/ is git-ignored,
      # and a stale copy would make every later gate lie.
      - name: sync canon into the project
        working-directory: piritori/godot
        run: |
          node tools/sync-data.mjs
          node tools/build-map-geometry.mjs

      - name: the canon seams have not drifted
        working-directory: piritori/godot
        run: |
          node tools/sync-data.mjs --check
          node tools/build-map-geometry.mjs --check

      # Fails on a missing translation, on a fi/ja string identical to its
      # English source, on mismatched format specifiers, and on a stale key.
      - name: en / fi / ja are complete
        working-directory: piritori/godot
        run: node tools/check-locale.mjs

      # One import pass builds .godot/ and compiles every script. A parse error
      # surfaces here rather than as a mystery inside a test scene.
      #
      # Every scene below ends in get_tree().quit(0) or quit(1), and that was
      # verified rather than assumed — AGENTS.md §4: "a gate that cannot fail is
      # a Gate-level finding."
      - name: import the project
        working-directory: piritori/godot
        run: godot --headless --path . --import

      - name: the Era I data spine
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_spine.tscn

      - name: en / fi / ja resolve at runtime, with CJK glyphs
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_locale.tscn

      # Drives real Button nodes found by the words they display, never the
      # model directly — AGENTS.md §4.
      - name: the shell, driven through its own interface
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_shell.tscn

      - name: the formation battle, built from canon
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_battle.tscn

      - name: the battle screen's locked composition
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_battle_ui.tscn

      # The eeri lesson: the prover proves geometry, the playthrough proves the
      # thing is finishable. Walks all fourteen blocks to an authored ending.
      - name: the seven-day slice plays to an ending
        working-directory: piritori/godot
        run: godot --headless --path . res://tests/test_playthrough.tscn
