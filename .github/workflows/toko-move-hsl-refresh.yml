name: Toko Move — refresh HSL network

on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
  pull_request:
    paths:
      - '.github/workflows/toko-move-hsl-refresh.yml'
      - 'scripts/hsl-full-pack.mjs'
      - 'scripts/gtfs.mjs'
      - 'toko-move/js/helsinki-anchors.js'
      - 'toko-move/js/real-helsinki.js'
      - 'toko-move/test/full-hsl-pack.mjs'
      - 'toko-move/test/real-helsinki.mjs'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build full exact HSL pack
        run: node scripts/hsl-full-pack.mjs toko-move/cities/helsinki.json
      # SAY WHAT CHANGED, IN NAMES, BEFORE VALIDATING. Twelve consecutive nightly
      # runs failed on "cannot resolve anchor toolontori" and not one of them
      # printed what the feed calls that stop now — so the failure was
      # unactionable from the log and nobody acted. This step runs whether or
      # not the pack validates, and its summary is the whole diagnosis.
      - name: What the feed changed since the shipped pack
        if: always()
        run: |
          git show HEAD:toko-move/cities/helsinki.json > /tmp/shipped-helsinki.json
          node scripts/hsl-diff.mjs /tmp/shipped-helsinki.json toko-move/cities/helsinki.json
      - name: Validate full network
        run: node toko-move/test/full-hsl-pack.mjs
      - name: Validate gameplay graph on HSL data
        run: node toko-move/test/real-helsinki.mjs
      # Always, not only on a PR: a pack that FAILED validation is the one you
      # most need to look at, and it used to be thrown away with the runner.
      - name: Upload generated pack for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toko-move-helsinki-full
          path: toko-move/cities/helsinki.json
          if-no-files-found: error
      - name: Check for source changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- toko-move/cities/helsinki.json; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Persist validated pack onto this PR branch
        if: github.event_name == 'pull_request' && steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          cp toko-move/cities/helsinki.json /tmp/helsinki.json
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          cp /tmp/helsinki.json toko-move/cities/helsinki.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toko-move/cities/helsinki.json
          git commit -m "Toko Move: commit validated full HSL network"
          git push origin "$GITHUB_HEAD_REF"
      - name: Open refresh pull request
        if: github.event_name != 'pull_request' && steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="automation/toko-move-hsl-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add toko-move/cities/helsinki.json
          git commit -m "Toko Move: refresh exact HSL network"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Toko Move data — refresh exact HSL network" --body "Automated HSL GTFS refresh. Geometry is generated with zero approximation tolerance and validated before this PR is opened. Source: Helsinki Regional Transport Authority (HSL), CC BY 4.0."
