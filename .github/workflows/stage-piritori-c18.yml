name: Stage Piritori C18 candidate
on:
  push:
    branches: [release/piritori-c18-unified]
    paths: ['.github/workflows/stage-piritori-c18.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/piritori-c18-unified
      - uses: actions/checkout@v4
        with:
          repository: mbace1/piritori-eden
          ref: 80a723526dc47088e25602ea0316b18c37fd8681
          path: source
      - name: Package exact source bytes and scoped hub metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,re,shutil
          cabinet=Path('piritori-c17')
          files=['web/crew-run/index.html','web/crew-run/startup.js','web/crew-run/style.css','web/crew-run/ui.js','web/fight-module/main.js','web/fight-module/tactical-ui.js','web/arena-lab/index.html','web/bear-path/index.html','web/fight-module/index.html']
          for rel in files:
              assert (cabinet/rel).exists(),rel
              shutil.copyfile(Path('source')/rel,cabinet/rel)
          (cabinet/'index.html').write_text('<!doctype html><meta charset="utf-8"><title>Piritori C.18</title><meta http-equiv="refresh" content="0;url=web/crew-run/?campaign=1&release=18"><a href="web/crew-run/?campaign=1&release=18">Open C.18</a>\n')
          (cabinet/'VERSIONS.md').write_text('# C.18 — Unified command interface and direct scene rendering\n\nSource and tested head: 80a723526dc47088e25602ea0316b18c37fd8681 (Piritori PR #86).\n\nOne command surface, restored procedural portraits, combined mission/round strip, secondary withdrawal in Menu, and a short-landscape forecast that stays below the arena. Direct scene rendering bypasses framebuffer-copy smoothing. Menu > Graphics offers reflection-bypass safe mode and diagnostics.\n\nC.17 campaign/tactics, saves and exact-once aftermath are unchanged. No external character models or rigs added. Browser evidence is separate from physical phone acceptance, which remains open. C.08 stays absent from the hub; C.16.1 remains the rollback cabinet.\n',encoding='utf-8')
          rp=cabinet/'release.json';receipt=json.loads(rp.read_text())
          receipt.update(build='C.18',source_commit='80a723526dc47088e25602ea0316b18c37fd8681',tested_source_head='80a723526dc47088e25602ea0316b18c37fd8681',entry='web/crew-run/?campaign=1&release=18',status='unified-ui-direct-rendering',physical_devices_verified=False)
          receipt['transforms'].append('C.18 exact source UI/direct-rendering overlay; retained C.17 campaign rules and procedural cast')
          for rel in files+['index.html','VERSIONS.md']:
              receipt['sha256'][rel]=hashlib.sha256((cabinet/rel).read_bytes()).hexdigest()
          for rel,sha in receipt['sha256'].items():
              assert hashlib.sha256((cabinet/rel).read_bytes()).hexdigest()==sha,rel
          rp.write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('hub/games.js');data=p.read_bytes();text=data.decode();start=text.index("    id: 'optionc-lab',");end=text.index('\n  },',start)
          card=text[start:end].replace('C.17.1','C.18').replace('release=17.1','release=18')
          notes=iter(['C.18 — One command bar, character portraits and clearer mission/turn information. Secondary controls live in Menu. Direct scene rendering and optional safe graphics; C.17 campaign rules retained. Procedural characters only. Physical phone retest pending.','C.18 — Yhtenäinen komentopalkki, hahmomuotokuvat ja selkeämpi tehtävä- ja vuorotieto. Lisätoiminnot Menussa. Suora 3D-piirto ja valinnainen kevyt grafiikka. C.17-pelisäännöt säilyvät; puhelintesti odottaa.','C.18 — コマンドバー、人物ポートレート、任務とターン表示を統一。補助操作はMenuへ。直接描画と安全な描画設定を追加。C.17のルールと仮キャラクターを維持。実機確認は未完了。'])
          card,n=re.subn(r"note:\s*'[^']*'",lambda m:"note:'"+next(notes)+"'",card)
          assert n==3,n
          p.write_bytes((text[:start]+card+text[end:]).encode())
          assert "id: 'optionc'," not in p.read_text()
          p=Path('hub/versions.json');text=p.read_bytes().decode();pattern=r'("optionc-lab":\s*\{)[^}]*(\})'
          text,n=re.subn(pattern,lambda m:m[1]+'\n    "v": "18",\n    "n": 18000,\n    "from": "VERSIONS.md"\n  '+m[2],text);assert n==1
          p.write_bytes(text.encode())
          # Renew the complete module URL chain while retaining unrelated bytes.
          def change(path,old,new):
              p=Path(path);data=p.read_bytes();a=old.encode();b=new.encode();assert data.count(a)==1,(path,old,data.count(a));p.write_bytes(data.replace(a,b))
          game=int(re.search(r'games\.js\?v=(\d+)',Path('hub/hub.js').read_text())[1]);hub=int(re.search(r'hub\.js\?v=(\d+)',Path('hub/hub-entry.js').read_text())[1]);entry=int(re.search(r'hub-entry\.js\?v=(\d+)',Path('index.html').read_text())[1]);sw=int(re.search(r"const VERSION = 'v(\d+)'",Path('sw.js').read_text())[1])
          change('hub/hub.js',f'games.js?v={game}',f'games.js?v={game+1}')
          change('hub/hub-entry.js',f'hub.js?v={hub}',f'hub.js?v={hub+1}')
          for path in ['index.html','AnotherHUB/index.html','sw.js']:
              change(path,f'hub-entry.js?v={entry}',f'hub-entry.js?v={entry+1}')
              change(path,f'hub.js?v={hub}',f'hub.js?v={hub+1}')
          change('sw.js',f'games.js?v={game}',f'games.js?v={game+1}')
          change('sw.js',f"const VERSION = 'v{sw}'",f"const VERSION = 'v{sw+1}'")
          shutil.copyfile('source/web/test/c18-ui-rendering.cjs','/tmp/c18-package-test.cjs')
          assert 'C.18</span>' in (cabinet/'web/crew-run/index.html').read_text()
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/piritori-test playwright pngjs
      - run: /tmp/piritori-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test the actual nested hub cabinet
        env:
          NODE_PATH: /tmp/piritori-test/node_modules
          CREW_RUN_URL: http://127.0.0.1:8781/piritori-c17/web/crew-run/
          C18_OUTPUT: /tmp/c18-package-review
        run: |
          python3 -m http.server 8781 --bind 127.0.0.1 > /tmp/c18-package.log 2>&1 &
          node /tmp/c18-package-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: c18-packaged-browser-review
          path: /tmp/c18-package-review
          retention-days: 3
      - name: Commit only the tested package
        run: |
          rm -rf source
          rm .github/workflows/stage-piritori-c18.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add piritori-c17 hub/games.js hub/versions.json hub/hub.js hub/hub-entry.js index.html AnotherHUB/index.html sw.js .github/workflows/stage-piritori-c18.yml
          git commit -m 'Piritori C.18: publish coherent command UI and direct-render candidate'
          git push origin HEAD:release/piritori-c18-unified
