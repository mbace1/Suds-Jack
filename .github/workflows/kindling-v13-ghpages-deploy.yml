name: Deploy Kindling v16 to gh-pages

on:
  push:
    branches:
      - agent/kindling-v13-ghpages-deploy

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/kindling-v13-ghpages-deploy
          fetch-depth: 0

      - name: Fetch canonical Kindling v16
        run: |
          rm -rf .kindling-source
          git clone --depth 1 https://github.com/mbace1/Kindling.git .kindling-source
          cd .kindling-source
          test "$(git rev-parse HEAD)" = "d2e65912353be53e5adef5fc68f5cb7e4b64031d"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .kindling-source/package-lock.json

      - name: Build canonical hub cabinet
        working-directory: .kindling-source
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run release:static
          npm run build:hub
          test -f dist/client/index.html
          test -f dist/client/art/birch-ruins-clean.svg
          test -f dist/client/art/drowned-courtyard-clean.svg
          test -f dist/client/art/bell-keep-clean.svg
          test -f dist/client/art/ashwood-clean.svg
          grep -q 'ember-portrait.png' dist/client/art/ember-idle-runtime.svg

      - name: Stage v16 cabinet
        run: |
          rm -rf .deploy-kindling .deploy-smoke
          mkdir -p .deploy-kindling
          cp -a .kindling-source/dist/client/. .deploy-kindling/
          printf 'v16\n' > .deploy-kindling/.hub-release
          cat > .deploy-kindling/DEPLOYED_VERSION.txt <<'EOF'
          Kindling v16
          canonical source: mbace1/Kindling@d2e65912353be53e5adef5fc68f5cb7e4b64031d
          static hub build: npm run build:hub
          visual pass: camp depth + four upgraded Journey regions
          EOF

      - name: Smoke exact final-path cabinet
        run: |
          mkdir -p .deploy-smoke/Suds-Jack/kindling .deploy-smoke/Suds-Jack/hub
          cp -a .deploy-kindling/. .deploy-smoke/Suds-Jack/kindling/
          cp hub/shell.js hub/pad.js hub/games.js hub/padkeys.js .deploy-smoke/Suds-Jack/hub/
          python3 -m http.server 8081 -d .deploy-smoke >/tmp/kindling-v16-hub.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/Suds-Jack/kindling/ >/dev/null; then break; fi
            sleep 1
          done
          cd .kindling-source
          npx playwright install chromium
          node scripts/full-play-browser-smoke.mjs http://127.0.0.1:8081/Suds-Jack/kindling/
          node scripts/betterment-browser-smoke.mjs http://127.0.0.1:8081/Suds-Jack/kindling/ artifacts/hub-v16-mobile.png --allow-static-hydration

      - name: Commit on top of current gh-pages
        run: |
          rm -rf .kindling-source .deploy-smoke
          mv .deploy-kindling /tmp/kindling-v16
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          rm -rf kindling/assets kindling/art kindling/__grok
          rm -f kindling/index.html kindling/favicon.svg kindling/og.jpg kindling/x-banner.jpg kindling/hub-shell.js kindling/sw.js kindling/VERSIONS.md kindling/.hub-release kindling/DEPLOYED_VERSION.txt
          cp -a /tmp/kindling-v16/. kindling/
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('hub/versions.json')
          data = json.loads(p.read_text())
          data['kindling'] = {'v':'16','n':16000,'from':'v16 visual pass + v15 systems'}
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          git config user.name "Kindling Hub Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add kindling hub/versions.json
          if git diff --cached --quiet; then
            echo "Kindling v16 already deployed"
          else
            git commit -m "Deploy Kindling v16 visual pass"
            git push origin gh-pages
          fi
