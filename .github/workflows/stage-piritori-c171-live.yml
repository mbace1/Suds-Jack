name: Stage Piritori C17.1 Live

on:
  push:
    branches: [deploy/piritori-c171-live]
    paths: ['.github/workflows/stage-piritori-c171-live.yml']

permissions:
  contents: write

jobs:
  stage-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/piritori-c171-live
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: bec3cb1831e8dd1f8440bf55b80588a6228e1b0e
          path: main-src
      - name: Overlay C.17.1 and remove C.08 without disturbing live-only work
        shell: bash
        run: |
          set -euo pipefail
          LIVE_BASE=5cc4c544c9c6b70d9e22d49e123dd56d220cca41
          test "$(git merge-base HEAD origin/gh-pages)" = "$LIVE_BASE"
          test "$(git rev-parse origin/gh-pages)" = "$LIVE_BASE"

          cp main-src/piritori-c17/web/crew-run/index.html piritori-c17/web/crew-run/index.html
          cp main-src/piritori-c17/web/crew-run/startup.js piritori-c17/web/crew-run/startup.js
          cp main-src/piritori-c17/index.html piritori-c17/index.html
          cp main-src/piritori-c17/VERSIONS.md piritori-c17/VERSIONS.md
          cp main-src/piritori-c17/release.json piritori-c17/release.json

          python - <<'PY'
          from pathlib import Path

          def replace_once(path,old,new):
              p=Path(path); data=p.read_bytes()
              if data.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {data.count(old)}')
              p.write_bytes(data.replace(old,new,1))

          def replace_all_count(path,old,new,count):
              p=Path(path); data=p.read_bytes()
              if data.count(old)!=count:
                  raise SystemExit(f'{path}: expected {count} {old!r}, found {data.count(old)}')
              p.write_bytes(data.replace(old,new))

          # Live catalogue: promote C.17.1, then remove the obsolete C.08/Option C card.
          replace_once('hub/games.js',b'PIRITORI \xc2\xb7 NIGHT SHIFT C.17',b'PIRITORI \xc2\xb7 NIGHT SHIFT C.17.1')
          replace_once('hub/games.js',b'piritori-c17/web/crew-run/?campaign=1&release=17',b'piritori-c17/web/crew-run/?campaign=1&release=17.1')
          replace_all_count('hub/games.js',b'C.17 \xe2\x80\x94',b'C.17.1 \xe2\x80\x94',3)
          p=Path('hub/games.js'); data=p.read_bytes(); nl=b'\r\n' if b'\r\n' in data else b'\n'
          start=data.find(nl+b"  {"+nl+b"    id: 'optionc',")
          end=data.find(nl+b"  {"+nl+b"    id: 'concrete',",start)
          if start<0 or end<0: raise SystemExit('live Option C block boundaries not found')
          p.write_bytes(data[:start]+data[end:])

          # Live version feed: remove C.08 and move Night Shift to 17.1.
          p=Path('hub/versions.json'); data=p.read_bytes(); nl=b'\r\n' if b'\r\n' in data else b'\n'
          start=data.find(nl+b'  "optionc": {')
          end=data.find(nl+b'  "neonronin": {',start)
          if start<0 or end<0: raise SystemExit('live optionc version block boundaries not found')
          data=data[:start]+data[end:]
          start=data.find(nl+b'  "optionc-lab": {')
          end=data.find(nl+b'  }',start)
          if start<0 or end<0: raise SystemExit('live optionc-lab version block not found')
          end += len(nl+b'  }')
          block=data[start:end].replace(b'"v": "17"',b'"v": "17.1"').replace(b'"n": 17000',b'"n": 17001')
          data=data[:start]+block+data[end:]
          p.write_bytes(data)

          # Fresh cache keys above both the current live and main histories.
          replace_once('hub/hub.js',b'./games.js?v=98',b'./games.js?v=101')
          replace_once('hub/hub-entry.js',b'./hub.js?v=103',b'./hub.js?v=106')
          replace_once('index.html',b'hub/hub-entry.js?v=26',b'hub/hub-entry.js?v=29')
          replace_once('index.html',b'./hub/hub.js?v=103',b'./hub/hub.js?v=106')
          replace_once('AnotherHUB/index.html',b'hub/hub-entry.js?v=26',b'hub/hub-entry.js?v=29')
          replace_once('AnotherHUB/index.html',b'./hub/hub.js?v=103',b'./hub/hub.js?v=106')
          replace_once('sw.js',b"const VERSION = 'v95'",b"const VERSION = 'v98'")
          replace_once('sw.js',b'./hub/games.js?v=98',b'./hub/games.js?v=101')
          replace_once('sw.js',b'./hub/hub-entry.js?v=26',b'./hub/hub-entry.js?v=29')
          replace_once('sw.js',b'./hub/hub.js?v=103',b'./hub/hub.js?v=106')
          PY

          grep -Fq '<span>C.17.1</span>' piritori-c17/web/crew-run/index.html
          grep -Fq 'getContext' piritori-c17/web/crew-run/startup.js
          grep -Fq '"build": "C.17.1"' piritori-c17/release.json
          grep -Fq 'piritori-c17/web/crew-run/?campaign=1&release=17.1' hub/games.js
          ! grep -Fq "id: 'optionc'," hub/games.js

          rm -rf main-src .github/workflows/stage-piritori-c171-live.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Deploy Piritori C.17.1 and remove C.08 from live hub'
          git push origin HEAD:deploy/piritori-c171-live
