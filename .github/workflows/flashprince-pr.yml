name: flashprince

on:
  pull_request:
    paths:
      - 'flashprince/**'
      - '.github/workflows/flashprince-pr.yml'
  push:
    branches:
      - 'feature/flashprince-*'
    paths:
      - 'flashprince/**'
      - '.github/workflows/flashprince-pr.yml'

jobs:
  movement:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest became 26.04, which the pinned Playwright cannot install chromium on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: deterministic movement contract
        run: npm --prefix flashprince test
      - name: browser playable + movement lab
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node flashprince/test/playable-smoke.mjs
          node flashprince/test/browser-smoke.mjs
