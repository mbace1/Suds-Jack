name: Stage clean Option C removal

on:
  push:
    branches: [fix/remove-piritori-c8-hub-clean]
    paths: ['.github/workflows/stage-remove-optionc-clean.yml']

permissions:
  contents: write

jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-piritori-c8-hub-clean
          fetch-depth: 0
      - name: Remove Option C without rewriting unrelated bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def nl_for(data):
              return b'\r\n' if b'\r\n' in data else b'\n'

          def replace_once(path, old, new):
              p=Path(path); data=p.read_bytes()
              if data.count(old)!=1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {data.count(old)}')
              p.write_bytes(data.replace(old,new,1))

          p=Path('hub/games.js'); data=p.read_bytes(); nl=nl_for(data)
          start=data.find(nl+b"  {"+nl+b"    id: 'optionc',")
          end=data.find(nl+b"  {"+nl+b"    id: 'concrete',",start)
          if start < 0 or end < 0:
              raise SystemExit('Option C catalogue boundaries not found')
          p.write_bytes(data[:start]+data[end:])

          p=Path('hub/versions.json'); data=p.read_bytes(); nl=nl_for(data)
          start=data.find(nl+b'  "optionc": {')
          end=data.find(nl+b'  "piritori": {',start)
          if start < 0 or end < 0:
              raise SystemExit('Option C version boundaries not found')
          p.write_bytes(data[:start]+data[end:])

          replace_once('hub/hub.js',b'./games.js?v=98',b'./games.js?v=99')
          replace_once('hub/hub-entry.js',b'./hub.js?v=103',b'./hub.js?v=104')
          replace_once('index.html',b'hub/hub-entry.js?v=26',b'hub/hub-entry.js?v=27')
          replace_once('index.html',b'./hub/hub.js?v=103',b'./hub/hub.js?v=104')
          replace_once('AnotherHUB/index.html',b'hub/hub-entry.js?v=26',b'hub/hub-entry.js?v=27')
          replace_once('AnotherHUB/index.html',b'./hub/hub.js?v=103',b'./hub/hub.js?v=104')
          replace_once('sw.js',b"const VERSION = 'v95'",b"const VERSION = 'v96'")
          replace_once('sw.js',b'./hub/games.js?v=98',b'./hub/games.js?v=99')
          replace_once('sw.js',b'./hub/hub-entry.js?v=26',b'./hub/hub-entry.js?v=27')
          replace_once('sw.js',b'./hub/hub.js?v=103',b'./hub/hub.js?v=104')
          PY

          rm .github/workflows/stage-remove-optionc-clean.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'hub: remove Piritori Option C / C.08'
          git push origin HEAD:fix/remove-piritori-c8-hub-clean
