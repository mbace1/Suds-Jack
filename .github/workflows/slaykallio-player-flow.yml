name: Slay Kallio player flow
on:
  pull_request:
    paths:
      - 'slaykallio/**'
      - '.github/workflows/slaykallio-player-flow.yml'
jobs:
  slaykallio:
    runs-on: ubuntu-latest
    # 10 minutes was enough while the player flow walked ONE fight. It now
    # walks a whole act on desktop and on touch — the map, an event, a rest,
    # the card picker and the fights between them — and the first CI run after
    # that change was cancelled at the budget with the touch pass still going.
    # The walk is the point of the harness, so the budget moves rather than the
    # walk. This job only runs on pull requests that touch slaykallio/.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules and complete deterministic runs
        run: node slaykallio/test/core.mjs
      - name: Install browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
      - name: Scene and two-orientation regression
        run: node slaykallio/test/smoke.cjs
      - name: Real desktop and touch player flow
        run: node slaykallio/test/player-flow.cjs
