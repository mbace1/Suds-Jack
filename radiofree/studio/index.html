<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFH Studio</title>
<style>
  @font-face { font-family: 'Anton'; src: url(../lab/fonts/Anton.ttf); }
  @font-face { font-family: 'Archivo Black'; src: url(../lab/fonts/ArchivoBlack.ttf); }
  @font-face { font-family: 'Space Grotesk'; font-weight: 700; src: url(../lab/fonts/SpaceGrotesk-Bold.ttf); }
  html, body { margin: 0; background: #16151f; color: #eee; font: 15px system-ui, sans-serif; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 16px; }
  button { min-height: 44px; padding: 0 18px; background: #f0027f; color: #fff; border: 0; border-radius: 6px; font: inherit; font-weight: 700; }
  input[type=range] { flex: 1; min-height: 44px; }
  canvas { display: block; margin: 0 auto 16px; width: min(100vw - 32px, 52vh); height: auto; }
</style>
</head>
<body>
<div class="bar"><button id="play">Play</button><input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Position"><span id="clock">0.0 s</span></div>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
  import { frameAt, renderAudio, wav, timeline } from './film.js';
  const q = new URLSearchParams(location.search);
  const ep = await import(`./episodes/${q.get('ep') || 'bargain-bin'}.js`);
  await Promise.all(['Anton', 'Archivo Black', 'Space Grotesk'].map(f => document.fonts.load(`80px "${f}"`)));
  const cv = document.getElementById('c'), ctx = cv.getContext('2d'), tl = timeline(ep);
  const scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  const show = (t) => { frameAt(ctx, ep, t, tl); clock.textContent = t.toFixed(1) + ' s'; scrub.value = Math.round(t / tl.total * 1000); };
  // the renderer drives frames itself
  window.__studio = { tl, frame: (t) => frameAt(ctx, ep, t, tl), canvas: cv,
    audio: async () => { const w = wav(await renderAudio(ep)); let s = ''; for (let i = 0; i < w.length; i += 32768) s += String.fromCharCode(...w.subarray(i, i + 32768)); return btoa(s); } };
  show(0);
  scrub.oninput = () => show(scrub.value / 1000 * tl.total);
  let playing = null;
  document.getElementById('play').onclick = async () => {
    if (playing) { playing.stop(); playing = null; return; }
    const ac = new AudioContext(), buf = await renderAudio(ep), src = ac.createBufferSource();
    src.buffer = buf; src.connect(ac.destination);
    const from = scrub.value / 1000 * tl.total, t0 = ac.currentTime - from;
    src.start(0, from); playing = src;
    const loop = () => { if (playing !== src) return; const t = ac.currentTime - t0; if (t > tl.total) { playing = null; return; } show(t); requestAnimationFrame(loop); };
    loop();
  };
</script>
</body>
</html>
