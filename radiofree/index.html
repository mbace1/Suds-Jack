<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04070a">
<link rel="manifest" href="manifest.webmanifest?v=37">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Radio Free Helsinki — a fictional pirate news broadcast. Toko reads the day's wire from a codec screen; DECODE shows you what the wording was doing.">
<title>Radio Free Helsinki</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void: #04070a;
    --shell: #081218;
    --green: #7dffb2;
    --green-dim: #3f9a6e;
    --green-lo: #1c4a38;
    --text-dim: #5a8872;
    --amber: #ffb43a;
    --amber-hot: #ffe2a8;
    --gaming: #54d6ff;
    --industry: #8fe36a;
    --defence: #ff6b6b;
    --accent: var(--green);        /* one station: green is the accent */
    --mast-h: 54px;
    --col: 480px;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'Courier New', monospace;
  }

  html, body { height: 100%; background: var(--void); overflow: hidden; }
  body {
    font-family: var(--mono);
    color: var(--green);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 60; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }

  .mast {
    position: fixed; z-index: 40; top: 0; left: 0; right: 0;
    height: calc(var(--mast-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    background: linear-gradient(to bottom, rgba(4,7,10,.96) 60%, rgba(4,7,10,0));
  }
  .mast-inner {
    max-width: var(--col); margin: 0 auto; height: 100%;
    padding: 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .logo {
    font-size: 11px; letter-spacing: .14em; font-weight: 700;
    text-transform: uppercase; white-space: nowrap;
  }
  .logo b { color: var(--amber); font-weight: 700; }
  .logo-short { display: none; }
  @media (max-width: 470px) {
    .logo-full { display: none; }
    .logo-short { display: inline; }
  }
  body:has(.arcade-home) .logo { display: none; }
  #lang { font-size: 11px; letter-spacing: .1em; }

  /* the archive sits between the logo and the dial, and disappears entirely
     when there is only one morning on the wire */
  .archive { margin-left: auto; display: flex; align-items: center; }
  .archive[hidden] { display: none; }
  .archive-sel {
    min-height: 44px; padding: 0 6px;
    background: none; border: 1px solid var(--green-lo); border-radius: 3px;
    color: var(--green-dim); font-family: var(--mono);
    font-size: 11px; letter-spacing: .08em; cursor: pointer;
  }
  .archive-sel:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .dial { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  /* with an archive present the dial no longer needs the auto margin */
  .archive:not([hidden]) ~ .dial { margin-left: 8px; }
  /* one station: the dial is a readout, so the jump buttons are gone */
  .dial #chUp, .dial #chDown { display: none; }
  .dial button {
    min-width: 44px; min-height: 44px;
    background: none; border: 0; color: var(--green-dim);
    font-family: var(--mono); font-size: 15px; cursor: pointer;
  }
  .dial button:hover { color: var(--green); }
  .dial .read { text-align: center; min-width: 78px; line-height: 1.1; }
  .dial .freq {
    display: block; font-size: 17px; font-weight: 700; letter-spacing: .04em;
    color: var(--accent);
  }
  .dial .call { display: block; font-size: 9px; letter-spacing: .2em; color: var(--green-dim); }
  .icon-btn {
    flex: none; min-width: 44px; min-height: 44px;
    background: none; border: 1px solid var(--green-lo); border-radius: 3px;
    color: var(--green); font-family: var(--mono); font-size: 15px; cursor: pointer;
  }
  .icon-btn[aria-pressed="false"] { color: var(--text-dim); }

  #feed {
    height: 100vh; height: 100dvh;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
  }
  #feed::-webkit-scrollbar { display: none; }
  @media (prefers-reduced-motion: reduce) { #feed { scroll-behavior: auto; } }

  .post {
    position: relative;                 /* the lower third is absolute inside it */
    height: 100vh; height: 100dvh;
    scroll-snap-align: start; scroll-snap-stop: always;
    display: flex; flex-direction: column;
    padding: calc(var(--mast-h) + env(safe-area-inset-top) + 4px) 0
             calc(8px + env(safe-area-inset-bottom));
    max-width: var(--col); margin: 0 auto;
  }

  .post-media {
    position: relative;
    flex: 0 0 auto;
    height: min(58vh, 520px);
    display: flex; justify-content: center;
  }
  .media-slot { height: 100%; line-height: 0; }
  .media-slot canvas {
    height: 100%; width: auto; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }

  .rail {
    position: absolute; right: 6px; bottom: 0;
    display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  .rail-btn {
    width: 52px; min-height: 52px; padding: 5px 0 3px;
    background: rgba(8,18,24,.72); border: 1px solid var(--green-lo); border-radius: 6px;
    color: var(--green); font-family: var(--mono); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .rail-btn .glyph { font-size: 17px; line-height: 1; }
  .rail-btn .lbl { font-size: 8px; letter-spacing: .1em; }
  .rail-btn:hover { border-color: var(--green-dim); }
  .rail-btn.on {
    border-color: var(--amber); color: var(--amber); background: rgba(255,180,58,.12);
  }
  .rail-btn:focus-visible, .icon-btn:focus-visible, .dial button:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 2px;
  }

  .post-caption {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding: 12px 14px 0;
    scrollbar-width: none;
  }
  .post-caption::-webkit-scrollbar { display: none; }
  .tag {
    font-size: 10px; letter-spacing: .18em; color: var(--accent);
    text-transform: uppercase; margin-bottom: 5px;
  }
  .tag .rec { color: var(--defence); }
  .tag .rec::before { content: '● '; }
  .post.live .tag .rec::before { animation: blink 1.6s steps(1) infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .15; } }
  .head {
    font-size: 18px; line-height: 1.25; color: var(--green);
    margin-bottom: 9px; font-weight: 700;
  }
  .bulletin { font-size: 14px; color: #b7e8cd; }
  .bulletin-line + .bulletin-line { margin-top: 9px; }
  .bulletin-line::before { content: '> '; color: var(--green-lo); }
  .standby { font-size: 13px; color: var(--text-dim); letter-spacing: .1em; }
  .standby::after { content: '▮'; animation: blink 1s steps(1) infinite; }

  .spun { transition: color .25s, opacity .25s; }
  .spun.struck { color: var(--text-dim); text-decoration: line-through; opacity: .7; }
  .plain { color: var(--amber); }
  .plain::before { content: ' → '; color: var(--amber-hot); }

  .decode-box {
    border: 1px solid var(--amber); border-left-width: 3px;
    background: rgba(255,180,58,.05);
    padding: 10px 12px; margin-top: 12px;
  }
  .decode-box[hidden] { display: none; }
  .technique {
    font-size: 11px; letter-spacing: .18em; color: var(--amber-hot);
    text-transform: uppercase; margin-bottom: 6px;
  }
  .note { font-size: 13px; color: #e8cfa2; }
  .tell {
    font-size: 13px; color: var(--amber); margin-top: 8px;
    border-top: 1px dashed rgba(255,180,58,.3); padding-top: 8px;
  }

  .tally { margin-top: 14px; border-top: 1px solid var(--green-lo); padding-top: 10px; }
  .tally-head {
    font-size: 10px; letter-spacing: .2em; color: var(--green-dim);
    text-transform: uppercase; margin-bottom: 8px;
  }
  .tally-row {
    display: grid; grid-template-columns: 14px 1fr; gap: 2px 6px;
    font-size: 11px; letter-spacing: .1em; color: var(--text-dim);
    text-transform: uppercase; margin-bottom: 5px;
  }
  .tally-row.got { color: var(--amber); }
  .tally-mark { text-align: center; }
  .tally-tell {
    grid-column: 2; font-size: 12px; letter-spacing: 0; text-transform: none;
    color: #e8cfa2; margin-bottom: 4px;
  }
  .tally-note { font-size: 12px; color: #b7e8cd; margin-top: 10px; }
  .sign-off .tag .rec { color: var(--green-dim); }
  .sign-off .tag .rec::before { content: '■ '; }

  .fiction {
    font-size: 9px; letter-spacing: .1em; color: var(--text-dim);
    text-transform: uppercase; margin: 14px 0 4px; line-height: 1.6;
  }

  .post:first-child .post-media { padding-bottom: 18px; }
  .swipe-hint {
    position: absolute; left: 0; right: 0; bottom: 0;
    text-align: center; font-size: 9px; letter-spacing: .16em;
    color: var(--text-dim); text-transform: uppercase;
    animation: nudge 2.2s ease-in-out infinite;
  }
  @keyframes nudge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) {
    .swipe-hint, .standby::after, .post.live .tag .rec::before { animation: none; }
  }

  #gate {
    position: fixed; inset: 0; z-index: 70;
    background: var(--void);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
  }
  #gate.gone { display: none; }
  #gate h1 { font-size: 21px; letter-spacing: .18em; text-transform: uppercase; }
  #gate h1 b { color: var(--amber); }
  #gate p { font-size: 12px; color: var(--green-dim); max-width: 34em; letter-spacing: .06em; }
  #gate .noise { width: 100%; max-width: 300px; height: 46px; image-rendering: pixelated; }
  #gate button {
    min-width: 220px; min-height: 48px;
    background: var(--shell); border: 1px solid var(--green-dim); border-radius: 3px;
    color: var(--green); font-family: var(--mono);
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase; cursor: pointer;
  }
  #gate button:hover { background: #0d2028; }
  #gate button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  /* The language row is THREE WORDS, not three buttons. It used to inherit
     `#gate button { min-width: 220px }` — an id selector, so the 52px sitting
     on `.gate-lang button` never won it, and three 220px boxes ran off the
     side of every phone. Selectors here are id-qualified for that reason, and
     the row is bare text so there is nothing left to overflow. */
  #gate .gate-lang { display: flex; align-items: center; gap: 0; }
  #gate .gate-lang button {
    min-width: 44px; min-height: 44px;      /* the touch floor, and no more */
    padding: 0 10px;
    background: none; border: 0; border-radius: 0;
    color: var(--text-dim);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  }
  #gate .gate-lang button + button { border-left: 1px solid var(--green-lo); }
  #gate .gate-lang button:hover { background: none; color: var(--green-dim); }
  #gate .gate-lang button.active { color: var(--green); }

  @media (max-height: 620px) {
    .post-media { height: 44vh; }
    .head { font-size: 16px; }
  }
  /* ── the footage, as pictures (Grok's frames, used as is) ──────── */
  /* The picture IS the post now: full bleed, with the copy as a lower
     third over it. Text sits on a scrim rather than in a column below,
     which is what makes it read as a news bulletin rather than a card. */
  .post-media { height: auto; flex: 1 1 auto; min-height: 0; }
  .photo-wrap {
    position: absolute; inset: 0; overflow: hidden; background: #05100c;
  }
  .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    /* The frames are 2:3 and the post is taller, so cover crops the sides.
       object-fit does that correctly; sizing with min-width/height instead
       leaves the image at its natural 784px and shows a 1:1 crop of the
       middle, which is most of a cathedral and none of the square. */
    object-fit: cover; object-position: 50% 42%;
    image-rendering: pixelated;
    animation: kenburns 26s ease-in-out infinite alternate;
  }
  /* a drawn plate is already 144x276 and already moving — no cover crop, no
     Ken Burns. Stretching it to the post is the whole point of pixel art. */
  .photo.drawn { object-fit: fill; animation: none; }

  @keyframes kenburns {
    /* never sits at 1.00: the frames carry their own camera HUD along the top
       edge, and at no zoom the full height shows, so that strip lands under
       the masthead. cover crops width here, not height, so object-position
       cannot hide it — a permanent slight push can. The translate makes it
       drift as well as push, so the move reads as a camera rather than a zoom. */
    from { transform: scale(1.07) translate(-1.6%, 0.9%); }
    to   { transform: scale(1.17) translate(1.6%, -1.3%); }
  }
  /* CRT flicker: on the grade, not the image — .photo's filter belongs to
     DECODE and an animation on it would win and kill the amber grade */
  .photo-grade { animation: crtflick 6.5s steps(1) infinite; }
  @keyframes crtflick {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: .82; }
    98% { opacity: .93; }
  }
  /* the signal tears now and then, briefly */
  .photo-wrap { animation: tearx 13s steps(1) infinite; }
  @keyframes tearx {
    0%, 94%, 100% { transform: translateX(0); }
    95% { transform: translateX(-3px); }
    96% { transform: translateX(2px); }
  }
  /* moving grain — a still photograph in a feed still reads as a still */
  .photo-wrap::after {
    content: ''; position: absolute; inset: -2px; pointer-events: none; opacity: .065;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 1px, transparent 1px 2px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.4) 0 1px, transparent 1px 3px);
    animation: grain .85s steps(3) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0, 0); }
    33%  { transform: translate(-1px, 1px); }
    66%  { transform: translate(1px, -1px); }
  }
  /* phosphor grade + CRT lines, so a photograph still arrives through the
     receiver rather than sitting on the page like a stock image */
  .photo-grade {
    position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom,
        rgba(0,0,0,.34) 0 1px, rgba(0,0,0,0) 1px 3px),
      radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 45%, rgba(2,8,6,.72) 100%);
    mix-blend-mode: multiply;
  }
  .photo-sweep {
    position: absolute; left: 0; right: 0; height: 22%; pointer-events: none;
    background: linear-gradient(to bottom, rgba(125,255,178,0), rgba(125,255,178,.05), rgba(125,255,178,0));
    animation: sweep 7s linear infinite;
  }
  @keyframes sweep { from { top: -25%; } to { top: 105%; } }
  /* DECODE has to mutate every shot type, photographs included */
  .photo-wrap.decoded .photo {
    filter: sepia(.55) saturate(1.5) hue-rotate(-18deg) brightness(.92);
  }
  .photo-wrap.decoded .photo-sweep {
    background: linear-gradient(to bottom, rgba(255,180,58,0), rgba(255,180,58,.12), rgba(255,180,58,0));
    animation-duration: 2.4s;
  }
  @media (prefers-reduced-motion: reduce) {
    .photo, .photo-sweep, .photo-grade, .photo-wrap, .photo-wrap::after { animation: none; }
  }

  /* the studio shot is a live canvas, so its motion is drawn, not CSS —
     ken-burns on top of a redrawing frame is two pushes at once. Its decode
     is drawn too (amber furniture + a band tear), so the sepia grade the
     photographs take would only sepia the brand pink out of Toko. */
  .anchor-cv { animation: none; object-position: 50% 45%; }
  /* drawn footage moves because it is redrawn, not because CSS pushes it */
  .plate-cv { animation: none; object-position: 50% 45%; }
  .graphic-cv { animation: none; object-position: 50% 40%; }
  .photo-wrap.decoded .anchor-cv,
  .photo-wrap.decoded .graphic-cv,
  .photo-wrap.decoded .plate-cv { filter: none; }

  /* ── the cut package: footage → studio → footage ────────────────── */
  .pkg { position: absolute; inset: 0; }
  .pkg-shot { position: absolute; inset: 0; opacity: 0; transition: opacity .2s linear; }
  .pkg-shot.on { opacity: 1; }
  /* a cut snaps: a bright band and a wash, gone in a sixth of a second */
  .pkg-cut {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background:
      linear-gradient(to bottom, rgba(125,255,178,0) 42%,
        rgba(125,255,178,.55) 50%, rgba(125,255,178,0) 58%),
      rgba(255,255,255,.07);
    mix-blend-mode: screen; z-index: 1;
  }
  .post.is-decoded .pkg-cut {
    background:
      linear-gradient(to bottom, rgba(255,180,58,0) 42%,
        rgba(255,180,58,.55) 50%, rgba(255,180,58,0) 58%),
      rgba(255,255,255,.07);
  }

  /* ── the lower third ───────────────────────────────────────────── */
  .post-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 14px calc(13% + env(safe-area-inset-bottom));
    background: linear-gradient(to top,
      rgba(3,10,8,.94) 0%, rgba(3,10,8,.86) 45%, rgba(3,10,8,0) 100%);
    padding-top: 46px;
    max-height: 62%;
  }
  .post-caption .head {
    font-size: 19px; line-height: 1.2; margin-bottom: 6px;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  /* max two lines of smaller text — until DECODE, which needs the room */
  .post:not(.is-decoded) .bulletin {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; font-size: 13px;
  }
  .post:not(.is-decoded) .bulletin-line + .bulletin-line { margin-top: 0; }
  .post:not(.is-decoded) .fiction { display: none; }
  /* DECODE needs the room, and once the caption is 78% tall the scrim's
     transparent top lands in the middle of the picture — over a lit window,
     or over Toko's magenta, the amber plain readings fall miles under AA.
     Decoded, the lower third stops being a gradient and becomes a card. */
  .post.is-decoded .post-caption {
    /* 78% buried the graphic completely, and DECODE cuts home to the graphic —
       so decoding hid the very thing it was cutting to. The caption scrolls,
       the picture does not, so the picture gets the band it needs. */
    max-height: 62%; overflow-y: auto;
    background: linear-gradient(to top,
      rgba(3,10,8,.97) 0%, rgba(3,10,8,.96) 78%, rgba(3,10,8,.80) 100%);
    padding-top: 22px;
  }

  /* the rail has to sit above the lower third, and clear of it */
  .rail { z-index: 3; bottom: auto; top: 58%; }
  .post-caption { z-index: 2; }
  /* the signature badge lives bottom-left, so keep the copy out of its corner */
  /* the copy used to be indented past the signature badge in the corner;
     raising it off the bottom clears the badge on its own */
  .swipe-hint { display: none; }
</style>
</head>
<body>

<div id="gate">
  <h1>Radio <b>Free</b> Helsinki</h1>
  <canvas class="noise" width="150" height="23" aria-hidden="true"></canvas>
  <p id="gateBlurb"></p>
  <p id="gateFiction"></p>
  <button id="tuneIn">▶</button>
</div>

<div id="app" hidden>
  <header class="mast">
   <div class="mast-inner">
    <span class="logo"><span class="logo-full">Radio <b>Free</b> Helsinki</span><span class="logo-short">R<b>F</b>H</span></span>
    <div class="archive" id="archive" hidden></div>
    <div class="dial">
      <button id="chDown" aria-label="Previous channel">◀</button>
      <span class="read">
        <span class="freq" id="freq">87.60</span>
        <span class="call" id="call">KAIKU</span>
      </span>
      <button id="chUp" aria-label="Next channel">▶</button>
    </div>
    <button class="icon-btn" id="lang" aria-label="Language">EN</button>
    <button class="icon-btn" id="sound" aria-pressed="true" aria-label="Sound on or off">♪</button>
   </div>
  </header>

  <main id="feed" tabindex="-1"></main>
</div>

<script type="module" src="js/main.js?v=37"></script>
<script type="module" src="../hub/shell.js?v=17"></script>
<script>
  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || new URLSearchParams(location.search).has('sw'))) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=37').catch(() => {}));
  }
</script>

  <script type="module">
    import { sign } from '../toko/js/signature.js?v=2';
    sign({ corner: 'bottom-left' });
  </script>
</body>
</html>
