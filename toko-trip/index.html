<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Toko Trip</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { background: #0a0c10; overflow: hidden; touch-action: none; font-family: ui-monospace, Menlo, Consolas, monospace; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    /* The hints live at the TOP: the bottom of the screen is where the two
       sticks are, and instructions written across a control are worse than
       no instructions. They fade once you have had time to read them. */
    #hints {
      position: fixed; left: 12px; top: 64px; right: 12px; z-index: 3;
      color: #f2e9d8; opacity: 0.75; font-size: 12px; line-height: 1.7;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none;
      transition: opacity 1.2s ease 6s;
    }
    #hints.gone { opacity: 0.16; }
    @media (max-width: 520px) { #hints { font-size: 11px; line-height: 1.55; } }
    #hints a { color: #3aa8a0; pointer-events: auto; }
    #XRButton { bottom: auto !important; top: 16px !important; }
    #mood-name {
      position: fixed; top: 14px; right: 16px; z-index: 3;
      color: #f2e9d8; font-size: 12px; letter-spacing: 0.14em; opacity: 0;
      transition: opacity 0.4s; text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none;
    }
    /* XRButton injects its own styles; keep it above the canvas */
    #XRButton { z-index: 4 !important; }
  </style>
</head>
<body>
  <div id="hints">
    left stick&nbsp; walk · right stick&nbsp; look · tap a thing&nbsp; use it<br>
    the totem changes the mood · the sign goes home · in VR, point + trigger<br>
    the slate by the chair sets how you move<br>
    <a href="chair-lab.html">chair-lab</a>&nbsp; pins your real chair
  </div>
  <canvas id="ui"></canvas>
  <div id="mood-name"></div>

  <!-- three r180 from a local vendor/ copy, not the CDN — same rule sudsjack
       and hyperdagger landed on (offline workers and captive networks both
       punish a CDN import; a beach should not need a signal) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.webgpu.min.js",
      "three/webgpu": "./vendor/three.webgpu.min.js",
      "three/addons/": "./vendor/jsm/",
      "three-mesh-bvh": "./vendor/three-mesh-bvh.module.js"
    }
  }
  </script>

  <script type="module">
    // ── Toko Trip — island v2 ─────────────────────────────────────────────
    // A VR zen island. The world origin is the chair nook: chair-lab.html
    // registers the player's REAL chair in local-floor space and this file
    // builds the island around that spot. Terrain is one pure function,
    // groundHeight(x, z) — the mesh, every scatter pass and the teleport
    // clamp all ask it, so the cove reshapes from two constants.
    //
    // Coordinates: everything is built in TERRAIN space, where the sea is
    // y = 0 and the pad under the chair is y = PAD_H. The island group then
    // drops by PAD_H so the pad lands on the REAL floor (local-floor y = 0)
    // and the sea ends up ~0.9 m below your feet — the nook is a dune top
    // looking down its own cove. gy() converts terrain y → world y.
    //
    // Flip this if the Quest browser's WebGPU build misbehaves in XR.
    const FORCE_WEBGL = false;
    // ── what the radio plays ──────────────────────────────────────────────
    // Out-of-copyright recordings only, each one credited in world. Drop the
    // file into toko-trip/audio/ and add a row: the plaque above the radio
    // reads from this table, so nothing plays unattributed. A row whose file
    // is missing is skipped and the radio falls back to its own synth bed —
    // an absent file must never be a broken button.
    //
    // Provenance is recorded per row rather than assumed. `source` is where
    // the copy came from; `note` is the basis for it being free to use.
    const TRACKS = [
      {
        file: 'audio/deep-blue-sea-blues.mp3',
        title: 'Deep Blue Sea Blues',
        artist: 'Clara Smith',
        year: '1924',
        source: 'openmusicarchive.org',
        note: 'public domain',
      },
      {
        file: 'audio/titanic-blues.mp3',
        title: 'Titanic Blues',
        artist: 'Virginia Liston',
        year: '1920s',
        source: 'openmusicarchive.org',
        note: 'public domain',
      },
    ];
    // Kept for compatibility with the brief: a single URL still works and is
    // treated as one more row.
    const RADIO_TRACK_URL = '';

    // ── props: the door an authored asset comes through ──────────────────
    // `models/CONTRACT.md` is the authoring spec; this is its machine-readable
    // half, and the loader enforces every field below rather than trusting it.
    //
    // THREE NAMED SLOTS the island expects to be replaced by real geometry —
    // the chair you sit in, the radio beside it, and the cove's rock and
    // driftwood. Each ships today as a code-built stand-in that a file takes
    // the place of.
    //
    // `state`  'placeholder' — the code-built prop stands; no file is fetched.
    //          'live'        — the file is loaded, and if it fails to parse OR
    //                          breaks the contract the slot FAILS VISIBLY: a
    //                          magenta cage stands exactly where the prop
    //                          should be, labelled with the reason, and a
    //                          banner names it. It does NOT fall back to the
    //                          stand-in. A silent fallback is indistinguishable
    //                          from a prop nobody placed, and nobody in a
    //                          headset is reading a console warning.
    // `kind`   'dressing'    — it is looked at.
    //          'structure'   — it is stood on or bumped into. This is the set
    //                          three-mesh-bvh will consume when collision
    //                          lands; today it only marks intent, because
    //                          groundHeight() is still the only thing the
    //                          clamps ask.
    // `tris`   the budget. A headset is fill-bound rather than triangle-bound,
    //          but a photoreal download is comfortably both.
    // `span`   [x, y, z] metres — the envelope, checked against the file's own
    //          measured bounds. This is the check that catches the centimetre/
    //          metre mistake, which is the commonest export bug there is and
    //          the one that puts a hundred-metre chair on the beach.
    // `still`  every prop here is STATIC. A file carrying animation clips or a
    //          skinned mesh is refused rather than quietly played or quietly
    //          frozen — this island has no animation system to run it in.
    //
    // Provenance is per row for the same reason the records carry it: CC0
    // needs no credit and still gets a row, and anything CC-BY is CREDITED IN
    // WORLD on the sign post's screen.
    const PROPS = [
      { id: 'chair', state: 'placeholder', file: 'models/chair.glb',
        kind: 'structure', tris: 6000, span: [1.2, 1.6, 1.3], flat: true,
        fit: 'ground', title: 'Deck chair', author: '', source: '', licence: '' },
      { id: 'radio', state: 'placeholder', file: 'models/radio.glb',
        kind: 'dressing', tris: 2500, span: [0.6, 0.7, 0.5], flat: true,
        fit: 'shelf', title: 'Radio', author: '', source: '', licence: '' },
      { id: 'cove', state: 'placeholder', file: 'models/cove.glb',
        kind: 'structure', tris: 24000, span: [30, 8, 30], flat: true,
        fit: 'origin', title: 'Cove rock and driftwood', author: '', source: '', licence: '' },
    ];
    // Anything else that is only ever looked at. Same door, same checks — one
    // loader, because two loaders drift and only one of them gets the fix.
    const DRESSING = [
      // { id: 'rowboat', state: 'live', file: 'models/rowboat.glb',
      //   kind: 'dressing', tris: 4000, span: [4, 1.6, 1.6], at: [-6.2, 7.4],
      //   yaw: 0.7, fit: 'ground', flat: true, title: 'Rowboat', author: '',
      //   source: '',
      //   licence: 'CC0' },
    ];

    import * as THREE from 'three';
    import { XRButton } from 'three/addons/webxr/XRButton.js';
    import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    // three-mesh-bvh (MIT, vendored — see vendor/three-mesh-bvh.LICENSE). The
    // island's collision is a raycast against 40k+ triangles of terrain every
    // frame, which is affordable with a bounds tree and nothing like
    // affordable without one. That is the whole reason it is here.
    import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

    // ── palette ──
    const P = {
      sand: '#e9dcb0', wetSand: '#b99c72', dune: '#d8c893',
      grass: '#74a862', driftwood: '#c9b391', teal: '#3aa8a0',
      cream: '#f2e9d8', sunset: '#e8a05c', neon: '#ff4fd8',
      rock: '#938a7c', rockDark: '#6a6258', seabed: '#2e6a64',
      leaf: '#5e9450', leafLight: '#9ec97a',
    };
    const col = h => new THREE.Color(h).convertSRGBToLinear();

    // ── quality: fill-rate first ──────────────────────────────────────────
    // A headset is fill-bound, not triangle-bound. One knob object, decided
    // once: Quest gets the base budget; Vision Pro (Safari on M-silicon,
    // gaze + pinch, ~3.7K per eye) and desktop get the high one — a larger
    // framebuffer, a sharper shadow map, denser instancing, a denser mesh.
    // Everything that scales reads TIER; nothing else knows which device.
    const TIER = /OculusBrowser|Quest/i.test(navigator.userAgent)
      ? { name: 'quest', fb: 1.0, shadow: 1024, density: 1, foam: 2000, seg: 168 }
      : { name: 'high', fb: 1.2, shadow: 2048, density: 2.2, foam: 3200, seg: 208 };

    // ── the tide: the island's one clock ─────────────────────────────────
    // Everything else on this island happens because you DID something — you
    // pressed the totem, you pointed at the radio. The tide is the only thing
    // that happens because time passed, and it is the whole reason sitting
    // still is worth anything here: it pays out over minutes, in the water
    // level, in where the foam breaks, in how far out you are allowed to
    // walk, and in what the sea sounds like from the chair.
    //
    // A full ebb and flood in seven minutes rather than twelve hours. A real
    // tide is not something you can sit through; this is the slowest thing
    // that is still a thing you can WATCH, which is the only honest reason to
    // pick a number here.
    const TIDE_PERIOD = 420;
    // 28 cm. The cap is not taste — the water's colour and transparency are
    // baked per vertex from the depth at MEAN sea level, so the further the
    // tide moves the more the shallows are painted for a depth they no longer
    // have. At 28 cm the mismatch sits under the foam line, which is the
    // brightest thing in that exact band. Going deeper means rebaking 40k
    // vertex colours as it moves, and that is a 640 KB upload to save an
    // error nobody has seen.
    const TIDE_AMP = 0.28;
    const TIDE_RATES = [['still', 0], ['slow', 1], ['quick', 3]];
    let tideT = TIDE_PERIOD * 0.25;      // begin on a rising mid-tide
    let tide = 0;
    const tideAt = s2 => Math.sin(s2 / TIDE_PERIOD * Math.PI * 2) * TIDE_AMP;

    // ── comfort: the three dials a headset session actually needs ─────────
    // These are not graphics options. They are the settings that can only be
    // judged with the thing on your head — how fast the sand slides past, how
    // you turn, and whether the edges close in while you do — so they are set
    // from INSIDE, on the slate leaning against the chair. A dial you have to
    // take the headset off to move is a dial that gets guessed at instead,
    // and a guess costs a whole session to test.
    const SPEEDS = [['gentle', 1.15], ['easy', 1.9], ['brisk', 2.8]];
    // Smooth yaw is the most reliable way to make somebody queasy in a chair,
    // so the snaps come first and smooth is the opt-in at the end.
    const TURNS = [['snap 30', Math.PI / 6], ['snap 45', Math.PI / 4], ['smooth', 0]];
    const comfort = { speed: 1, turn: 0, vig: 1, sound: 1, time: 1 };
    try {
      const saved = JSON.parse(localStorage.getItem('tokoTrip.comfort') || 'null');
      if (saved) for (const k of ['speed', 'turn', 'vig', 'sound', 'time']) {
        if (Number.isInteger(saved[k])) comfort[k] = saved[k];
      }
    } catch (e) { /* no storage — the defaults, every visit */ }
    const clampComfort = () => {
      comfort.speed = Math.min(SPEEDS.length - 1, Math.max(0, comfort.speed));
      comfort.turn = Math.min(TURNS.length - 1, Math.max(0, comfort.turn));
      comfort.vig = comfort.vig ? 1 : 0;
      comfort.sound = comfort.sound ? 1 : 0;
      comfort.time = Math.min(TIDE_RATES.length - 1, Math.max(0, comfort.time));
    };
    clampComfort();
    const moveSpeed = () => SPEEDS[comfort.speed][1];
    function setComfort(key, v) {
      const wrap = key === 'speed' ? SPEEDS.length : key === 'turn' ? TURNS.length
        : key === 'time' ? TIDE_RATES.length : 2;
      comfort[key] = ((v % wrap) + wrap) % wrap;
      try { localStorage.setItem('tokoTrip.comfort', JSON.stringify(comfort)); } catch (e) {}
      if (key === 'sound') applySound();
      paintSlate();
    }

    // ?perf puts the frame cost on the slate and in the corner. OFF by
    // default, because a number in the corner of a zen island is a number you
    // start playing instead of a place you sit in — and it can be turned on
    // from inside, by tapping the slate's top row, which is the only way it
    // is any use while you are wearing the thing.
    let perfOn = new URLSearchParams(location.search).has('perf');

    // ── terrain: one source of truth ──
    const ISLAND_R = 18, PAD_H = 0.92, PAD_INNER = 1.6, PAD_OUTER = 3.4;
    // The cove spine: the tip a few steps in front of the chair, the mouth
    // well out past the shoreline. Move these two points and the width term
    // in groundHeight and the whole bay reshapes — foam, pebbles, reeds and
    // the teleport clamp all re-place themselves off the same function.
    const INLET_A = { x: 0.4, z: 3.8 }, INLET_B = { x: 5.5, z: 16.0 };

    const hash = (ix, iz) => {
      let h = (ix * 374761393 + iz * 668265263) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (a, b, x) => {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    };
    function vnoise(x, z) {
      const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
      const sx = fx * fx * (3 - 2 * fx), sz = fz * fz * (3 - 2 * fz);
      const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
      return lerp(lerp(a, b, sx), lerp(c, d, sx), sz);
    }
    const fbm = (x, z) => vnoise(x, z) * 0.55 + vnoise(x * 2.1, z * 2.1) * 0.28 + vnoise(x * 4.3, z * 4.3) * 0.17;

    // distance to the inlet spine, plus how far along it (0 = tip, 1 = sea)
    function inletDist(x, z) {
      const dx = INLET_B.x - INLET_A.x, dz = INLET_B.z - INLET_A.z;
      const u = Math.min(1, Math.max(0,
        ((x - INLET_A.x) * dx + (z - INLET_A.z) * dz) / (dx * dx + dz * dz)));
      const px = INLET_A.x + dx * u, pz = INLET_A.z + dz * u;
      return { d: Math.hypot(x - px, z - pz), u };
    }

    // The profile is written in WORLD METRES, not in a normalised t, because
    // "how many steps of sand before the water" is the thing being tuned and
    // a normalised dome hides it. Four terms: a grass crown, a long shoulder,
    // the walk into the water, then the drop-off to the seabed. The stretch
    // from r 9 to r 13 falls about 35 cm — a beach you stroll down, not a
    // dune you slide off.
    function profile(r) {
      return 1.35 * smooth(9.5, 3.0, r)      // the grass crown
        + 0.4 * smooth(14.0, 8.0, r)         // the mellow beach shoulder
        - 0.8 * smooth(12.8, 17.5, r)        // into the shallows
        - 1.7 * smooth(17.5, 25.0, r);       // and away to the seabed
    }
    // How much a point belongs to the cove's SAND — 1 in the bay and across
    // its beach, falling to 0 well inland. One function, asked by the height
    // field, the terrain's colour and every planting pass, so the sand and
    // the things that refuse to grow on it can never disagree about where
    // the beach is.
    function beachness(x, z) {
      const { d, u } = inletDist(x, z);
      const w = 2.7 + u * 5.8;
      return 1 - smooth(w * 1.15, w * 2.6, d);
    }
    function baseHeight(x, z) {
      const r = Math.hypot(x, z);
      let h = profile(r);
      const { d, u } = inletDist(x, z);
      const w = 2.7 + u * 5.8;
      const beach = 1 - smooth(w * 1.15, w * 2.6, d);
      // Dunes belong to the crown. The noise is switched off across the sand,
      // because a beach with lumps in it is a dune field, not a beach.
      h += (fbm(x * 0.3 + 7.3, z * 0.3 - 4.1) - 0.5) * 1.15
        * smooth(13.0, 4.0, r) * (1 - beach * 0.92);
      h = Math.max(h, -2.4);
      // The cove: a broad bay with a broad beach, not a channel between banks.
      // The apron runs out to nearly three times the water's width, so the
      // walk from the chair to the sea is a long flat one over sand rather
      // than a step down a bank.
      // A CANTALOUPE SLICE, not a V. The bed is a shallow parabola across
      // the bay's width — deepest on the spine, rising to nothing at the
      // water's edge — so the cross-section is one open curve you can see
      // the bottom of, rather than two banks meeting at a trough. Carving a
      // channel with a smoothstep gave the V; this gives the melon rind.
      const k = Math.min(1, d / w);
      const bowl = -(0.26 + u * 0.5) * (1 - k * k);
      h = lerp(h, bowl, 1 - smooth(w * 0.85, w * 1.45, d));
      // And then the shore itself. Carving a bay out of a dome leaves the
      // spoil either side of it as two humps, which reads as a channel
      // between dunes rather than a beach. So inside the sand zone the
      // ground is pulled down to a RAMP measured from the water's edge —
      // 7 cm per metre, ankle-deep at the waterline and still only knee-high
      // ten metres up the sand. It only ever lowers ground, never raises it,
      // so the crown behind is untouched.
      const ramp = Math.max(0, d - w * 1.15) * 0.10;
      h = lerp(h, Math.min(h, ramp), beach);
      // the pad: honest level ground under the real chair
      h = lerp(h, PAD_H, smooth(PAD_OUTER, PAD_INNER, r));
      return h;
    }

    // ── the islet, and the bar that reaches it at low water ─────────────
    // The cave lives on a rock off the right-hand shore, where it can be seen
    // from the chair, and the only way to it is a sandbar whose crest sits
    // between low and high water. There is no rule anywhere that says "the
    // cave opens at low tide": standY() already refuses anything below sea
    // level, so a bar at −10 cm is dry exactly when the tide is under it and
    // the gate is the ocean. The crest dips 5 cm in the middle, so the two
    // ends surface first and the gap closes from both sides while you watch.
    //
    // FOUND, not placed, like the jetty: walk out from the chair's bearing on
    // the base terrain until the sea floor drops past low water, and put the
    // rock ten metres beyond that — far enough that the channel either side
    // of the bar never dries. The bearing is fixed off the inlet rather than
    // off the calibrated chair, because the terrain does not turn when you
    // recalibrate your seat and the islet must not either.
    const ISLET = (() => {
      const yaw = Math.atan2(INLET_A.x, INLET_A.z) + 0.85;
      const ux = Math.sin(yaw), uz = Math.cos(yaw);
      let shore = 15;
      for (let r = 4; r < 26; r += 0.25) if (baseHeight(ux * r, uz * r) < -0.3) { shore = r; break; }
      const R = shore + 10;
      return { x: ux * R, z: uz * R, ux, uz, R, shore,
        top: 0.95, flat: 3.5, outer: 6.4,          // a sand-topped rock, level where the cave stands
        barFrom: shore - 5, barTo: R - 4.2 };
    })();
    const barCrest = t => -0.10 - 0.05 * Math.sin(Math.PI * Math.min(1, Math.max(0, t)));

    function groundHeight(x, z) {
      let h = baseHeight(x, z);
      const d = Math.hypot(x - ISLET.x, z - ISLET.z);
      if (d < ISLET.outer) h = Math.max(h, lerp(h, ISLET.top, smooth(ISLET.outer, ISLET.flat, d)));
      const along = x * ISLET.ux + z * ISLET.uz;
      if (along > ISLET.barFrom - 1.5 && along < ISLET.barTo + 1.5) {
        const perp = Math.abs(x * ISLET.uz - z * ISLET.ux);
        if (perp < 1.8) {
          const t = (along - ISLET.barFrom) / (ISLET.barTo - ISLET.barFrom);
          const ends = smooth(ISLET.barFrom - 1.5, ISLET.barFrom, along)
            * smooth(ISLET.barTo + 1.5, ISLET.barTo, along);
          h = Math.max(h, lerp(-2.4, barCrest(t), smooth(1.6, 0.55, perp) * ends));
        }
      }
      return h;
    }
    const gy = (x, z) => groundHeight(x, z) - PAD_H;   // terrain → world y
    const slopeAt = (x, z) => {
      const e = 0.22;
      return Math.hypot(groundHeight(x + e, z) - groundHeight(x - e, z),
        groundHeight(x, z + e) - groundHeight(x, z - e)) / (2 * e);
    };

    // ── the lightmap ─────────────────────────────────────────────────────
    // v2 shaded the sand with flat discs under each object — a decent fake
    // that could not know a palm has a CROWN, so trunks had shadows and the
    // thing casting the real shade did not. This is the real thing: every
    // occluder is a sphere or a box, and each point on the ground fires a
    // cosine-weighted hemisphere of rays and counts how much sky it can see.
    //
    // It stays cheap enough to run at load by (a) baking to a grid rather
    // than per pixel, and (b) binning the proxies into 4 m cells so a ray
    // only ever tests its own neighbourhood instead of all ninety of them.
    const occluders = [];                      // kept: the scatter plan's API
    const occlude = (x, z, r, s) => occluders.push({ x, z, r, s });
    const proxies = [];
    const proxySphere = (x, y, z, r) => proxies.push({ x, y, z, r });
    const proxyBox = (x, y, z, hx, hy, hz) => proxies.push({ x, y, z, hx, hy, hz });

    const AO_N = 256, AO_HALF = 28, AO_RAYS = 12, AO_REACH = 5.0;
    const aoGrid = new Float32Array(AO_N * AO_N).fill(1);
    const CELL = 4, CELLS = Math.ceil((AO_HALF * 2) / CELL);
    const bins = Array.from({ length: CELLS * CELLS }, () => []);
    const binAt = (x, z) => {
      const i = Math.floor((x + AO_HALF) / CELL), j = Math.floor((z + AO_HALF) / CELL);
      return (i < 0 || j < 0 || i >= CELLS || j >= CELLS) ? null : bins[j * CELLS + i];
    };

    // ray vs sphere / ray vs AABB — both slab-simple, both hot, both inlined
    function hits(o, dx, dy, dz, ox, oy, oz) {
      if (o.r !== undefined) {
        const ex = o.x - ox, ey = o.y - oy, ez = o.z - oz;
        const b = ex * dx + ey * dy + ez * dz;
        if (b < 0) return false;
        const c = ex * ex + ey * ey + ez * ez - o.r * o.r;
        return b * b - c >= 0 && b < AO_REACH;
      }
      let t0 = 0, t1 = AO_REACH;
      for (const [p, d, h, c] of [[ox, dx, o.hx, o.x], [oy, dy, o.hy, o.y], [oz, dz, o.hz, o.z]]) {
        if (Math.abs(d) < 1e-6) { if (Math.abs(p - c) > h) return false; continue; }
        let a = (c - h - p) / d, b = (c + h - p) / d;
        if (a > b) { const t = a; a = b; b = t; }
        t0 = Math.max(t0, a); t1 = Math.min(t1, b);
        if (t0 > t1) return false;
      }
      return t1 > 0;
    }

    function bakeLightmap() {
      for (const p of proxies) {                        // bin by footprint
        const rad = (p.r ?? Math.max(p.hx, p.hz)) + 0.4;
        for (let z = p.z - rad; z <= p.z + rad + CELL; z += CELL) {
          for (let x = p.x - rad; x <= p.x + rad + CELL; x += CELL) binAt(x, z)?.push(p);
        }
      }
      // one cosine-weighted hemisphere, reused at every sample
      const dirs = [];
      for (let i = 0; i < AO_RAYS; i++) {
        const u1 = (i + 0.5) / AO_RAYS, u2 = (i * 0.6180339887) % 1;
        const r = Math.sqrt(u1), th = u2 * Math.PI * 2;
        dirs.push([r * Math.cos(th), Math.sqrt(Math.max(0, 1 - u1)), r * Math.sin(th)]);
      }
      const step = (AO_HALF * 2) / AO_N;
      const near = [];
      for (let j = 0; j < AO_N; j++) {
        const z = -AO_HALF + (j + 0.5) * step;
        for (let i = 0; i < AO_N; i++) {
          const x = -AO_HALF + (i + 0.5) * step;
          near.length = 0;
          for (let dj = -1; dj <= 1; dj++) {
            for (let di = -1; di <= 1; di++) {
              const b = binAt(x + di * CELL, z + dj * CELL);
              if (b) for (const p of b) if (!near.includes(p)) near.push(p);
            }
          }
          if (!near.length) continue;
          const y = groundHeight(x, z) + 0.05;
          let open = 0;
          for (const [dx, dy, dz] of dirs) {
            let blocked = false;
            for (let k = 0; k < near.length; k++) {
              if (hits(near[k], dx, dy, dz, x, y, z)) { blocked = true; break; }
            }
            if (!blocked) open++;
          }
          aoGrid[j * AO_N + i] = 0.42 + 0.58 * (open / AO_RAYS);
        }
      }
    }
    // bilinear, so the vertex colours and the texture agree with each other
    function bakedAO(x, z) {
      const step = (AO_HALF * 2) / AO_N;
      const fx = Math.min(AO_N - 1.001, Math.max(0, (x + AO_HALF) / step - 0.5));
      const fz = Math.min(AO_N - 1.001, Math.max(0, (z + AO_HALF) / step - 0.5));
      const i = fx | 0, j = fz | 0, tx = fx - i, tz = fz - j;
      const a = aoGrid[j * AO_N + i], b = aoGrid[j * AO_N + i + 1];
      const c = aoGrid[(j + 1) * AO_N + i], d = aoGrid[(j + 1) * AO_N + i + 1];
      return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * tz;
    }

    // ── the chair nook: calibration from chair-lab.html, or the default ──
    // chairP is WORLD space: [x, seat height above the real floor, z].
    let chairP = [0, 0.5, 0], chairYaw = Math.atan2(INLET_A.x, INLET_A.z);
    try {
      const fb = JSON.parse(localStorage.getItem('tokoTrip.chairPoseFallback') || 'null');
      const yaw = parseFloat(localStorage.getItem('tokoTrip.chairYaw'));
      if (fb && Array.isArray(fb.p)) {
        // clamp to the pad — a stale Guardian remap must not put the chair in the sea
        if (Math.hypot(fb.p[0], fb.p[2]) < PAD_INNER) {
          chairP = [fb.p[0], Math.min(0.8, Math.max(0.3, fb.p[1])), fb.p[2]];
        }
        if (Number.isFinite(fb.yaw)) chairYaw = fb.yaw;
      }
      if (Number.isFinite(yaw)) chairYaw = yaw;
    } catch (e) { /* no storage — the default nook */ }

    // ── renderer / scene ──
    const renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: FORCE_WEBGL });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.xr.enabled = true;
    if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);
    if (renderer.xr.setFramebufferScaleFactor) renderer.xr.setFramebufferScaleFactor(TIER.fb);
    // Static sun shadows: the scene never moves and the sun only moves on a
    // mood change, so the map is rendered while the mood blends and then NOT
    // AT ALL — crisp palm shadows at zero steady-state cost. The one honest
    // approximation: crown sway (±2°) is not in the shadow, and at that
    // amplitude nobody has caught it.
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    if ('autoUpdate' in renderer.shadowMap) renderer.shadowMap.autoUpdate = false;
    const shadowDirty = () => { renderer.shadowMap.needsUpdate = true; };
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 400);
    scene.add(camera);
    const listener = new THREE.AudioListener();
    camera.add(listener);

    // ── the comfort vignette ─────────────────────────────────────────────
    // The edges close in while you glide or turn, which is the one comfort
    // trick that reliably helps and costs nothing. It is a MESH hung a metre
    // in front of the head, NOT a post-processing pass: no-post is what keeps
    // both backends and both eyes cheap, and this is one textured quad — the
    // cheapest thing in the frame. Children of `camera` follow the head in XR
    // because three drives that camera from the headset pose each frame.
    const vignette = (() => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 128;
      const g = cv.getContext('2d');
      // clear well past the middle, black in the corners: the ramp has to
      // finish at the CORNER radius (64·√2), not the edge, or the corners are
      // the only part that darkens and it reads as four smudges
      const rad = g.createRadialGradient(64, 64, 30, 64, 64, 78);
      rad.addColorStop(0, 'rgba(0,0,0,0)');
      rad.addColorStop(0.45, 'rgba(0,0,0,0.30)');
      rad.addColorStop(1, 'rgba(0,0,0,1)');
      g.fillStyle = rad; g.fillRect(0, 0, 128, 128);
      const tx = new THREE.CanvasTexture(cv);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(5, 5),
        new THREE.MeshBasicMaterial({
          map: tx, transparent: true, opacity: 0,
          depthTest: false, depthWrite: false, toneMapped: false,
        }));
      m.position.z = -1;          // a comfortable focal distance, not on the nose
      m.renderOrder = 999;
      m.frustumCulled = false;
      m.visible = false;
      camera.add(m);
      return m;
    })();
    // The quad has to FIT the frustum it is hanging in, and there is no one
    // frustum: a 70° flat camera and a headset eye are different shapes, and
    // the two eyes are not the same shape as each other. So it is measured
    // off the projection matrix in use — half-extents at one metre — rather
    // than sized to a guess. Sized to a guess it fell entirely outside the
    // flat camera's view and darkened nothing at all, while reporting itself
    // fully on.
    function vigFit() {
      const xc = renderer.xr.isPresenting ? renderer.xr.getCamera() : null;
      const cams = (xc && xc.cameras && xc.cameras.length) ? xc.cameras : [camera];
      let hw = 0, hh = 0;
      for (const c of cams) {
        const e = c.projectionMatrix.elements;
        if (!e[0] || !e[5]) continue;
        hw = Math.max(hw, (1 + Math.abs(e[8])) / e[0]);
        hh = Math.max(hh, (1 + Math.abs(e[9])) / e[5]);
      }
      // geometry is 5 x 5 at one metre; 1.08 covers the eye offset in XR
      vignette.scale.set(hw * 2 * 1.08 / 5, hh * 2 * 1.08 / 5, 1);
    }
    let vigAmt = 0, vigKick = 0;
    function vigUpdate(dt, moving) {
      vigKick = Math.max(0, vigKick - dt);
      const want = comfort.vig && (moving || vigKick > 0) ? 1 : 0;
      // in fast, out slow: an edge that snaps back reads as a flicker
      vigAmt += (want - vigAmt) * Math.min(1, dt * (want ? 9 : 3.5));
      // Weaker on a flat screen: there is no vestibular conflict to soften
      // there, so the same darkening that helps in a headset is just a dimmer
      // picture. It stays visible on the desktop so you can see what the
      // setting does before you put the thing on.
      vignette.material.opacity = vigAmt * (renderer.xr.isPresenting ? 0.8 : 0.45);
      vignette.visible = vigAmt > 0.01;
      if (vignette.visible) vigFit();
    }

    const island = new THREE.Group();
    island.position.y = -PAD_H;
    scene.add(island);

    // ── lights ──
    const sun = new THREE.DirectionalLight(0xffffff, 2.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(TIER.shadow, TIER.shadow);
    Object.assign(sun.shadow.camera, { left: -18, right: 18, top: 18, bottom: -18, near: 20, far: 110 });
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.02;
    scene.add(sun, sun.target);
    const hemi = new THREE.HemisphereLight(0xffffff, 0x888888, 0.5);
    scene.add(hemi);

    // ── sky dome + sun disc ──
    const skyGeo = new THREE.SphereGeometry(170, 24, 16);
    skyGeo.setAttribute('color',
      new THREE.BufferAttribute(new Float32Array(skyGeo.attributes.position.count * 3), 3));
    const sky = new THREE.Mesh(skyGeo,
      new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true, fog: false }));
    scene.add(sky);
    const _skyC = new THREE.Color(), _skySea = new THREE.Color();
    function paintSky(top, horiz, sea) {     // takes linear THREE.Colors
      // below the horizon the dome dives toward the sea colour, so the water
      // plane's far edge never draws a band against a lighter dome
      _skySea.copy(sea ?? horiz).multiplyScalar(0.8);
      const pos = skyGeo.attributes.position, out = skyGeo.attributes.color;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) / 170;
        if (y >= 0) _skyC.copy(horiz).lerp(top, Math.pow(y, 0.55));
        else _skyC.copy(horiz).lerp(_skySea, Math.min(1, -y * 18));
        out.setXYZ(i, _skyC.r, _skyC.g, _skyC.b);
      }
      out.needsUpdate = true;
    }
    const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(7, 24),
      new THREE.MeshBasicMaterial({ fog: false, transparent: true, opacity: 0.95 }));
    scene.add(sunDisc);
    const sunHalo = new THREE.Mesh(new THREE.CircleGeometry(16, 24),
      new THREE.MeshBasicMaterial({ fog: false, transparent: true, opacity: 0.22, depthWrite: false }));
    scene.add(sunHalo);

    scene.fog = new THREE.Fog(0xe8c49a, 18, 130);

    // ═══ SKY DETAIL ═══ Half of what a seated person looks at is sky, and a
    // bare gradient is the cheapest thing in the scene to improve. Clouds are
    // soft sprites on a slowly turning ring — no volumetrics, no cost, and
    // they take the mood's own colour so a sunset lights their undersides.
    // its own seeded source: the scatter plan's rng is not born yet, and
    // sharing one would make the sky reshuffle every time a rock moves
    const rngSky = (() => { let s = 90210; return () => (s = (Math.imul(s, 48271) >>> 0) % 2147483647) / 2147483647; })();
    const cloudTex = (() => {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 128;
      const g = cv.getContext('2d');
      // a few overlapping soft discs read as a cloud; one disc reads as a dot
      for (const [cx, cy, r, a] of [[64, 74, 34, 0.85], [42, 78, 24, 0.7],
        [88, 80, 26, 0.7], [58, 60, 26, 0.75], [80, 62, 20, 0.6]]) {
        const grd = g.createRadialGradient(cx, cy, 0, cx, cy, r);
        grd.addColorStop(0, `rgba(255,255,255,${a})`);
        grd.addColorStop(0.55, `rgba(255,255,255,${a * 0.5})`);
        grd.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = grd;
        g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      }
      const t = new THREE.CanvasTexture(cv);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    })();
    const clouds = new THREE.Group();
    const cloudMats = [];
    for (let i = 0; i < 16; i++) {
      const m = new THREE.MeshBasicMaterial({
        map: cloudTex, transparent: true, depthWrite: false, fog: false,
        opacity: 0.5 + rngSky() * 0.35,
      });
      const w = 26 + rngSky() * 40;
      const s = new THREE.Mesh(new THREE.PlaneGeometry(w, w * 0.42), m);
      const a = (i / 16) * Math.PI * 2 + rngSky() * 0.3;
      const rad = 105 + rngSky() * 45;
      s.position.set(Math.cos(a) * rad, 16 + rngSky() * 42, Math.sin(a) * rad);
      s.lookAt(0, s.position.y * 0.4, 0);
      cloudMats.push(m);
      clouds.add(s);
    }
    scene.add(clouds);

    // ═══ THE HORIZON ═══ Two far islands. An empty horizon has no scale in
    // it — with something on it, the sea reads as distance rather than as a
    // flat band. They sit in fog colour so they never look like near geometry.
    const farIsles = [];
    for (const [a, dist, w, h] of [[1.15, 165, 62, 6.5], [2.05, 205, 40, 4.2], [-0.55, 185, 30, 3.4]]) {
      const g = new THREE.SphereGeometry(1, 18, 8, 0, Math.PI * 2, 0, Math.PI / 2);
      g.scale(w, h, w * 0.5);
      const m = new THREE.MeshBasicMaterial({ fog: false, transparent: true, opacity: 0.85 });
      const isle = new THREE.Mesh(g, m);
      isle.position.set(Math.cos(a) * dist, -PAD_H - 0.4, Math.sin(a) * dist);
      scene.add(isle);
      farIsles.push(m);
    }

    // ═══ BIRDS ═══ Three of them, circling, never landing. The cheapest
    // possible life: two triangles each, and a wingbeat that is one sine.
    const birds = [];
    {
      const bm = new THREE.MeshBasicMaterial({ color: 0x2b2b30, side: THREE.DoubleSide, fog: false });
      for (let i = 0; i < 3; i++) {
        const b = new THREE.Group();
        for (const s of [-1, 1]) {
          const wing = new THREE.BufferGeometry();
          wing.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
            0, 0, 0, s * 0.62, 0.1, -0.16, s * 0.55, 0, 0.2,
          ]), 3));
          const w = new THREE.Mesh(wing, bm);
          b.add(w);
        }
        b.userData = { r: 15 + i * 7, y: 7 + i * 3.5, sp: 0.05 + i * 0.012, ph: i * 2.1 };
        scene.add(b);
        birds.push(b);
      }
    }

    // ── vertex-colour helpers ──
    // paint(geo, colour | (x,y,z) => Color) — every material here reads
    // vertex colours, which is what lets whole passes merge into one draw.
    const _c = new THREE.Color(), _c2 = new THREE.Color();
    function paint(geo, c) {
      const pos = geo.attributes.position, arr = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const v = typeof c === 'function' ? c(pos.getX(i), pos.getY(i), pos.getZ(i)) : c;
        arr[i * 3] = v.r; arr[i * 3 + 1] = v.g; arr[i * 3 + 2] = v.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
      return geo;
    }

    // one satin material family for everything solid. Foliage carries a
    // whisper of emissive — an ambient floor, so a frond against a dusk sky
    // is a lit shape, never a black silhouette (the cover-art lesson).
    const satin = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0, flatShading: true });
    // NOT flatShading: derivative normals on thin double-sided planes go
    // dark from half the angles — the attribute normals light both faces.
    const foliage = new THREE.MeshStandardMaterial({
      vertexColors: true, roughness: 0.9, metalness: 0,
      side: THREE.DoubleSide, emissive: col('#1a2a10'), emissiveIntensity: 1,
    });

    // transformed clone → the static merge pile (one draw call at the end).
    // Pile geometry is TERRAIN space; the merged mesh joins `island`.
    const pile = [];
    // mergeGeometries refuses a list whose attribute sets disagree, so every
    // pile is normalised the same way: unindexed, and given the empty UVs the
    // textured members already carry. One copy of this, because two piles now
    // go through it and a second copy is the one that misses a fix.
    const mergeFor = list => BGU.mergeGeometries(list.map(g => {
      const c = g.index ? g.toNonIndexed() : g;
      if (!c.attributes.uv) c.setAttribute('uv',
        new THREE.BufferAttribute(new Float32Array(c.attributes.position.count * 2), 2));
      return c;
    }));
    function drop(geo, x, y, z, ry = 0, sx = 1, sy = 1, sz = 1) {
      const g = geo.clone();
      g.scale(sx, sy, sz); g.rotateY(ry); g.translate(x, y, z);
      pile.push(g);
    }

    // ═══ SCATTER PLAN — positions first, so the terrain can bake their AO ═══
    const rng = (() => { let s = 20260810; return () => (s = (Math.imul(s, 48271) >>> 0) % 2147483647) / 2147483647; })();

    // palms: ring the nook and the banks, on dry ground, clear of pad and inlet
    const palmSpots = [];
    for (const [x, z] of [[-3.4, 4.4], [4.0, 1.2], [-4.8, 0.6], [1.1, -4.3],
      [-2.2, -5.9], [6.4, 4.6], [-7.1, 3.2], [3.6, -7.2], [-5.6, -5.4], [7.4, -2.2]]) {
      if (groundHeight(x, z) <= 0.5) continue;
      // The trunk's shape is decided HERE, not in the builder, because the AO
      // bake needs to know where the crown ends up — a palm's shadow is the
      // biggest one on this island and baking without it would be a lie.
      const spot = { x, z, lean: rng() * Math.PI * 2, leanAmt: 0.14 + rng() * 0.12 };
      const segs = 6, segH = 0.62;
      let px = 0, pz = 0, py = groundHeight(x, z), ang = 0;
      for (let i = 0; i < segs; i++) {
        ang += spot.leanAmt / segs * (i + 1);
        px += Math.sin(ang) * segH * Math.sin(spot.lean);
        pz += Math.sin(ang) * segH * Math.cos(spot.lean);
        py += Math.cos(ang) * segH;
        spot[`seg${i}`] = [x + px, py, z + pz];
      }
      spot.crown = [x + px, py, z + pz];
      palmSpots.push(spot);
      occlude(x, z, 1.25, 0.5);
    }
    // rocks: some on the grass, some in the shallows
    const rockSpots = [];
    for (let i = 0; i < 20; i++) {
      const a = rng() * Math.PI * 2, r = 4.5 + rng() * 11;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (groundHeight(x, z) < -0.5 || Math.hypot(x, z) < PAD_OUTER) { i--; continue; }
      const s = 0.22 + rng() * 0.5;
      rockSpots.push({ x, z, s });
      occlude(x, z, s * 2.4, 0.55);
    }
    // lanterns: the deck edge, the path down to the water, across the bank
    const lanternSpots = [{ x: -1.3, z: 1.9 }, { x: 1.9, z: 3.1 }, { x: -2.4, z: -2.1 }];
    lanternSpots.forEach(l => occlude(l.x, l.z, 0.5, 0.4));
    const logSpot = { x: -3.4, z: 6.8, ry: 0.9 };
    occlude(logSpot.x, logSpot.z, 1.5, 0.45);
    const totemSpot = { x: 1.75, z: -0.6 };
    occlude(totemSpot.x, totemSpot.z, 0.55, 0.5);
    const caveSpot = { x: ISLET.x, z: ISLET.z };
    occlude(caveSpot.x, caveSpot.z, 3.6, 0.5);
    // The grotto is a ring of rock with a roof, open on the side that faces
    // the bar. Declared here, before the lightmap, because the bake has to
    // know the roof is there: a cave floor lit like open sand is not a cave.
    const CAVE_RING = 2.6;
    const caveMouth = Math.atan2(-ISLET.ux, -ISLET.uz);       // facing back along the bar
    const CAVE_BLOBS = (() => {
      const out = [], gh = groundHeight(caveSpot.x, caveSpot.z);
      // walls: flanking the mouth wide enough to walk through (1.6 m between
      // rock faces), then round the back, each overlapping the next
      const gap = 0.86, n = 8, span = Math.PI * 2 - gap * 2;
      for (let i = 0; i < n; i++) {
        const a = caveMouth + gap + span * (i / (n - 1));
        const s = 1.2 + hash(i, 31) * 0.3;
        out.push({ x: caveSpot.x + Math.sin(a) * CAVE_RING, z: caveSpot.z + Math.cos(a) * CAVE_RING,
          y: gh + s * 0.45, s, sy: 1.15, rot: hash(i, 7) * 6, roof: false });
      }
      // roof: flat slabs over the chamber, held back from the mouth so the
      // doorway is two metres high rather than a crawl
      for (let i = 0; i < 5; i++) {
        const a = caveMouth + Math.PI + (i - 2) * 0.75;
        const rr = i === 2 ? 0.35 : 1.15;
        const s = 1.55 + hash(i, 53) * 0.25;
        out.push({ x: caveSpot.x + Math.sin(a) * rr, z: caveSpot.z + Math.cos(a) * rr,
          y: gh + 2.35, s, sy: 0.42, rot: hash(i, 11) * 6, roof: true });
      }
      return out;
    })();
    const signSpot = { x: -3.3, z: 1.5 };
    occlude(signSpot.x, signSpot.z, 0.7, 0.42);
    // ── the jetty ──────────────────────────────────────────────────────────
    // A walk out over the water, laid along the cove's own spine and offset to
    // one side of it. On the spine it runs dead down the middle of the bay and
    // halves the open water from the chair, which is the one view this island
    // is built around — so it has to go to one side. Which side is not a taste
    // question, it is the only lane that fits:
    //
    //   the lantern at (1.9, 3.1) sits 1.65 m off the spine, and the sign home
    //   sits 2.5 m off it the other way. Between them the deck fouls one or
    //   the other for every offset from −2.8 to +2.8. Outside them the palms
    //   close in. −3.0 is the one lane with clearance on both sides (1.33 m to
    //   the nearest palm) that still ends in water deep enough to need posts.
    //
    // Measured, not guessed, and it cost a build to learn: the first cut was
    // −1.6 and put the deck THROUGH that lantern — 9 cm from its post — because
    // the clearance check asked the palms and nothing else.
    //
    // Nothing here is a measured coordinate. `s0` — where the planks meet the
    // sand — is FOUND, by asking the terrain where it is deck-high, because
    // the file's own rule is that moving INLET_A/INLET_B reshapes the bay and
    // everything re-places itself off the same function. A hardcoded start
    // would be the one thing in the cove that did not move with it.
    const JETTY = (() => {
      const dx = INLET_B.x - INLET_A.x, dz = INLET_B.z - INLET_A.z;
      const L = Math.hypot(dx, dz), ux = dx / L, uz = dz / L;
      const OFF = -3.0, deck = 0.42, w = 1.35;
      const at = s => [INLET_A.x + ux * s - uz * OFF, INLET_A.z + uz * s + ux * OFF];

        // Caustics are a focused image of the surface: they are brightest in
        // the shallows and gone by the time the bottom is a couple of metres
        // down, which is also what keeps this decal off the open sea.
        const v = smooth(0.0, 0.22, depth) * lerp(1, 0.08, smooth(0.3, 2.2, depth));

    }
    causRebake();
    const waterNormal = waterNormalTex(), waterDisp = waterDispTex();
    waterNormal.repeat.set(44, 44);
    waterDisp.repeat.set(5, 5);

    // The sky, as something the water can reflect. Six small faces painted
    // from the SAME gradient the dome uses, plus the sun, rebuilt when the
    // mood moves. A real cube camera would also catch the clouds, but it
    // would cost a six-view render and a backend-specific code path for a
    // reflection nobody will read cloud shapes out of; the colour is the
    // point, and this gets the colour exactly.
    const ENV_N = 32;
    const envFaces = Array.from({ length: 6 }, () => {
      const cv = document.createElement('canvas'); cv.width = cv.height = ENV_N; return cv;
    });
    const ENV_DIR = [
      (u, v) => [1, -v, -u], (u, v) => [-1, -v, u],
      (u, v) => [u, 1, v], (u, v) => [u, -1, -v],
      (u, v) => [u, -v, 1], (u, v) => [-u, -v, -1],
    ];
    let envCube = null, envStamp = -1;
    const _envC = new THREE.Color(), _envSea = new THREE.Color();
    function rebuildEnv() {
      _envSea.copy(cur.water).multiplyScalar(0.8);
      const sd = cur.sunDir;
      envFaces.forEach((cv, f) => {
        const g = cv.getContext('2d'), im = g.createImageData(ENV_N, ENV_N);
        for (let y = 0; y < ENV_N; y++) for (let x = 0; x < ENV_N; x++) {
          const [dx0, dy0, dz0] = ENV_DIR[f]((x + 0.5) / ENV_N * 2 - 1, (y + 0.5) / ENV_N * 2 - 1);
          // three.js samples a CubeTexture with X mirrored (its flipEnvMap
          // convention for authored cubemaps), so the sun is painted mirrored
          // too, or its reflection lands on the wrong side of the sea
          const L = Math.hypot(dx0, dy0, dz0), dx = -dx0 / L, dy = dy0 / L, dz = dz0 / L;
          if (dy >= 0) _envC.copy(cur.skyHoriz).lerp(cur.skyTop, Math.pow(dy, 0.55));

          const d = dx * sd.x + dy * sd.y + dz * sd.z;
          _envC.lerp(cur.sunCol, smooth(0.975, 0.9995, d));       // the sun and its glow
          _envC.convertLinearToSRGB();
          const i = (y * ENV_N + x) * 4;
          im.data[i] = _envC.r * 255; im.data[i + 1] = _envC.g * 255; im.data[i + 2] = _envC.b * 255; im.data[i + 3] = 255;

      // texture object, and an in-place update would keep reflecting the
      // previous mood
      const old = envCube;

      envCube.colorSpace = THREE.SRGBColorSpace;
      envCube.needsUpdate = true;
      waterMat.envMap = envCube; waterMat.needsUpdate = true;

    }

    const waterMat = new THREE.MeshStandardMaterial({
      color: col(P.teal), transparent: true, opacity: 0.82,
      roughness: 0.12, metalness: 0,
      normalMap: waterNormal, normalScale: new THREE.Vector2(0.34, 0.34),
      displacementMap: waterDisp, displacementScale: 0.11, displacementBias: -0.055,
      envMapIntensity: 1.15,
    });
    // The shore fade is EXACT rather than screen-space. The usual way to fade
    // water at a beach is to read the depth buffer and compare — but this
    // island already has the seabed as a function, so every vertex can simply
    // ask how deep the water is above it. No depth texture, no backend
    // difference, and it cannot disagree with the ground it is lying on.
    // Colour and alpha both ride that depth: shallows are pale and see-
    // through, so the bay reads as a bowl you can see the bottom of.
    waterMat.vertexColors = true;
    const waterGeo = new THREE.PlaneGeometry(70, 70, 200, 200);
    waterGeo.rotateX(-Math.PI / 2);
    {
      const pos = waterGeo.attributes.position;

        // tints it. Shallow must still read as WATER: too transparent and

        col4[i * 4] = lerp(1.2, 0.55, k);
        col4[i * 4 + 1] = lerp(1.34, 0.8, k);

      // what lets the TSL material below know how deep the water is at a
      // pixel WITHOUT a bathymetry texture and without baking anything that
      // the tide would then invalidate: the height is static, sea level is a
      // uniform, and the rasteriser interpolates between 28 cm samples.
      // WORLD y, not terrain height. The water mesh lives in scene space and
      // its uniform is `water.position.y`, so storing groundHeight() raw here
      // put the seabed a whole PAD_H above sea level, made every depth
      // negative, clamped it to zero — and left a shader that was all Fresnel
      // and no absorption, which reads exactly like water that is working.
      const bathy = new Float32Array(pos.count);

    // ═══ THE TSL WATER ═══════════════════════════════════════════════════
    //
    // The baked material below is good and has one thing it can never do:
    // FRESNEL. How much of the bottom you see through water depends on the
    // angle you are looking at it from — steeply, it is clear; at a graze, it
    // is a mirror — and that is a per-PIXEL, per-view quantity. Vertex colours

    // equally see-through from every angle, which is the single loudest "this
    // is not water" tell left in the frame.
    //
    // This is the same shading model Clearwater uses, written as a three node

    // hand-written shader would have to be maintained twice.
    //
    // It also lifts a cap. v14 held the tide to 28 cm because the baked
    // colours are painted for the depth at MEAN sea level and drift out of
    // true as the water moves. Here depth is `seaLevel − bathy` evaluated per
    // pixel, so the shallows repaint themselves as the tide goes out and the
    // amplitude is free.
    const TSL = THREE.TSL;
    const uSea = TSL.uniform(0);
    const uNormOff = TSL.uniform(new THREE.Vector2());
    const uShallow = TSL.uniform(new THREE.Color());
    const uDeep = TSL.uniform(new THREE.Color());
    const uSunDir = TSL.uniform(new THREE.Vector3());
    const uSunCol = TSL.uniform(new THREE.Color());
    const uOpacity = TSL.uniform(1);
    // Built LAZILY, because `envCube` does not exist until the first mood
    // settles and a cubeTexture node needs a texture to hold. `envNodeRef`
    // is kept so rebuildEnv can hand it each new cube: the node captures a
    // texture object, and rebuildEnv deliberately makes a fresh one per mood
    // rather than updating in place, so without this the reflection would
    // freeze on whatever sky the island booted under.

      const m = new THREE.MeshBasicNodeMaterial({ transparent: true, depthWrite: false });
      const { vec2, vec3, float, texture, cubeTexture, positionWorld, cameraPosition,

      // the surface, from the same scrolling normal map the baked water uses
      const nt = texture(waterNormal, uv().mul(44).add(uNormOff)).xyz.mul(2).sub(1);
      const N = normalize(vec3(nt.x.mul(0.34), float(1), nt.y.mul(0.34)));

      const V = normalize(positionWorld.sub(cameraPosition));
      const NdotV = max(dot(N, V.negate()), float(0.02));

      // Schlick, with water's own F0. This is the whole point of the exercise.
      const fres = float(0.02).add(float(0.98).mul(pow(oneMinus(NdotV), 5)));

      // how much water the light actually came through: deeper, and longer at
      // a graze, which is why a shallow bay still goes opaque toward the horizon
      const depth = max(uSea.sub(attribute('bathy', 'float')), float(0));
      const path = depth.div(max(NdotV, float(0.22)));

      // Beer–Lambert rather than a lerp: absorption is exponential, and doing
      // it properly is what makes the shallows pale and the channel deepen
      // without either being painted in by hand.
      // 1.3 per metre, found by looking at three values through the same
      // view. At 0.85 the bay read as MUD — the seabed's wet band was painted
      // dark back when the baked water was hiding it, and too little
      // absorption just shows you that paint. At 2.4 the colour was right and
      // the bottom was GONE, which costs this cove the one thing its own code
      // comment claims for it: a bowl you can see the bottom of.
      const trans = exp(path.mul(-1.3));

      envNodeRef = cubeTexture(envCube, reflect(V, N));
      const refl = envNodeRef.xyz;
      // one sun glint, which is the other half of reading as a liquid
      const glint = pow(max(dot(reflect(V, N), uSunDir), float(0)), 220).mul(1.6);

      m.colorNode = mix(tint, refl, fres).add(uSunCol.mul(glint));

      // where the water simply is not

      waterTslMat = m;

    }

    // Which water is on. A COMPARISON, not a decision — the two are built to

    const water = new THREE.Mesh(waterGeo, waterMat);

    water.renderOrder = 1;
    scene.add(water);

    // each frame the ones near the water's CURRENT reach light up: as the
    // swell lifts the plane the reach climbs the sand and the foam climbs with

    // updated on the CPU — a few thousand numbers a frame, no shader.

    const foam = (() => {

      // is one the foam line walks straight off the end of at low water, and

      const n = Math.round(TIER.foam * 1.8), pts = [], hs = [];
      const lo = -TIDE_AMP - 0.09, hi = TIDE_AMP + 0.26;
      let guard = n * 80;

        const h = groundHeight(x, z);

      }

      g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pts), 3));
      const cols = new Float32Array(hs.length * 4);
      const cc = col(P.cream);
      for (let i = 0; i < hs.length; i++) { cols[i * 4] = cc.r; cols[i * 4 + 1] = cc.g; cols[i * 4 + 2] = cc.b; cols[i * 4 + 3] = 0; }
      g.setAttribute('color', new THREE.BufferAttribute(cols, 4));

    })();
    function foamUpdate(t) {
      // where the water's edge is, in terrain height: the swell riding ON the

      // instead of breathing in one place

      const hs = foam.userData.hs, cols = foam.geometry.attributes.color;

    }

    // ═══ THE NOOK — deck, chair, table, radio, book ═══

    const cWood = col(P.driftwood);
    // CHAIR CONVENTION, one place: `chairYaw` is the direction the SITTER
    // FACES as a direction-vector angle — facing = (sin, cos). That is what
    // chair-lab writes (seat → where you stood) and what the head-pose
    // calibration writes. The chair model is built with its backrest at local
    // +z, so the seat looks down local −z, and the nook therefore rotates by

      chairP[0] + lx * Math.cos(NOOK_YAW) + lz * Math.sin(NOOK_YAW),

      put(back, 0, seatY + 0.3, 0.33, chairPile);

      put(paint(box(0.5, 0.05, 0.46), cCush), 0, seatY + 0.025, -0.01, chairPile);
      const backCush = paint(box(0.48, 0.5, 0.05), cCush);
      backCush.rotateX(0.22);
      put(backCush, 0, seatY + 0.28, 0.28, chairPile);

      put(paint(box(0.07, 0.5, 0.07),
        (x, y) => _c.copy(cWood).multiplyScalar(0.75 + 0.28 * smooth(-0.25, 0.25, y))), 0.62, 0.31, -0.05);

    chairProp.receiveShadow = true;
    island.add(chairProp);

    const chairHit = new THREE.Mesh(box(0.9, 1.2, 0.9), new THREE.MeshBasicMaterial({ visible: false }));
    chairHit.position.set(chairP[0], chairP[1] + 0.2, chairP[2]);
    scene.add(chairHit);

    // ═══ THE BOOK ═══ Treasure Island, opening pages (Project Gutenberg —

    // in through troika-three-text: one page of large serif type is sharper
    // per byte this way, and it keeps the tree dependency-free. Closed on the
    // deck it is a shut book; point + trigger opens it in front of you, and
    // each press after that turns a page.
    const PAGES = [
      ['TREASURE ISLAND', '', 'Robert Louis Stevenson', '', '', 'PART ONE',

        'of these gentlemen having asked me to write',

        'Island, from the beginning to the end,',
        'keeping nothing back but the bearings of the',
        'island, and that only because there is still',

        'as he came plodding to the inn door, his',
        'sea-chest following behind him in a hand-',
        'barrow — a tall, strong, heavy, nut-brown',
        'man, his tarry pigtail falling over the',
        'shoulder of his soiled blue coat, his hands',
        'ragged and scarred, with black, broken nails,',
        'and the sabre cut across one cheek, a dirty,',
        'livid white.'],
      ['', 'I remember him looking round the cove and',
        'whistling to himself as he did so, and then',
        'breaking out in that old sea-song that he',
        'sang so often afterwards:', '',
        '   "Fifteen men on the dead man’s chest —',
        '    Yo-ho-ho, and a bottle of rum!"', '',
        'in the high, old tottering voice that seemed',
        'to have been tuned and broken at the capstan',

    function pageTexture(lines, right) {

      g.fillStyle = '#efe6d0'; g.fillRect(0, 0, 512, 640);

      const grad = g.createLinearGradient(right ? 0 : 512, 0, right ? 512 : 0, 0);
      grad.addColorStop(0, 'rgba(120,96,60,0.22)');
      grad.addColorStop(0.35, 'rgba(120,96,60,0.02)');
      grad.addColorStop(1, 'rgba(120,96,60,0.10)');
      g.fillStyle = grad; g.fillRect(0, 0, 512, 640);
      for (let i = 0; i < 260; i++) {

        g.fillStyle = `rgba(140,110,70,${0.03 + hash(i, 17) * 0.06})`;
