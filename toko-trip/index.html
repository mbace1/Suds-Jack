      // magenta, and the thing you see from the chair that says go there
      const mx = caveSpot.x + Math.sin(caveMouth) * (CAVE_RING - 0.2);
      const mz = caveSpot.z + Math.cos(caveMouth) * (CAVE_RING - 0.2);
      const arch = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.055, 6, 20, Math.PI), neonMat);
      arch.position.set(mx, gy(caveSpot.x, caveSpot.z) + 0.95, mz);
      // its ring faces ALONG the mouth, toward the bar and the chair — set
      // side-on it is a single magenta line from every angle that matters
      arch.rotation.y = caveMouth;
      scene.add(arch);
      neonLight.position.set(mx, gy(caveSpot.x, caveSpot.z) + 1.4, mz);
      scene.add(neonLight);
      // the pool, in the middle of the floor
      pool.rotation.x = -Math.PI / 2;
      pool.position.set(caveSpot.x, gy(caveSpot.x, caveSpot.z) + 0.025, caveSpot.z);
      scene.add(pool);
      poolLight.position.set(caveSpot.x, gy(caveSpot.x, caveSpot.z) + 0.5, caveSpot.z);
      scene.add(poolLight);
      // the shell, at the pool's edge on the mouth side, so it is the first
      // thing you pass coming in and the last thing you see going out
      const cone = new THREE.Mesh(paint(new THREE.ConeGeometry(0.08, 0.24, 7), col(P.cream)), satin);
      cone.rotation.z = Math.PI / 2;
      const lip = new THREE.Mesh(paint(new THREE.TorusGeometry(0.07, 0.025, 5, 10), col('#f0c9b6')), satin);
      lip.position.x = -0.12; lip.rotation.y = Math.PI / 2;
      shell.add(cone, lip);
      const sx = caveSpot.x + Math.sin(caveMouth) * 0.95, sz = caveSpot.z + Math.cos(caveMouth) * 0.95;
      shell.position.set(sx, gy(sx, sz) + 0.07, sz);
      shell.rotation.y = caveMouth + 0.7;
      shell.traverse(o => { if (o.isMesh) o.castShadow = true; });
      scene.add(shell);
    }

    // the static merge — everything above that neither moves nor answers a ray
    const statics = new THREE.Mesh(mergeFor(pile), satin);
    statics.castShadow = true;
    statics.receiveShadow = true;
    island.add(statics);

    // ═══ COLLISION ═══ the island's real geometry, not its height field ════
    //
    // `groundHeight(x, z)` is a pure function and stays the source of truth
    // for the SHAPE of the island — the mesh, the scatter, the sand maps and
    // the surf emitters all still ask it. What it cannot do is hold a bridge:
    // a height field has one answer per column, and the jetty deck and the
    // water under it are the same column. So the thing you WALK on is the
    // geometry, queried by ray, and a ray against 40k triangles of terrain
    // every frame is affordable with a bounds tree and nothing like
    // affordable without one. That is what three-mesh-bvh is here for.
    THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
    THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
    // A mesh with no boundsTree falls through to three's own raycast, so this
    // is safe for every other ray in the file — the teleport ray, the slate's
    // UV pick — and they get the acceleration free wherever a tree exists.
    THREE.Mesh.prototype.raycast = acceleratedRaycast;

    const solids = [];
    function makeSolid(mesh) {
      if (!mesh?.geometry) return;
      mesh.geometry.computeBoundsTree();
      solids.push(mesh);
    }

    // The sea's surface in WORLD space, and it MOVES. The island drops by
    // PAD_H so the pad under the chair sits on the real floor, which puts mean
    // sea level there; the tide is measured from that. Every clamp reads this
    // rather than a constant, which is what makes low water somewhere you can
    // walk out to and high water somewhere you cannot.
    const seaY = () => -PAD_H + tide - 0.02;
    const STEP_UP = 0.4;          // the lip of the jetty deck, and no more
    const BODY_R = 0.28;          // how wide you are, for bumping into things
    const CHEST = 1.0;            // where a wall is felt, above the deck lip

    const _cray = new THREE.Raycaster();
    _cray.firstHitOnly = true;    // the bounds tree's whole trick
    const _cdown = new THREE.Vector3(0, -1, 0);
    const _corig = new THREE.Vector3(), _cdir = new THREE.Vector3();

    // What you would be standing on at (x, z), in world y — or null if the
    // answer is "the sea". Starts the ray a step ABOVE your feet, so you can
    // step up onto the deck but not up a wall.
    function standY(x, z, feetY = 0) {
      _corig.set(x, feetY + STEP_UP, z);
      _cray.set(_corig, _cdown);
      _cray.far = STEP_UP + 4;
      const hit = _cray.intersectObjects(solids, false)[0];
      // a face you can stand on is one facing up; the side of the totem is
      // geometry too, and standing on it is not walking
      if (hit && (!hit.face || hit.face.normal.y > 0.5)) {
        return hit.point.y > seaY() ? hit.point.y : null;
      }
      const g = gy(x, z);
      return g > seaY() ? g : null;
    }

    // Is something solid in the way between here and there? Only walls count
    // — a floor is not an obstacle, which is what lets you walk up the beach.
    function wallBetween(fx, fz, tx, tz, feetY) {
      _cdir.set(tx - fx, 0, tz - fz);
      const d = _cdir.length();
      if (d < 1e-6) return false;
      _cdir.divideScalar(d);
      _corig.set(fx, feetY + CHEST, fz);
      _cray.set(_corig, _cdir);
      _cray.far = d + BODY_R;
      const hit = _cray.intersectObjects(solids, false)[0];
      return !!hit && (!hit.face || Math.abs(hit.face.normal.y) < 0.6);
    }

    // One move, for every path that moves you. Returns where you end up,
    // sliding along a wall rather than sticking to it — refusing the whole
    // step makes a doorway feel like glue, and this island is all doorways
    // between a chair, a table and a palm.
    // How far out you may go at all. It was the island's own radius, which
    // left the islet unreachable by a rule nobody would ever see; it is the
    // edge of the terrain mesh now, and the SEA decides the rest — beyond
    // the coast there is nothing dry to stand on except the rock and the bar.
    const WALK_R = 27.5;
    // The bar is the gate, so nothing may jump it. Teleport would: point at
    // the islet from the beach at high water and you are there, and the tide
    // is scenery again. A jump that crosses between the island and the islet
    // is only allowed while the bar is dry end to end — which is exactly when
    // you could have walked it.
    const onIslet = (x, z) => Math.hypot(x - ISLET.x, z - ISLET.z) < ISLET.outer - 1.5
      || (x * ISLET.ux + z * ISLET.uz) > ISLET.barTo - 0.5;
    function barOpen() {
      for (let i = 0; i <= 12; i++) {
        const a = lerp(ISLET.barFrom + 0.5, ISLET.barTo, i / 12);
        const x = ISLET.ux * a, z = ISLET.uz * a;
        if (standY(x, z, gy(x, z) + 0.3) === null) return false;
      }
      return true;
    }
    const canCross = (fx, fz, tx, tz) => onIslet(fx, fz) === onIslet(tx, tz) || barOpen();
    const _cout = { x: 0, z: 0, y: 0, moved: false };
    function tryMove(fx, fz, tx, tz, feetY) {
      const edge = (x, z) => Math.hypot(x, z) < WALK_R;
      const ok = (x, z) => edge(x, z) && standY(x, z, feetY) !== null
        && !wallBetween(fx, fz, x, z, feetY);
      let nx = fx, nz = fz;
      if (ok(tx, tz)) { nx = tx; nz = tz; }
      else if (ok(tx, fz)) { nx = tx; }        // slide along z
      else if (ok(fx, tz)) { nz = tz; }        // slide along x
      _cout.x = nx; _cout.z = nz;
      _cout.y = standY(nx, nz, feetY) ?? gy(nx, nz);
      _cout.moved = nx !== fx || nz !== fz;
      return _cout;
    }

    // ═══ INSTANCED — grass on the high dry ground, pebbles in the wet band:
    // two draw calls, so density is ~free ═══
    function bladeGeo() {
      const gs = [];
      const cBase = col('#4e7a44'), cTip = col('#8cbf6e');
      for (let k = 0; k < 3; k++) {
        const b = new THREE.PlaneGeometry(0.07, 0.32, 1, 2);
        const bp = b.attributes.position;
        for (let i = 0; i < bp.count; i++) {
          const t = (bp.getY(i) + 0.16) / 0.32;
          bp.setX(i, bp.getX(i) * (1 - t * 0.8));
          bp.setZ(i, t * t * 0.06);
        }
        paint(b, (x, y) => _c.copy(cBase).lerp(cTip, (y + 0.16) / 0.32));
        b.translate(0, 0.16, 0);
        b.rotateY(k / 3 * Math.PI * 2);
        gs.push(b.toNonIndexed());
      }
      return BGU.mergeGeometries(gs);
    }
    const GRASS_N = Math.round(420 * TIER.density), PEBBLE_N = Math.round(260 * TIER.density);
    const grass = new THREE.InstancedMesh(bladeGeo(),
      foliage, GRASS_N);
    {
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0),
        s = new THREE.Vector3(), p = new THREE.Vector3();
      let placed = 0, guard = 120000;
      while (placed < GRASS_N && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 2, z = (rng() - 0.5) * ISLAND_R * 2;
        const h = groundHeight(x, z);
        // nothing grows on the beach — the sand is the point of the cove
        if (h < 1.05 || Math.hypot(x, z) < 2.3 || beachness(x, z) > 0.1) continue;
        const k = 0.7 + rng() * 0.8;
        q.setFromAxisAngle(up, rng() * Math.PI * 2);
        m.compose(p.set(x, h - 0.01, z), q, s.set(k, k * (0.8 + rng() * 0.5), k));
        grass.setMatrixAt(placed, m);
        grass.setColorAt(placed, _c.setScalar(0.8 + rng() * 0.35));
        placed++;
      }
      grass.count = placed;
    }
    island.add(grass);

    const pebbles = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 0),
      new THREE.MeshStandardMaterial({ roughness: 0.95 }), PEBBLE_N);
    pebbles.receiveShadow = true;
    {
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(),
        p = new THREE.Vector3(), e = new THREE.Euler(), cA = col('#8f867c'), cB = col('#b8a992');
      let placed = 0, guard = 120000;
      while (placed < PEBBLE_N && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 2.4, z = (rng() - 0.5) * ISLAND_R * 2.4;
        const h = groundHeight(x, z);
        if (h < -0.05 || h > 0.35) continue;
        q.setFromEuler(e.set(rng() * 3, rng() * 3, rng() * 3));
        const k = 0.5 + rng() * 1.3;
        m.compose(p.set(x, h + 0.015, z), q, s.set(k, k * 0.55, k));
        pebbles.setMatrixAt(placed, m);
        pebbles.setColorAt(placed, _c.copy(cA).lerp(cB, rng()));
        placed++;
      }
      pebbles.count = placed;
    }
    island.add(pebbles);

    // Reeds. The brief put these along the inlet banks; the owner's call is a
    // clean sandy cove, so they moved inland to the crown's edge, where they
    // read as dune growth rather than as something standing in the beach.
    // Keeping them at all is worth it for the sway — the palms and the foam
    // were otherwise the only things moving on land.
    const reedClumps = [];
    {
      const cStem = col('#7c9b5a'), cHead = col('#6b4a34');
      let placed = 0, guard = 4000;
      while (placed < 7 && guard-- > 0) {
        const a = rng() * Math.PI * 2, rr = 5.5 + rng() * 3.5;
        const cx = Math.cos(a) * rr, cz = Math.sin(a) * rr;
        const ch = groundHeight(cx, cz);
        if (ch < 1.15 || beachness(cx, cz) > 0.08) continue;
        placed++;
        const gs = [];
        for (let i = 0; i < 7; i++) {
          const ox = (rng() - 0.5) * 0.5, oz = (rng() - 0.5) * 0.5, hh = 0.7 + rng() * 0.45;
          const stem = paint(new THREE.CylinderGeometry(0.012, 0.02, hh, 5),
            (x, y) => _c.copy(cStem).multiplyScalar(0.7 + 0.4 * smooth(-hh / 2, hh / 2, y)));
          stem.translate(ox, hh / 2, oz);
          gs.push(stem.toNonIndexed());
          const head = paint(new THREE.CylinderGeometry(0.028, 0.032, 0.16, 5), cHead);
          head.translate(ox, hh + 0.08, oz);
          gs.push(head.toNonIndexed());
        }
        const clump = new THREE.Group();
        clump.add(new THREE.Mesh(BGU.mergeGeometries(gs), foliage));
        clump.position.set(cx, gy(cx, cz) - 0.02, cz);
        clump.userData.phase = rng() * Math.PI * 2;
        scene.add(clump);
        reedClumps.push(clump);
      }
    }

    // fireflies — dusk only
    const fireflies = (() => {
      const n = 70, base = new Float32Array(n * 3), ph = new Float32Array(n);
      let placed = 0, guard = 9000;
      while (placed < n && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 1.4, z = (rng() - 0.5) * ISLAND_R * 1.4;
        if (groundHeight(x, z) < 0.6) continue;
        base[placed * 3] = x; base[placed * 3 + 1] = gy(x, z) + 0.4 + rng() * 1.2; base[placed * 3 + 2] = z;
        ph[placed] = rng() * Math.PI * 2;
        placed++;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
      const o = new THREE.Points(g, new THREE.PointsMaterial({
        color: col('#ffe9a0'), size: 0.05, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      o.userData = { base, ph, n: placed };
      scene.add(o);
      return o;
    })();

    // ═══ MOODS ═══ one config each — adding a mood stays a five-line job.
    const MOODS = [
      { name: 'GOLDEN HOUR', skyTop: '#6f8fb8', skyHoriz: '#e8a05c', sunCol: '#ffd9a0', sunInt: 2.6,
        sunDir: [0.34, 0.16, 0.93], hemiSky: '#ffd7b0', hemiGround: '#b99c72', hemiInt: 0.55,
        fog: '#e8c49a', fogNear: 20, fogFar: 130, water: '#3aa8a0', waterOp: 0.82,
        cloud: '#ffd2a4', lantern: 0.35, fireflies: 0, neon: 0.55 },
      { name: 'DUSK & FIREFLIES', skyTop: '#141f3a', skyHoriz: '#b06a8c', sunCol: '#ff9a6a', sunInt: 1.0,
        sunDir: [0.3, 0.055, 0.95], hemiSky: '#5a6a9a', hemiGround: '#3a3a4a', hemiInt: 0.46,
        fog: '#3a3a56', fogNear: 14, fogFar: 95, water: '#2b6a74', waterOp: 0.88,
        cloud: '#6b5878', lantern: 1.7, fireflies: 0.85, neon: 1.4 },
      { name: 'BRIGHT MIDDAY', skyTop: '#57a0d8', skyHoriz: '#bfe0ea', sunCol: '#fff6e0', sunInt: 3.1,
        sunDir: [0.25, 0.8, 0.4], hemiSky: '#cfe6ee', hemiGround: '#d8c893', hemiInt: 0.8,
        fog: '#cfe6ee', fogNear: 30, fogFar: 140, water: '#46b8b0', waterOp: 0.78,
        cloud: '#ffffff', lantern: 0, fireflies: 0, neon: 0.3 },
    ];
    const MOOD_NUM = ['sunInt', 'hemiInt', 'fogNear', 'fogFar', 'waterOp', 'lantern', 'fireflies', 'neon'];
    const MOOD_COL = ['skyTop', 'skyHoriz', 'sunCol', 'hemiSky', 'hemiGround', 'fog', 'water', 'cloud'];
    const mkMoodState = () => {
      const o = { sunDir: new THREE.Vector3() };
      for (const k of MOOD_COL) o[k] = new THREE.Color();
      return o;
    };
    const cur = mkMoodState(), from = mkMoodState(), target = mkMoodState();
    const snapshot = (m, into) => {
      for (const k of MOOD_NUM) into[k] = m[k];
      for (const k of MOOD_COL) into[k].copy(typeof m[k] === 'string' ? col(m[k]) : m[k]);
      Array.isArray(m.sunDir) ? into.sunDir.fromArray(m.sunDir).normalize() : into.sunDir.copy(m.sunDir);
    };
    let moodIdx = 0, blend = 1;

    // ═══ THE DAY ═══════════════════════════════════════════════════════════
    // v14 gave the island one clock and hung only the water on it; the sky
    // was still three buttons, so time passed in the sea and nowhere else.
    // This hangs the sky on it too.
    //
    // A day is TWO tides, which is what a real semidiurnal sea does, and the
    // phase is set so that sitting still from boot plays one composition: the
    // island opens at golden hour on high water, the sun goes down while the
    // water goes out, and dusk — fireflies, lanterns, the magenta arch lit —
    // arrives at LOW water. That is on purpose. It is where the cave will be.
    const DAY = TIDE_PERIOD * 2;
    // The three tuned moods are HOLDS on this timeline and the day blends
    // between them, so at every hold the look is exactly the mood that was
    // tuned by eye — the day is new, the three pictures are not. MOODS is
    // [golden hour, dusk, midday].
    const DAY_KEYS = [
      [0.00, 2], [0.12, 2],       // midday
      [0.23, 0], [0.37, 0],       // golden hour — the hero, so the longest light
      [0.47, 1], [0.63, 1],       // dusk: this island's night
      [0.72, 0], [0.80, 0],       // dawn
      [0.91, 2], [1.00, 2],
    ];
    // Dawn is golden hour again, on the SAME side: the sun rises where it
    // set. A stylised day, and deliberately so — the island is built facing
    // one horizon, and a sunrise behind the chair would spend the second
    // golden hour of every day on the back of your head.
    const HOLDS = { 0: [0.30, 0.76], 1: [0.55], 2: [0.06] };
    const MOOD_STATES = MOODS.map(m => { const o = mkMoodState(); snapshot(m, o); return o; });
    let dayT = HOLDS[0][0] * DAY;
    let dayHold = -1, dayEnvT = 0, dayShadowT = 0;
    const dayPhase = () => ((dayT / DAY) % 1 + 1) % 1;
    function daySegment(ph) {
      for (let i = 0; i < DAY_KEYS.length - 1; i++) {
        const [p0, m0] = DAY_KEYS[i], [p1, m1] = DAY_KEYS[i + 1];
        if (ph >= p0 && ph <= p1) return { m0, m1, u: p1 > p0 ? (ph - p0) / (p1 - p0) : 0 };
      }
      return { m0: 2, m1: 2, u: 0 };
    }
    function announceMood(i) {
      const tag = document.getElementById('mood-name');
      tag.textContent = MOODS[i].name;
      tag.style.opacity = 0.8;
      clearTimeout(setMood._t);
      setMood._t = setTimeout(() => { tag.style.opacity = 0; }, 2200);
    }
    // Skip FORWARD to the next time mood `i` holds — never back. Pressing the
    // totem is time passing faster, not a menu, and a day that could run
    // backwards would be a slider. Already inside that hold: stay.
    function jumpDayTo(i) {
      const seg = daySegment(dayPhase());
      if (seg.m0 === i && seg.m1 === i) return;
      const ph = dayPhase();
      let best = 1e9;
      for (const h of HOLDS[i]) best = Math.min(best, ((h - ph) % 1 + 1) % 1);
      dayT += best * DAY;
    }
    function daySky(dt) {
      const { m0, m1, u } = daySegment(dayPhase());
      if (m0 === m1) {
        // a hold: nothing moves, so nothing is recomputed — once on arrival,
        // with the reflection rebuilt and the shadows settled, then never
        if (dayHold === m0) return;
        dayHold = m0;
        const S = MOOD_STATES[m0];
        for (const key of MOOD_NUM) cur[key] = S[key];
        for (const key of MOOD_COL) cur[key].copy(S[key]);
        cur.sunDir.copy(S.sunDir);
        if (moodIdx !== m0) { moodIdx = m0; applyAir(); }
        announceMood(m0);
        pushMood(true);
        shadowDirty();
        return;
      }
      dayHold = -1;
      const k = u * u * (3 - 2 * u);
      const A = MOOD_STATES[m0], B = MOOD_STATES[m1];
      for (const key of MOOD_NUM) cur[key] = lerp(A[key], B[key], k);
      for (const key of MOOD_COL) cur[key].copy(A[key]).lerp(B[key], k);
      cur.sunDir.copy(A.sunDir).lerp(B.sunDir, k).normalize();
      const near = k < 0.5 ? m0 : m1;
      if (moodIdx !== near) { moodIdx = near; applyAir(); }
      pushMood(false);
      // The two costs a moving sun has, throttled rather than per frame: a
      // shadow map re-render once a second (the sun moves about half a
      // degree in that time) and a fresh reflection cube every two. Static
      // shadows stay static through every hold, which is most of the day.
      dayShadowT += dt; dayEnvT += dt;
      if (dayShadowT > 1) { dayShadowT = 0; shadowDirty(); }
      if (dayEnvT > 2) { dayEnvT = 0; rebuildEnv(); }
    }
    function setMood(i, instant = false) {
      moodIdx = ((i % MOODS.length) + MOODS.length) % MOODS.length;
      jumpDayTo(moodIdx);
      dayHold = -1;
      snapshot(MOODS[moodIdx], target);
      if (instant) { snapshot(MOODS[moodIdx], cur); blend = 1; }
      else { snapshot(cur, from); blend = 0; }
      const tag = document.getElementById('mood-name');
      tag.textContent = MOODS[moodIdx].name;
      tag.style.opacity = 0.8;
      clearTimeout(setMood._t);
      setMood._t = setTimeout(() => { tag.style.opacity = 0; }, 2200);
      applyMood(true);
      shadowDirty();
      audioStart();
      applyAir(instant);
    }
    function applyMood(force = false) {
      if (blend >= 1 && !force) return;
      if (blend < 1) {
        const k = blend * blend * (3 - 2 * blend);
        for (const key of MOOD_NUM) cur[key] = lerp(from[key], target[key], k);
        for (const key of MOOD_COL) cur[key].copy(from[key]).lerp(target[key], k);
        cur.sunDir.copy(from.sunDir).lerp(target.sunDir, k).normalize();
      }
      pushMood(force);
    }
    // Everything that paints the world from `cur`. Split out of applyMood so
    // the day can write `cur` itself and reuse all of it — one place that
    // knows what a mood touches, however the mood arrived.
    function pushMood(rebuild) {
      paintSky(cur.skyTop, cur.skyHoriz, cur.water);
      if (rebuild) rebuildEnv();
      sun.color.copy(cur.sunCol); sun.intensity = cur.sunInt;
      sun.position.copy(cur.sunDir).multiplyScalar(60);
      hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity = cur.hemiInt;
      scene.fog.color.copy(cur.fog); scene.fog.near = cur.fogNear; scene.fog.far = cur.fogFar;
      // vertex alpha carries the shore fade; the mood only scales it, so the
      // shallows stay see-through whatever the hour
      waterMat.color.copy(cur.water); waterMat.opacity = cur.waterOp;
      sea.material.color.copy(cur.water);
      for (const l of lanternLights) { l.intensity = cur.lantern * 1.6; l.visible = cur.lantern > 0.02; }
      lanternGlassMat.emissiveIntensity = cur.lantern * 1.4;
      fireflies.material.opacity = cur.fireflies;
      for (const m of cloudMats) m.color.copy(cur.cloud);
      // the far islands sit IN the haze rather than in front of it
      for (const m of farIsles) m.color.copy(cur.fog).multiplyScalar(0.72);
      sunDisc.material.color.copy(cur.sunCol);
      sunHalo.material.color.copy(cur.skyHoriz);
      sunDisc.position.copy(cur.sunDir).multiplyScalar(150);
      sunDisc.lookAt(0, 0, 0);
      sunHalo.position.copy(cur.sunDir).multiplyScalar(152);
      sunHalo.lookAt(0, 0, 0);
    }

    // ═══ AUDIO — the sound of the place; the radio is its own machine ═══
    //
    // Everything here is procedural and, apart from the two chime notes,
    // everything is POSITIONAL: the surf comes from the waterline, the wind
    // comes from the crowns you can watch moving, and a gull is somewhere out
    // over the cove rather than inside your head. That is the whole
    // difference between a soundtrack and a place — and in a headset it is
    // worth more than any of the geometry it is playing over.
    //
    // Nothing connects to ctx.destination. Every voice, the radio included,
    // goes through the listener, so ONE setting silences all of it and any
    // sound added later inherits that for free.
    let AC = null, noiseBuf = null, chimeBus = null, gullBus = null, gullHost = null;
    const SURF_HZ = 0.065;
    const surfVoices = [];        // the wash, breathed by the visible tide
    const windVoices = [];        // one per swaying crown
    let nextGull = 0, swell = 0, tideEdgeT = 0, dripBus = null, nextDrip = 0;
    // the mix the mood asks for, eased rather than switched
    const AIR = [
      { wash: 1.0, wind: 1.0, cut: 430, gull: [26, 70] },   // golden hour
      { wash: 0.8, wind: 0.7, cut: 300, gull: [70, 150] },  // dusk
      { wash: 1.1, wind: 1.3, cut: 560, gull: [16, 44] },   // midday
    ];
    let mixSurf = 1, mixWind = 1, wantSurf = 1, wantWind = 1, wantCut = 430;

    // Where the water meets the land, along a ray from the island's middle.
    // It asks groundHeight like everything else does, so the emitters follow
    // the cove if the cove is ever reshaped again.
    function waterEdge(ang, level = 0) {
      const sx = Math.sin(ang), sz = Math.cos(ang);
      let lo = 0.5, hi = ISLAND_R * 1.7;
      for (let i = 0; i < 24; i++) {
        const m = (lo + hi) / 2;
        if (groundHeight(sx * m, sz * m) > level) lo = m; else hi = m;
      }
      const r = (lo + hi) / 2;
      return [sx * r, sz * r];
    }

    function audioStart() {
      if (AC) return;
      AC = listener.context;
      if (AC.state === 'suspended') AC.resume().catch(() => {});
      const out = listener.getInput();
      // one brown-noise loop, shared by every wash and every gust
      const len = AC.sampleRate * 6;
      noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < len; i++) { b += (Math.random() * 2 - 1) * 0.02; b *= 0.995; d[i] = b * 3.5; }

      // ── the surf, from the waterline ──
      // Six emitters spaced round the island, each sitting exactly where the
      // ground crosses sea level, so walking down the beach walks INTO the
      // sound and the nook is the quiet end of it. Each starts at a different
      // offset in the same loop: six copies in phase is mono with extra steps.
      for (let i = 0; i < 6; i++) {
        const [wx, wz] = waterEdge((i / 6) * Math.PI * 2 + 0.3, tide);
        const host = new THREE.Object3D();
        host.position.set(wx, -PAD_H + tide, wz);
        scene.add(host);
        const pa = new THREE.PositionalAudio(listener);
        pa.setRefDistance(4.5);
        pa.setRolloffFactor(1.05);
        pa.setDistanceModel('inverse');
        host.add(pa);
        const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 430;
        const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
        const g = AC.createGain(); g.gain.value = 0.5;
        src.connect(lp); lp.connect(hp); hp.connect(g);
        pa.setNodeSource(g);
        src.start(0, (i * 1.37) % 6);
        surfVoices.push({ gain: g, lp, host, base: 0.5 });
      }

      // ── the wind, from the crowns that are visibly moving ──
      // The gust follows the SAME sway term the crown is drawn with, so the
      // tree you hear is the tree you can see doing it.
      for (const c of crowns.slice(0, 3)) {
        const pa = new THREE.PositionalAudio(listener);
        pa.setRefDistance(3.2);
        pa.setRolloffFactor(1.4);
        c.add(pa);
        const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 1500; bp.Q.value = 0.7;
        const g = AC.createGain(); g.gain.value = 0;
        src.connect(bp); bp.connect(g);
        pa.setNodeSource(g);
        src.start(0, Math.random() * 6);
        windVoices.push({ gain: g, phase: c.userData.phase });
      }

      // ── a drip in the cave, which you only hear when you are in it ──
      dripBus = AC.createGain(); dripBus.gain.value = 1;
      const da = new THREE.PositionalAudio(listener);
      da.setRefDistance(0.9); da.setRolloffFactor(2.4);
      pool.add(da);
      da.setNodeSource(dripBus);
      nextDrip = 2;

      // ── a gull, now and then, out over the water ──
      gullHost = new THREE.Object3D();
      scene.add(gullHost);
      gullBus = AC.createGain(); gullBus.gain.value = 1;
      const ga = new THREE.PositionalAudio(listener);
      ga.setRefDistance(9); ga.setRolloffFactor(0.8);
      gullHost.add(ga);
      ga.setNodeSource(gullBus);
      nextGull = 10 + Math.random() * 16;

      // the two chime notes are the one thing that is NOT positional: they
      // are the island acknowledging you, not something happening near you
      chimeBus = AC.createGain(); chimeBus.gain.value = 1;
      chimeBus.connect(out);

      applyAir(true);
      applySound();
    }

    // one wave, louder than the rest — the island noticing you
    function surfSwell() { swell = 1; }

    const gullEvery = () => {
      const [a, b2] = AIR[moodIdx].gull;
      return a + Math.random() * (b2 - a);
    };
    function gullCry() {
      if (!AC || !gullBus) return;
      // out over the cove, never behind you in the grass
      const ang = Math.atan2(INLET_B.x, INLET_B.z) + (Math.random() - 0.5) * 1.7;
      const r = 14 + Math.random() * 12;
      gullHost.position.set(Math.sin(ang) * r, 4 + Math.random() * 9, Math.cos(ang) * r);
      const t0 = AC.currentTime;
      const cries = 2 + (Math.random() * 2 | 0);
      for (let i = 0; i < cries; i++) {
        const at = t0 + i * (0.26 + Math.random() * 0.14);
        const o = AC.createOscillator(); o.type = 'sawtooth';
        const f0 = 900 + Math.random() * 260;
        o.frequency.setValueAtTime(f0, at);
        o.frequency.exponentialRampToValueAtTime(f0 * 0.55, at + 0.22);
        const bp = AC.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = 1400; bp.Q.value = 4;
        const g = AC.createGain();
        g.gain.setValueAtTime(0, at);
        g.gain.linearRampToValueAtTime(0.15, at + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);
        o.connect(bp); bp.connect(g); g.connect(gullBus);
        o.start(at); o.stop(at + 0.34);
      }
    }

    // the mood mixes the air: dusk goes quiet and dark and the gulls go home,
    // midday brightens the wash and puts them back up
    function applyAir(instant = false) {
      const a = AIR[moodIdx] || AIR[0];
      wantSurf = a.wash; wantWind = a.wind; wantCut = a.cut;
      if (instant) { mixSurf = wantSurf; mixWind = wantWind; }
      if (!AC) return;
      for (const v of surfVoices) {
        v.lp.frequency.setTargetAtTime(wantCut, AC.currentTime, instant ? 0.01 : 0.8);
      }
    }
    // ONE switch for all of it, the radio included — that is the whole reason
    // nothing is allowed to reach ctx.destination on its own. The value is
    // set outright rather than ramped: three's setMasterVolume ramps with
    // setTargetAtTime, and on a SUSPENDED context currentTime never advances,
    // so the ramp never arrives and "off" is a promise instead of a mute.
    // A click on a deliberate mute is the cheaper of the two.
    function applySound() {
      const g = listener.getInput().gain;
      g.cancelScheduledValues(0);
      g.value = comfort.sound ? 1 : 0;
    }

    // Where the six surf emitters sit, re-bisected onto the CURRENT waterline.
    // A named function rather than a body inside a timer, because the gate has
    // to be able to ask for it: a sandbox with no GPU renders this at two or
    // three frames a second, so a two-second timer is twenty seconds of wall
    // clock and a test that waits for it is a test that measures the harness.
    function retuneSurf() {
      for (let i = 0; i < surfVoices.length; i++) {
        const [wx, wz] = waterEdge((i / surfVoices.length) * Math.PI * 2 + 0.3, tide);
        surfVoices[i].host.position.set(wx, -PAD_H + tide, wz);
      }
    }

    function soundUpdate(dt, t) {
      if (!AC) return;
      mixSurf += (wantSurf - mixSurf) * Math.min(1, dt * 0.8);
      mixWind += (wantWind - mixWind) * Math.min(1, dt * 0.8);
      swell = Math.max(0, swell - dt * 0.45);
      // The wash breathes with the SWELL you can see — the same surfLevel that
      // rides on top of the tide and lifts the water plane. Named `breath`
      // and not `tide`: it was called `tide` before there was a tide, and
      // when one arrived this local silently shadowed it, so the surf
      // emitters were re-bisected against a 0..1 swell figure rather than
      // against sea level. Nothing threw; the sound just stopped following
      // the water.
      const breath = (surfLevel(t) + 0.057) / 0.114;
      const wash = (0.5 + 0.7 * breath) * mixSurf * (1 + swell * 0.7);
      for (const v of surfVoices) v.gain.gain.value = v.base * wash;
      for (const v of windVoices) {
        const sway = 0.5 + 0.5 * Math.sin(t * 0.6 + v.phase);
        v.gain.gain.value = (0.018 + 0.05 * sway) * mixWind;
      }
      // The surf is emitted FROM the waterline, so when the waterline walks
      // up the beach the sound walks with it — from the chair the sea gets
      // nearer at high water and further at low. Re-bisected every couple of
      // seconds rather than every frame: six bisections is 144 calls to
      // groundHeight, and the tide moves about a millimetre a second.
      tideEdgeT -= dt;
      if (tideEdgeT <= 0) { tideEdgeT = 2; retuneSurf(); }
      nextGull -= dt;
      if (nextGull <= 0) { gullCry(); nextGull = gullEvery(); }
      nextDrip -= dt;
      if (nextDrip <= 0 && dripBus) {
        nextDrip = 2.5 + Math.random() * 4;
        const t0 = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(1500 + Math.random() * 300, t0);
        o.frequency.exponentialRampToValueAtTime(700, t0 + 0.07);
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.12, t0 + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
        o.connect(g); g.connect(dripBus);
        o.start(t0); o.stop(t0 + 0.3);
      }
    }

    // two soft notes, for moments that deserve a sound and no text
    function chime(f1 = 523.25, f2 = 659.25) {
      audioStart();
      if (!AC) return;
      const t0 = AC.currentTime;
      for (const [f, at] of [[f1, 0], [f2, 0.22]]) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + at);
        g.gain.linearRampToValueAtTime(0.08, t0 + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 1.4);
        o.connect(g); g.connect(chimeBus ?? listener.getInput());
        o.start(t0 + at); o.stop(t0 + at + 1.5);
      }
    }

    // ── the radio ────────────────────────────────────────────────────────
    // Press it and it works, whatever is or is not in audio/: a real record
    // if one is there, its own synth bed if not. Everything is PositionalAudio
    // on the radio mesh, so it fades as you walk down to the water.
    const PLAYLIST = [
      ...TRACKS,
      ...(RADIO_TRACK_URL ? [{ file: RADIO_TRACK_URL, title: '', artist: '', year: '', source: '', note: '' }] : []),
    ];
    let radioOn = false, radioNodes = null, radioAudio = null, trackIdx = -1;
    const buffers = new Map();       // file → AudioBuffer, or null once it has failed

    function radioStopAll() {
      if (radioAudio) { try { radioAudio.stop(); } catch (e) {} radio.remove(radioAudio); radioAudio = null; }
      if (radioNodes) {
        radioNodes.stops.forEach(o => { try { o.stop(); } catch (e) {} });
        radio.remove(radioNodes.pa);
        radioNodes = null;
      }
      showPlaque(null);
    }

    // the synth bed: a soft add9 chord under a slow tremolo, warm-filtered
    function playBed() {
      const pa = new THREE.PositionalAudio(listener);
      pa.setRefDistance(1.1);
      radio.add(pa);
      const mix = AC.createGain(); mix.gain.value = 0.16;
      const stops = [];
      for (const [f2, g2] of [[110, 0.5], [138.6, 0.32], [164.8, 0.4], [246.9, 0.14]]) {
        const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f2;
        o.detune.value = (Math.random() - 0.5) * 8;
        const og = AC.createGain(); og.gain.value = g2;
        o.connect(og); og.connect(mix); o.start();
        stops.push(o);
      }
      const trem = AC.createOscillator(); trem.frequency.value = 0.9;
      const tg = AC.createGain(); tg.gain.value = 0.05;
      trem.connect(tg); tg.connect(mix.gain); trem.start();
      stops.push(trem);
      const lp = AC.createBiquadFilter(); lp.frequency.value = 900;
      mix.connect(lp);
      pa.setNodeSource(lp);
      radioNodes = { pa, stops };
      showPlaque({ title: 'the radio, playing itself', artist: '', year: '', source: '', note: '' });
    }

    function playTrack(track) {
      const a = new THREE.PositionalAudio(listener);
      a.setRefDistance(1.1);
      // a little top taken off, so a 78 sits in the air rather than on top of it
      radio.add(a);
      radioAudio = a;
      const start = buf => {
        if (!radioOn || radioAudio !== a) return;
        a.setBuffer(buf);
        a.setLoop(true);
        a.setVolume(0.85);
        a.play();
        showPlaque(track);
      };
      if (buffers.has(track.file)) {
        const b = buffers.get(track.file);
        if (b) start(b); else { radio.remove(a); radioAudio = null; playBed(); }
        return;
      }
      // A 78 is three minutes of audio and takes a beat to fetch and decode.
      // Say so: a button that appears to do nothing for three seconds is a
      // button people press again.
      showPlaque({ title: 'tuning…', artist: track.artist, year: '', source: '', note: '' });
      new THREE.AudioLoader().load(track.file,
        b => { buffers.set(track.file, b); start(b); },
        undefined,
        () => {                       // no such file — say nothing, play the bed
          buffers.set(track.file, null);
          if (radioAudio === a) { radio.remove(a); radioAudio = null; }
          if (radioOn) playBed();
        });
    }

    function radioToggle() {
      audioStart();
      if (!AC) return;
      // off → each track in turn → the bed → off
      if (!radioOn) { radioOn = true; trackIdx = 0; }
      else trackIdx += 1;
      radioStopAll();
      if (trackIdx < PLAYLIST.length) playTrack(PLAYLIST[trackIdx]);
      else if (trackIdx === PLAYLIST.length) playBed();
      else { radioOn = false; trackIdx = -1; }
    }

    // ── the credit plaque ──
    // A record that plays unattributed is a record somebody has to go looking
    // for. It hangs over the radio while something is playing and goes when
    // the radio does.
    const plaque = new THREE.Mesh(
      new THREE.PlaneGeometry(0.44, 0.15),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    plaque.visible = false;
    scene.add(plaque);
    function showPlaque(track) {
      if (!track) { plaque.visible = false; plaque.material.opacity = 0; return; }
      plaque.material.opacity = 0;   // each card fades up on its own
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 174;
      const g = cv.getContext('2d');
      g.clearRect(0, 0, 512, 174);
      g.fillStyle = 'rgba(12,16,20,0.72)';
      g.beginPath(); g.roundRect(0, 0, 512, 174, 14); g.fill();
      g.textAlign = 'center';
      g.fillStyle = '#f2e9d8';
      g.font = 'bold 40px ui-monospace, Menlo, Consolas, monospace';
      g.fillText(track.title.toUpperCase().slice(0, 26), 256, 62);
      if (track.artist) {
        g.fillStyle = '#3aa8a0';
        g.font = '30px ui-monospace, Menlo, Consolas, monospace';
        g.fillText(track.artist.toUpperCase(), 256, 104);
      }
      const foot = [track.year, track.note, track.source].filter(Boolean).join(' · ');
      if (foot) {
        g.fillStyle = 'rgba(242,233,216,0.62)';
        // the credit is the point of the card — shrink it to fit rather than
        // letting the source clip, which is exactly the half that matters
        let px = 22;
        do {
          g.font = `${px}px ui-monospace, Menlo, Consolas, monospace`;
          px -= 1;
        } while (px > 11 && g.measureText(foot).width > 480);
        g.fillText(foot, 256, 142);
      }
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      plaque.material.map?.dispose();
      plaque.material.map = tx;
      plaque.material.needsUpdate = true;
      plaque.visible = true;
    }

    // ═══ XR — teleport, totem, radio, the way back to the chair ═══
    document.body.appendChild(XRButton.createButton(renderer, {
      // hand-tracking for Quest hands; Vision Pro's gaze + pinch arrives as
      // transient-pointer input sources and needs nothing declared
      optionalFeatures: ['local-floor', 'hand-tracking'],
    }));
    let baseRef = null;
    renderer.xr.addEventListener('sessionstart', () => {
      baseRef = renderer.xr.getReferenceSpace();
      audioStart();
      shadowDirty();
    });

    const raycaster = new THREE.Raycaster();
    const marker = new THREE.Group();
    {
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.3, 24),
        new THREE.MeshBasicMaterial({ color: col(P.teal), transparent: true, opacity: 0.85, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2;
      const dot = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16),
        new THREE.MeshBasicMaterial({ color: col(P.cream), transparent: true, opacity: 0.55, depthWrite: false }));
      dot.rotation.x = -Math.PI / 2;
      dot.position.y = 0.005;
      marker.add(ring, dot);
      marker.visible = false;
      scene.add(marker);
    }
    // `statics` carries the jetty deck, so it has to be aimable — and
    // `ownerOf` calls it ground, which is only true where the face points up.
    // actOn asks that, so the side of a rock is not a destination.
    const rayTargets = [terrain, statics, totem, radio, chairHit, book, sign, slate, shell];
    const controllers = [];
    for (let i = 0; i < 2; i++) {
      const c = renderer.xr.getController(i);
      c.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -6)]),
        new THREE.LineBasicMaterial({ color: col(P.teal), transparent: true, opacity: 0.4 })));
      c.userData.hit = null;
      c.addEventListener('selectstart', () => { c.userData.downAt = performance.now(); });
      c.addEventListener('selectend', () =>
        actOn(c.userData.hit, performance.now() - (c.userData.downAt ?? performance.now())));
      scene.add(c);
      controllers.push(c);
    }
    // ── the same two sticks, on the controllers ──
    // Twin-stick in the headset too: the left thumbstick glides you along the
    // sand, the right one turns in SNAPS rather than smoothly, because smooth
    // yaw is the single most reliable way to make somebody queasy in a chair.
    // The teleport ray stays — one is for crossing the island, the other for
    // shifting a step, and a zen island should not force a choice.
    let snapCool = 0;
    const _xrFwd = new THREE.Vector3();
    function xrSticks(dt) {
      snapCool = Math.max(0, snapCool - dt);
      const session = renderer.xr.getSession?.();
      if (!session || !baseRef) return false;
      let mx = 0, my = 0, turn = 0;
      for (const src of session.inputSources) {
        const ax = src.gamepad?.axes;
        if (!ax || ax.length < 4) continue;
        // xr-standard puts the thumbstick on axes 2/3; some runtimes use 0/1
        const sx = Math.abs(ax[2]) > 0.15 ? ax[2] : (Math.abs(ax[0]) > 0.15 ? ax[0] : 0);
        const sy = Math.abs(ax[3]) > 0.15 ? ax[3] : (Math.abs(ax[1]) > 0.15 ? ax[1] : 0);
        if (src.handedness === 'right') turn += sx;
        else { mx += sx; my += sy; }
      }
      const step = TURNS[comfort.turn][1];
      if (turn) {
        // smooth is opt-in on the slate; the snaps are the default, and a
        // snap kicks the vignette so the cut has an edge to happen behind
        if (step === 0) xrYaw -= turn * 1.5 * dt;
        else if (snapCool <= 0) { xrYaw -= Math.sign(turn) * step; snapCool = 0.32; vigKick = 0.18; }
      }
      if (mx || my) {
        // move relative to where the head is actually looking
        renderer.xr.getCamera().getWorldDirection(_xrFwd);
        _xrFwd.y = 0;
        if (_xrFwd.lengthSq() < 1e-4) return true;
        _xrFwd.normalize();
        const rx = _xrFwd.z, rz = -_xrFwd.x;              // right = forward × up
        const v = moveSpeed() * dt;
        const nx = xrPos.x + (_xrFwd.x * -my + rx * mx) * v;
        const nz = xrPos.z + (_xrFwd.z * -my + rz * mx) * v;
        const m = tryMove(xrPos.x, xrPos.z, nx, nz, xrPos.y);
        xrPos.x = m.x; xrPos.z = m.z;
        // and the floor comes WITH you. The sticks never touched xrPos.y, so
        // walking off the pad left your feet at pad height while the sand
        // dropped away underneath — only teleport ever set it. Standing on
        // the jetty is the same mechanism, which is why it only works now.
        xrPos.y = m.y;
      }
      applyXrOffset();
      return !!(mx || my || (turn && step === 0));
    }
    // the offset reference space every locomotion path writes through
    let xrYaw = 0;
    const xrPos = new THREE.Vector3();
    function applyXrOffset() {
      if (!baseRef) return;
      const h = Math.sin(-xrYaw / 2), w = Math.cos(-xrYaw / 2);
      renderer.xr.setReferenceSpace(baseRef.getOffsetReferenceSpace(
        new XRRigidTransform(
          { x: -xrPos.x, y: -xrPos.y, z: -xrPos.z },
          { x: 0, y: h, z: 0, w })));
    }

    const _m4 = new THREE.Matrix4();
    function castFrom(c) {
      _m4.identity().extractRotation(c.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_m4);
      return raycaster.intersectObjects(rayTargets, true)[0] || null;
    }
    function ownerOf(obj) {
      for (let o = obj; o; o = o.parent) {
        if (o === totem) return 'totem';
        if (o === radio) return 'radio';
        if (o === book) return 'book';
        if (o === sign) return 'sign';
        if (o === chairHit) return 'chair';
        if (o === slate) return 'slate';
        if (o === statics) return 'ground';
        if (o === shell) return 'shell';
        if (o === terrain) return 'ground';
      }
      return null;
    }
    function actOn(hit, heldMs = 0) {
      if (!hit) return;
      const kind = ownerOf(hit.object);
      if (kind === 'totem') return setMood(moodIdx + 1);
      if (kind === 'radio') return radioToggle();
      if (kind === 'book') return bookAct();
      if (kind === 'sign') return goHome();
      if (kind === 'slate') return slateAct(slateRow(hit));
      if (kind === 'shell') return goChair();
      if (kind === 'chair') {
        // A LONG pinch on the chair recalibrates the seat from where your
        // head is right now — the whole calibration path on Vision Pro,
        // where Safari has no immersive-ar for chair-lab and no squeeze to
        // hang anything on. A short one sits you back down: the offset goes
        // to zero and the calibration is true again.
        if (heldMs > 1200) return calibrateFromHead();
        xrPos.set(0, 0, 0); xrYaw = 0;
        applyXrOffset();
        return;
      }
      if (kind === 'ground' && baseRef) {
        const p = hit.point;
        // the teleport clamp asks the same thing walking asks
        if (hit.face && hit.face.normal.y < 0.5) return;       // not a floor
        if (standY(p.x, p.z, p.y) === null) return;
        if (Math.hypot(p.x, p.z) > WALK_R) return;
        if (!canCross(xrPos.x, xrPos.z, p.x, p.z)) return;   // no jumping the channel
        // written through the same offset the sticks use, so the two ways of
        // moving cannot disagree about where you are standing
        xrPos.set(p.x, p.y, p.z);
        applyXrOffset();
      }
    }

    // ── sitting ─────────────────────────────────────────────────────────
    // The headline feature is a real sit, so the island should notice one:
    // head inside the seat band for a moment → one louder wave and a low
    // chime. Nothing is gated on it — it is an acknowledgement, not a menu.
    let seated = false, sitT = 0, calibrateQueued = false;
    const _headV = new THREE.Vector3(), _headD = new THREE.Vector3();
    const sitCheck = (x, y, z) =>
      Math.hypot(x - chairP[0], z - chairP[2]) < 0.65
      && y > chairP[1] + 0.12 && y < chairP[1] + 0.8;
    function sitUpdate(dt) {
      const xcam = renderer.xr.getCamera();
      _headV.setFromMatrixPosition(xcam.matrixWorld);
      if (calibrateQueued) { calibrateQueued = false; saveSeatFromHead(xcam); }
      if (sitCheck(_headV.x, _headV.y, _headV.z)) {
        sitT += dt;
        if (!seated && sitT > 0.8) { seated = true; chime(392, 523.25); surfSwell(); }
      } else {
        sitT = 0;
        if (seated && _headV.y > chairP[1] + 0.95) seated = false;
      }
    }
    // Back to the nook from anywhere, which is what the shell in the cave is
    // for: the tide comes back over the bar, and being kept on the rock for a
    // few minutes by the sea is fine — being kept there with no way off is not.
    function goChair() {
      chime(523.25, 392);
      if (renderer.xr.isPresenting) {
        xrPos.set(0, 0, 0); xrYaw = 0;
        applyXrOffset();
      } else {
        footY = standY(chairP[0], chairP[2], gy(chairP[0], chairP[2]) + 2) ?? gy(chairP[0], chairP[2]);
        eye.set(chairP[0], footY + 1.5, chairP[2]);
        yaw = chairYaw + Math.PI; pitch = -0.1;
      }
      return true;
    }
    function calibrateFromHead() {
      if (!renderer.xr.isPresenting) return;
      // back to base space first, so the head is read in the same
      // local-floor coordinates the calibration keys are defined in —
      // a saved seat measured through a walked offset would be wrong by
      // however far you had wandered
      xrPos.set(0, 0, 0); xrYaw = 0;
      applyXrOffset();
      calibrateQueued = true;   // read it NEXT frame, after the space settles
    }
    function saveSeatFromHead(xcam) {
      xcam.getWorldDirection(_headD);
      _headD.y = 0; _headD.normalize();
      const yaw = Math.atan2(_headD.x, _headD.z);
      const p = [_headV.x - _headD.x * 0.08,
        Math.min(0.8, Math.max(0.3, _headV.y - 0.28)),
        _headV.z - _headD.z * 0.08];
      try {
        localStorage.setItem('tokoTrip.chairPoseFallback', JSON.stringify({ p, yaw }));
        localStorage.setItem('tokoTrip.chairYaw', String(yaw));
      } catch (e) { /* no storage — nothing to save into */ }
      chairP = p; chairYaw = yaw;   // reported now; the nook rebuilds next visit
      chime(523.25, 783.99);
      const tag = document.getElementById('mood-name');
      tag.textContent = 'CHAIR SAVED — THE NEXT VISIT BUILDS AROUND IT';
      tag.style.opacity = 0.8;
      setTimeout(() => { tag.style.opacity = 0; }, 3000);
    }

    // ═══ TWIN STICKS ═══ The flat controls, on every flat screen — phone,
    // tablet and desktop alike. Left half walks, right half looks. They are
    // DRAWN ALWAYS rather than summoned by a first touch, because a control
    // you cannot see is a control a visitor has to be told about, and this is
    // a thing people open once out of curiosity.
    //
    // A stick is born wherever the finger lands inside its half, so nothing
    // depends on hitting a fixed circle, and a short press that barely moves
    // is a TAP — which is how you use the totem, the book, the radio and the
    // sign without a second set of buttons.
    // Camera forward for yaw θ is (−sin θ, −cos θ); the start is behind the
    // chair, looking over it down the cove.
    let yaw = chairYaw + Math.PI, pitch = -0.06;
    const eye = new THREE.Vector3(
      chairP[0] - Math.sin(chairYaw) * 2.4, 0, chairP[2] - Math.cos(chairYaw) * 2.4);
    eye.y = gy(eye.x, eye.z) + 1.5;

    const uiCv = document.getElementById('ui');
    const uiCtx = uiCv.getContext('2d');
    const R_STICK = 62, R_KNOB = 26, TAP_MS = 260, TAP_PX = 14;
    // one entry per live finger; `side` decides what it drives
    const sticks = new Map();
    const stickVec = side => {
      for (const s of sticks.values()) if (s.side === side) return s;
      return null;
    };
    const homeFor = side => ({
      x: side === 'move' ? Math.min(140, innerWidth * 0.18) : innerWidth - Math.min(140, innerWidth * 0.18),
      y: innerHeight - Math.min(150, innerHeight * 0.24),
    });

    renderer.domElement.addEventListener('pointerdown', e => {
      audioStart();
      if (renderer.xr.isPresenting) return;
      const side = e.clientX < innerWidth / 2 ? 'move' : 'look';
      if (stickVec(side)) return;                    // one finger per half
      sticks.set(e.pointerId, {
        side, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY,
        t0: performance.now(), moved: 0,
      });
      renderer.domElement.setPointerCapture?.(e.pointerId);
    });
    addEventListener('pointermove', e => {
      const s = sticks.get(e.pointerId);
      if (!s) return;
      s.moved = Math.max(s.moved, Math.hypot(e.clientX - s.ox, e.clientY - s.oy));
      s.x = e.clientX; s.y = e.clientY;
    });
    const liftPointer = e => {
      const s = sticks.get(e.pointerId);
      if (!s) return;
      sticks.delete(e.pointerId);
      // a short press that barely moved is a tap on the world, not a stick
      if (performance.now() - s.t0 < TAP_MS && s.moved < TAP_PX && !renderer.xr.isPresenting) {
        raycaster.setFromCamera(new THREE.Vector2(
          (s.ox / innerWidth) * 2 - 1, -(s.oy / innerHeight) * 2 + 1), camera);
        const hit = raycaster.intersectObjects([totem, radio, book, sign], true)[0];
        if (hit) actOn(hit);
      }
    };
    addEventListener('pointerup', liftPointer);
    addEventListener('pointercancel', liftPointer);

    // the deflection of a stick, as a unit-ish vector with a dead zone
    function stickAxes(side) {
      const s = stickVec(side);
      if (!s) return [0, 0];
      let dx = s.x - s.ox, dy = s.y - s.oy;
      const len = Math.hypot(dx, dy);
      if (len < 8) return [0, 0];
      const k = Math.min(1, len / R_STICK) / len;
      return [dx * k, dy * k];
    }

    function drawSticks() {
      const dpr = Math.min(2, devicePixelRatio);
      if (uiCv.width !== innerWidth * dpr || uiCv.height !== innerHeight * dpr) {
        uiCv.width = innerWidth * dpr; uiCv.height = innerHeight * dpr;
        uiCv.style.width = `${innerWidth}px`; uiCv.style.height = `${innerHeight}px`;
      }
      uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      uiCtx.clearRect(0, 0, innerWidth, innerHeight);
      if (renderer.xr.isPresenting) return;           // the headset has real sticks
      for (const side of ['move', 'look']) {
        const s = stickVec(side);
        const base = s ? { x: s.ox, y: s.oy } : homeFor(side);
        let kx = 0, ky = 0;
        if (s) {
          const dx = s.x - s.ox, dy = s.y - s.oy, len = Math.hypot(dx, dy) || 1;
          const c = Math.min(R_STICK, len) / len;
          kx = dx * c; ky = dy * c;
        }
        uiCtx.lineWidth = 2;
        uiCtx.strokeStyle = 'rgba(242,233,216,0.30)';
        uiCtx.beginPath(); uiCtx.arc(base.x, base.y, R_STICK, 0, Math.PI * 2); uiCtx.stroke();
        uiCtx.fillStyle = s ? 'rgba(58,168,160,0.55)' : 'rgba(242,233,216,0.18)';
        uiCtx.beginPath(); uiCtx.arc(base.x + kx, base.y + ky, R_KNOB, 0, Math.PI * 2); uiCtx.fill();
        uiCtx.strokeStyle = 'rgba(242,233,216,0.45)';
        uiCtx.beginPath(); uiCtx.arc(base.x + kx, base.y + ky, R_KNOB, 0, Math.PI * 2); uiCtx.stroke();
        if (!s) {                                     // name it while it is idle
          uiCtx.fillStyle = 'rgba(242,233,216,0.5)';
          uiCtx.font = '11px ui-monospace, Menlo, Consolas, monospace';
          uiCtx.textAlign = 'center';
          uiCtx.fillText(side === 'move' ? 'WALK' : 'LOOK', base.x, base.y + R_STICK + 18);
        }
      }
    }

    // keys stay as a courtesy for anyone at a desk who reaches for them
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyM') setMood(moodIdx + 1);
      audioStart();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ═══ THE LOOP ═══
    const clock = new THREE.Clock();
    const neonFlick = { until: 0, dim: 1 };
    const _plaqueV = new THREE.Vector3();
    let perfT = 0, perfN = 0, perfMs = 0, perfWorst = 0, perfCalls = 0, perfTris = 0;
    // the surface under the flat camera's feet, carried between frames so a
    // ray that starts at the feet has feet to start at
    let footY = 0;
    function animate() {
      const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
      tideT += dt * TIDE_RATES[comfort.time][1];
      tide = tideAt(tideT);
      dayT += dt * TIDE_RATES[comfort.time][1];

      if (blend < 1) {
        blend = Math.min(1, blend + dt / 2.5); applyMood(); shadowDirty();
        if (blend >= 1) rebuildEnv();                 // the settled sky, reflected exactly
      } else {
        daySky(dt);                                   // otherwise the day has the sky
      }

      if (!renderer.xr.isPresenting) {
        // ── twin sticks, plus the keys for anyone who reaches for them ──
        const [mx, my] = stickAxes('move');
        const [lx2, ly2] = stickAxes('look');
        yaw -= lx2 * 2.2 * dt;
        pitch = Math.min(1.2, Math.max(-1.2, pitch - ly2 * 1.6 * dt));
        const f = -my + (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
        const s2 = mx + (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
        if (f || s2) {
          // the same dial the headset reads, a little quicker: a screen has
          // no inner ear to upset, but the two must not disagree about which
          // setting "brisk" is
          const v = moveSpeed() * 1.35 * dt;
          const nx = eye.x + (-Math.sin(yaw) * f + Math.cos(yaw) * s2) * v;
          const nz = eye.z + (-Math.cos(yaw) * f - Math.sin(yaw) * s2) * v;
          // walking asks the same thing the teleport does, so the sea refuses
          // a stick exactly the way it refuses a ray — and the jetty carries
          // one exactly the way it carries the other
          const m = tryMove(eye.x, eye.z, nx, nz, footY);
          eye.x = m.x; eye.z = m.z; footY = m.y;
        }
        eye.y += ((footY + 1.5) - eye.y) * Math.min(1, dt * 8);
        camera.position.copy(eye);
        camera.rotation.set(0, 0, 0);
        camera.rotateY(yaw);
        camera.rotateX(pitch);
        vigUpdate(dt, !!(f || s2) || Math.abs(lx2) > 0.2);
      } else {
        vigUpdate(dt, xrSticks(dt));
        sitUpdate(dt);
        // controller rays + the teleport marker
        marker.visible = false;
        for (const c of controllers) {
          const hit = castFrom(c);
          c.userData.hit = hit;
          if (hit && ownerOf(hit.object) === 'ground'
            && (!hit.face || hit.face.normal.y > 0.5)
            && standY(hit.point.x, hit.point.z, hit.point.y) !== null) {
            marker.position.copy(hit.point);
            marker.position.y += 0.02;
            marker.visible = true;
          }
        }
      }

      // idle motion — the half of the art budget that actually earns presence
      // the sea: the plane rides the swell, the two surface maps slide in
      // different directions so the ripple has cross-motion, and the foam
      // line follows the water's reach up the sand
      water.position.y = -PAD_H + tide + surfLevel(t);
      sea.position.y = water.position.y - 0.02;
      waterNormal.offset.set(t * 0.011, -t * 0.006);
      waterDisp.offset.set(-t * 0.004, t * 0.0055);
      // the two caustic layers drift against each other; their product is
      // what moves, and it moves far less obviously than either layer does
      if (waterMode === 'tsl') {
        // everything the node material needs that changes: where the surface
        // is, where the sun is, and what colour the water is being this mood
        uSea.value = water.position.y;
        uNormOff.value.set(t * 0.011, -t * 0.006);
        uShallow.value.copy(cur.water).lerp(_envC.setRGB(1, 1, 1), 0.55);
        uDeep.value.copy(cur.water).multiplyScalar(0.42);
        uSunDir.value.copy(cur.sunDir);
        uSunCol.value.copy(cur.sunCol).multiplyScalar(smooth(0.6, 3.1, cur.sunInt));
      }
      causA.offset.set(t * 0.0085, t * 0.0062);
      causB.offset.set(-t * 0.0051, t * 0.0037);
      // Caustics are sunlight that got through the surface, so they follow
      // the sun rather than the exposure: a low sun puts little light INTO
      // the water however warm the sky looks, which is why golden hour keeps
      // only a trace of them and midday has them properly.
      const causSun = (0.3 + 0.7 * smooth(0.0, 0.7, Math.max(0, cur.sunDir.y)))
        * smooth(0.6, 3.1, cur.sunInt);
      // Sunlight that has been through water, so it is the sun's colour bent
      // toward the sea's — not white. Added at half strength: caustics are a
      // MODULATION of the sand, and at full additive white they stop being
      // light on a beach and become lace laid over one.
      caustics.material.color.copy(cur.sunCol).lerp(cur.water, 0.4)
        .multiplyScalar(causSun * 0.85);
      caustics.visible = causSun > 0.02;
      if (Math.abs(tide - causBakedAt) > 0.02) causRebake();
      foamUpdate(t);
      // the reflection is rebuilt a few times across a mood blend, not every
      // frame: each rebuild is a fresh filtered cube on the GPU
      if (blend < 1 && t - envStamp > 0.3) { envStamp = t; rebuildEnv(); }
      for (const c of crowns) {
        c.rotation.z = Math.sin(t * 0.6 + c.userData.phase) * 0.035;
        c.rotation.x = Math.cos(t * 0.47 + c.userData.phase) * 0.028;
      }
      for (const r of reedClumps) r.rotation.z = Math.sin(t * 0.9 + r.userData.phase) * 0.05;
      // a failed prop TURNS, and its label follows your head. Nothing else on
      // this island does either, which is the point: a cage that could be
      // mistaken for scenery has failed at the only job it has.
      if (propCages.length) {
        const pc = renderer.xr.isPresenting ? renderer.xr.getCamera() : camera;
        _cageV.setFromMatrixPosition(pc.matrixWorld);
        for (const g of propCages) {
          for (const ch of g.children) {
            if (ch.userData.billboard) {
              ch.getWorldPosition(_cageL);
              ch.lookAt(_cageV.x, _cageL.y, _cageV.z);
            } else ch.rotation.y = t * 0.6;
          }
        }
      }
      soundUpdate(dt, t);
      clouds.rotation.y = t * 0.0045;
      for (const b of birds) {
        const d = b.userData, a = t * d.sp + d.ph;
        b.position.set(Math.cos(a) * d.r, d.y + Math.sin(t * 0.3 + d.ph) * 0.6, Math.sin(a) * d.r);
        b.rotation.y = -a + Math.PI / 2;
        // one sine is a whole wingbeat, and it is the only thing that makes
        // three triangles read as a bird rather than as a speck
        b.children[0].rotation.z = Math.sin(t * 5 + d.ph) * 0.5;
        b.children[1].rotation.z = -Math.sin(t * 5 + d.ph) * 0.5;
      }
      // the credit hangs over the radio and turns to face whoever is reading it
      if (plaque.visible) {
        plaque.position.set(radio.position.x, radio.position.y + 0.34, radio.position.z);
        plaque.position.y += Math.sin(t * 0.9) * 0.004;
        plaque.lookAt(camera.getWorldPosition(_plaqueV));
        plaque.material.opacity = Math.min(0.92, plaque.material.opacity + dt * 1.6);
      }
      // the book rises to reading height when open and settles when shut —
      // the same spot either way, so it is never somewhere you did not leave it
      bookSpread += ((bookOpen ? 1 : 0) - bookSpread) * Math.min(1, dt * 4.5);
      if (bookSpread > 0.001) {
        // reading height is BELOW a seated eye (~seat + 0.28) — a book held
        // in the lap, not one hovering in front of your face
        book.position.y = 0.075 + bookSpread * (chairP[1] + 0.2 - 0.075);
        book.position.x = bookRest.x + (bookRead.x - bookRest.x) * bookSpread;
        book.position.z = bookRest.z + (bookRead.z - bookRest.z) * bookSpread;
        book.rotation.set(-bookSpread * 0.5, NOOK_YAW + 0.4 * (1 - bookSpread), 0);
        book.position.y += Math.sin(t * 0.8) * 0.006 * bookSpread;
      } else {
        book.position.set(bookRest.x, 0.075, bookRest.z);
        book.rotation.set(0, NOOK_YAW + 0.4, 0);
      }
      totemCap.rotation.y = t * 0.6;
      totemCapMat.emissiveIntensity = 0.55 + 0.3 * Math.sin(t * 2.1);
      // neon: mostly on, with honest dropouts
      if (neonFlick.until < t) {
        if (Math.random() < 0.008) {
          neonFlick.until = t + 0.06 + Math.random() * 0.12;
          neonFlick.dim = 0.15 + Math.random() * 0.3;
        } else neonFlick.dim = 1;
      }
      const neonK = cur.neon * (neonFlick.until > t ? neonFlick.dim : 1);
      neonMat.color.copy(C_NEON).multiplyScalar(0.4 + neonK);
      neonLight.intensity = neonK * 3.2;
      neonLight.visible = neonK > 0.05;
      // the pool: always faintly there, properly lit once the lanterns are
      const night = smooth(0.2, 1.6, cur.lantern);
      const breathe = 0.85 + 0.15 * Math.sin(t * 0.9);
      pool.material.opacity = (0.18 + 0.4 * night) * breathe;
      // physical units: at the 1.6 first tried it lit nothing past its own
      // rim, and the walls of the cave it is the only light in stayed black
      poolLight.intensity = (0.6 + 7.5 * night) * breathe;
      if (fireflies.material.opacity > 0.01) {
        const { base, ph, n } = fireflies.userData;
        const pp = fireflies.geometry.attributes.position;
        for (let i = 0; i < n; i++) {
          pp.setXYZ(i,
            base[i * 3] + Math.sin(t * 0.5 + ph[i]) * 0.35,
            base[i * 3 + 1] + Math.sin(t * 0.8 + ph[i] * 2) * 0.2,
            base[i * 3 + 2] + Math.cos(t * 0.4 + ph[i]) * 0.35);
        }
        pp.needsUpdate = true;
      }

      drawSticks();
      renderer.render(scene, camera);

      // ── the frame cost ──
      // Sampled AFTER the render, because three zeroes info at the top of
      // every animation frame — read it above the render and the draw count
      // is always exactly zero, which is a very convincing wrong answer.
      // Averaged over half a second with the worst frame of that window kept
      // beside it: the average says whether it runs, the worst says whether
      // it hitches, and only one of those is felt.
      perfN++; perfT += dt;
      perfMs += dt * 1000;
      perfWorst = Math.max(perfWorst, dt * 1000);
      const ri = renderer.info?.render;
      if (ri) { perfCalls = ri.drawCalls || ri.calls || 0; perfTris = ri.triangles || 0; }
      if (perfT >= 0.5) {
        perfSample.fps = Math.round(perfN / perfT);
        perfSample.ms = +(perfMs / perfN).toFixed(1);
        perfSample.worst = +perfWorst.toFixed(1);
        perfSample.calls = perfCalls;
        perfSample.tris = perfTris;
        perfT = 0; perfN = 0; perfMs = 0; perfWorst = 0;
        if (perfOn) { paintSlate(); paintPerfEl(); }
      }
    }

    setWater(waterMode);
    makeSolid(terrain);
    makeSolid(statics);
    makeSolid(chairProp);
    openPropDoor();
    setMood(0, true);
    (renderer.init ? renderer.init() : Promise.resolve())
      .then(() => { shadowDirty(); renderer.setAnimationLoop(animate); });

    // the smoke test drives game state, not the wall clock
    window.__tt = {
      scene, renderer, camera, groundHeight, setMood,
      get mood() { return moodIdx; },
      get chair() { return { p: chairP, yaw: chairYaw }; },
      occluders, MOODS, TIER,
      debug: {
        radioToggle, actOn, rayTargets, sitCheck, bookAct, PLAYLIST,
        radio: () => ({ on: radioOn, track: trackIdx, plaque: plaque.visible }),
        sign, goHome, PROPS, DRESSING,
        imported: () => imported.map(i => ({ file: i.spec.file, pos: i.obj.position.toArray() })),
        // the prop door: what each slot declared, and what the file actually
        // was. A slot that failed is reported, never silently absent.
        props: () => ({
          slots: [...PROPS, ...DRESSING].map(sp => ({
            id: sp.id, state: sp.state, kind: sp.kind, fit: sp.fit ?? 'ground',
            tris: sp.tris, span: sp.span,
          })),
          reports: propReports.map(r => ({ id: r.id, state: r.state, why: r.why })),
          cages: propCages.length,
          banner: document.getElementById('propfail')?.textContent ?? '',
          chairStandIn: !!chairProp,
        }),
        // drive the door's failure path without shipping a broken file
        propFail: (id, why = 'forced by the gate') => {
          const sp = [...PROPS, ...DRESSING].find(x => x.id === id);
          if (!sp) return false;
          propReports.push({ id: sp.id, state: 'live', tris: 0, textures: 0, dim: [0, 0, 0], why: [why] });
          propCage(sp, propAnchor(sp), why);
          propBanner();
          return true;
        },
        // run the contract against a SYNTHETIC file, so the gate can prove
        // each refusal without a broken .glb being committed to prove it
        propProbe: (id, { tris = 100, size = null, clips = 0, skinned = false } = {}) => {
          const sp = [...PROPS, ...DRESSING].find(x => x.id === id);
          if (!sp) return null;
          const want = size ?? sp.span.map(v => v * 0.8);
          const g = new THREE.BoxGeometry(want[0], want[1], want[2]);
          // a box is 12 triangles; pad the index up to the triangle count asked for
          const idx = [];
          for (let i = 0; i < tris; i++) idx.push(0, 1, 2);
          g.setIndex(idx);
          const mesh = skinned ? new THREE.SkinnedMesh(g) : new THREE.Mesh(g);
          const root = new THREE.Group();
          root.add(mesh);
          root.updateMatrixWorld(true);
          const fake = { scene: root, animations: Array.from({ length: clips }, () => ({})) };
          const out = checkProp(sp, fake);
          g.dispose();
          return out;
        },
        // the tide: where it is, and a way to put it somewhere exactly
        tide: () => ({
          level: +tide.toFixed(4), phase: +((tideT % TIDE_PERIOD) / TIDE_PERIOD).toFixed(4),
          amp: TIDE_AMP, period: TIDE_PERIOD, rate: TIDE_RATES[comfort.time][0],
          waterY: +water.position.y.toFixed(4), seaY: +seaY().toFixed(4),
          surfAt: surfVoices.map(v => [+v.host.position.x.toFixed(2), +v.host.position.z.toFixed(2)]),
        }),
        // a jump, like advance(): the surf re-seats now, not on its timer
        setTide: (phase01) => { tideT = phase01 * TIDE_PERIOD; tide = tideAt(tideT); retuneSurf(); return tide; },
        // the day: where it is, and a way to put it somewhere exactly
        day: () => {
          const seg = daySegment(dayPhase());
          return { phase: +dayPhase().toFixed(4), mood: moodIdx, hold: seg.m0 === seg.m1 ? seg.m0 : -1,
            from: seg.m0, to: seg.m1, fog: cur.fog.getHexString(), sunY: +cur.sunDir.y.toFixed(3),
            period: DAY, rate: TIDE_RATES[comfort.time][0] };
        },
        setDay: (phase01) => { dayT = phase01 * DAY; dayHold = -1; blend = 1; daySky(0); return dayPhase(); },
        moodFog: (i) => MOOD_STATES[i].fog.getHexString(),
        // the cave: where it is, whether the way is open, and the way home
        cave: () => {
          const bar = [];
          for (let i = 0; i <= 12; i++) {
            const a = lerp(ISLET.barFrom + 0.5, ISLET.barTo, i / 12);
            bar.push(standY(ISLET.ux * a, ISLET.uz * a, gy(ISLET.ux * a, ISLET.uz * a) + 0.3) !== null);
          }
          // beside the bar, half way along: the channel, which must never dry
          const mid = lerp(ISLET.barFrom, ISLET.barTo, 0.5), off = 3.2;
          const cx = ISLET.ux * mid + ISLET.uz * off, cz = ISLET.uz * mid - ISLET.ux * off;
          return { at: [+ISLET.x.toFixed(2), +ISLET.z.toFixed(2)], r: +ISLET.R.toFixed(2),
            barFrom: +ISLET.barFrom.toFixed(2), barTo: +ISLET.barTo.toFixed(2),
            open: barOpen(), bar, channelDry: standY(cx, cz, gy(cx, cz) + 0.3) !== null,
            floor: standY(caveSpot.x, caveSpot.z, gy(caveSpot.x, caveSpot.z) + 0.3),
            mouth: [+(caveSpot.x + Math.sin(caveMouth) * 4.2).toFixed(2), +(caveSpot.z + Math.cos(caveMouth) * 4.2).toFixed(2)],
            blobs: CAVE_BLOBS.length, pool: +pool.material.opacity.toFixed(3) };
        },
        canCross: (fx, fz, tx, tz) => canCross(fx, fz, tx, tz),
        goChair, shell, caveSpot,
        // let time pass, on both clocks at once, exactly as sitting would
        advance: (sec) => {
          // a JUMP, so the surf is re-seated now rather than on its two-second
          // timer — otherwise the next thing to look finds it at the old line
          tideT += sec; tide = tideAt(tideT); dayT += sec; dayHold = -1; blend = 1; daySky(0);
          retuneSurf();
          return { day: +dayPhase().toFixed(4), tide: +((tideT % TIDE_PERIOD) / TIDE_PERIOD).toFixed(4) };
        },
        tidePhase: () => +((tideT % TIDE_PERIOD) / TIDE_PERIOD).toFixed(4),
        retuneSurf,
        foamReach: () => +(tide + surfLevel(clock.elapsedTime) + 0.045).toFixed(4),
        // the caustics: the light the water throws on the sand
        caustics: () => {
          const c = causGeo.attributes.color, pos = causGeo.attributes.position;
          let lit = 0, dry = 0;
          for (let i = 0; i < c.count; i++) {
            const submerged = tide - groundHeight(pos.getX(i), pos.getZ(i)) > 0.05;
            if (c.getX(i) > 0.05) { lit++; if (!submerged) dry++; }
          }
          return { lit, dry, verts: c.count, bakedAt: +causBakedAt.toFixed(3),
            sun: +caustics.material.color.r.toFixed(3), visible: caustics.visible,
            tiles: [causA.repeat.x, causB.repeat.x], additive: caustics.material.blending === THREE.AdditiveBlending };
        },
        causRebake, caustMesh: caustics, waterMesh: water, seaMesh: sea,
        // the two waters, swappable on the frame, for comparing them
        setWater, water: () => ({ mode: waterMode,
          // the range the depth term is computed against — sea level has to
          // land INSIDE it, or every depth clamps to zero and the material is
          // all Fresnel and no absorption, which is what the first cut did
          bathyMin: +Math.min(...waterGeo.attributes.bathy.array).toFixed(3),
          bathyMax: +Math.max(...waterGeo.attributes.bathy.array).toFixed(3),
          tsl: water.material === waterTslMat && waterTslMat !== null,
          nodes: !!waterTslMat, envLive: !!envNodeRef && envNodeRef.value === envCube,
          sea: +water.position.y.toFixed(3) }),
        // the height band the foam points actually occupy — the tide walks
        // the break through this, and a band that does not span the tide is
        // a surf line that stops existing at low water
        foamBand: () => {
          const hs = foam.userData.hs;
          return { lo: +Math.min(...hs).toFixed(3), hi: +Math.max(...hs).toFixed(3), n: hs.length };
        },
        credits: () => propCredits.slice(),
        creditProp: (title, author, licence) => {
          const lic = (licence ?? '').trim();
          if (lic && !/^cc0|^public domain/i.test(lic)) {
            propCredits.push(`${title} — ${author || 'unknown'} (${lic})`);
            paintSign();
            return true;
          }
          return false;
        },
        // stand somewhere and face something — the flat camera, for the gate
        stand: (x, z, ry, p = -0.15) => {
          // stand on what a PLAYER would stand on — the deck if there is one
          // over this column, the sand if there is not. Dropped from well
          // above, because this is a placement, not a step.
          footY = standY(x, z, gy(x, z) + 2) ?? gy(x, z);
          eye.set(x, footY + 1.5, z); yaw = ry; pitch = p;
        },
        book: () => ({ open: bookOpen, page: bookPage, pages: PAGES.length }),
        seated: () => seated,
        canTeleport: (x, z) => standY(x, z, gy(x, z) + 0.2) !== null
          && Math.hypot(x, z) <= WALK_R,
        // collision, which is the island's geometry rather than its height field
        collide: () => ({ solids: solids.length, seaY: +seaY().toFixed(3), stepUp: STEP_UP,
          trees: solids.filter(m => !!m.geometry.boundsTree).length }),
        standY: (x, z, feetY = 0) => standY(x, z, feetY),
        wallBetween: (fx, fz, tx, tz, feetY = 0) => wallBetween(fx, fz, tx, tz, feetY),
        tryMove: (fx, fz, tx, tz, feetY = 0) => {
          const m = tryMove(fx, fz, tx, tz, feetY);
          return { x: +m.x.toFixed(3), z: +m.z.toFixed(3), y: +m.y.toFixed(3), moved: m.moved };
        },
        // comfort, the slate that sets it, and the frame cost it reports
        slate, slateFace, slateAct, slateRow, SPEEDS, TURNS, moveSpeed,
        comfort: () => ({ ...comfort, speed: SPEEDS[comfort.speed][0], turn: TURNS[comfort.turn][0],
          time: TIDE_RATES[comfort.time][0] }),
        setComfort,
        vignette: () => ({ on: vignette.visible, opacity: +vignette.material.opacity.toFixed(3) }),
        perf: () => ({ ...perfSample, on: perfOn, backend: backendName(), tier: TIER.name }),
        // the sand: relief that tiles, and gloss that follows the water
        sand: () => {
          const m = terrain.material, d = sandRough.image.data, step = (AO_HALF * 2) / AO_N;
          const at = (x, z) => {
            const i = Math.min(AO_N - 1, Math.max(0, Math.round((x + AO_HALF) / step - 0.5)));
            const j = Math.min(AO_N - 1, Math.max(0, Math.round((z + AO_HALF) / step - 0.5)));
            return d[(j * AO_N + i) * 4] / 255;
          };
          const fx = Math.sin(chairYaw), fz = Math.cos(chairYaw);
          return {
            normal: !!m.normalMap, scale: m.normalScale.x,
            tile: m.normalMap ? m.normalMap.repeat.x : 0,
            rough: !!m.roughnessMap,
            wet: +at(fx * 5, fz * 5).toFixed(3),        // out toward the water
            dry: +at(-fx * 5, -fz * 5).toFixed(3),      // back up the beach
          };
        },
        // the soundscape: where it comes from, and whether it is really off
        audioStart, gullCry, waterEdge,
        air: () => ({
          started: !!AC,
          surf: surfVoices.map(v => ({
            at: [+v.host.position.x.toFixed(2), +v.host.position.z.toFixed(2)],
            ground: +groundHeight(v.host.position.x, v.host.position.z).toFixed(3),
            gain: +v.gain.gain.value.toFixed(4),
          })),
          wind: windVoices.map(v => +v.gain.gain.value.toFixed(4)),
          master: listener.getInput().gain.value,
          mixSurf: +mixSurf.toFixed(3), mixWind: +mixWind.toFixed(3), cut: wantCut,
          nextGull: +nextGull.toFixed(1),
        }),
      },
    };
  </script>
  <script type="module" src="../hub/shell.js?v=71"></script>
