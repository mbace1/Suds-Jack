      sign.position.set(signSpot.x, gy(signSpot.x, signSpot.z), signSpot.z);
      // face the chair, so it is readable from the seat
      sign.rotation.y = Math.atan2(chairP[0] - signSpot.x, chairP[2] - signSpot.z);
      scene.add(sign);
    }
    function goHome() {
      // end the session before navigating: a browser that changes page while
      // still presenting leaves the headset staring at a dead compositor
      const s = renderer.xr.getSession?.();
      const leave = () => { location.href = '../'; };
      chime(587.33, 392);
      if (s) s.end().then(leave, leave); else leave();
    }

    // ═══ THE CAVE — distant landmark, exterior only, neon arch flickering ═══
    const C_NEON = col(P.neon);
    const neonMat = new THREE.MeshBasicMaterial({ color: C_NEON.clone(), fog: false });
    const neonLight = new THREE.PointLight(C_NEON.getHex(), 0, 12, 1.6);
    {
      const gh = groundHeight(caveSpot.x, caveSpot.z);
      const cDark = col(P.rockDark);
      for (let i = 0; i < 5; i++) {
        const s = 1.1 + rng() * 1.3;
        const g = new THREE.IcosahedronGeometry(s, 1);
        const pos = g.attributes.position;
        for (let j = 0; j < pos.count; j++) {
          const k = 0.8 + hash(j, i) * 0.45;
          pos.setXYZ(j, pos.getX(j) * k, pos.getY(j) * k * 0.75, pos.getZ(j) * k);
        }
        paint(g, (x, y) => _c.copy(cDark).multiplyScalar(0.55 + 0.5 * smooth(-s, s, y)));
        const a = i / 5 * Math.PI * 1.6 - 0.4;
        drop(g, caveSpot.x + Math.cos(a) * 1.6, gh + s * 0.4, caveSpot.z + Math.sin(a) * 1.4, rng() * 6);
      }
      // the mouth: a dark disc you cannot enter (the interior is deferred)
      const outward = Math.atan2(-caveSpot.x, -caveSpot.z);
      const mouth = paint(new THREE.CircleGeometry(0.95, 12), col('#050508'));
      mouth.rotateY(outward);
      const mx = caveSpot.x * 0.8, mz = caveSpot.z * 0.8;
      drop(mouth, mx, gh + 1.0, mz);
      const arch = new THREE.Mesh(new THREE.TorusGeometry(1.05, 0.055, 6, 20, Math.PI), neonMat);
      arch.position.set(mx, gy(caveSpot.x, caveSpot.z) + 1.0, mz);
      arch.rotation.y = outward;
      scene.add(arch);
      neonLight.position.set(mx, gy(caveSpot.x, caveSpot.z) + 1.4, mz);
      scene.add(neonLight);
    }

    // the static merge — everything above that neither moves nor answers a ray
    const statics = new THREE.Mesh(BGU.mergeGeometries(pile.map(g => {
      const c = g.index ? g.toNonIndexed() : g;
      if (!c.attributes.uv) c.setAttribute('uv',
        new THREE.BufferAttribute(new Float32Array(c.attributes.position.count * 2), 2));
      return c;
    })), satin);
    statics.castShadow = true;
    statics.receiveShadow = true;
    island.add(statics);

    // ═══ INSTANCED — grass on the high dry ground, pebbles in the wet band:
    // two draw calls, so density is ~free ═══
    function bladeGeo() {
      const gs = [];
      const cBase = col('#4e7a44'), cTip = col('#8cbf6e');
      for (let k = 0; k < 3; k++) {
        const b = new THREE.PlaneGeometry(0.07, 0.32, 1, 2);
        const bp = b.attributes.position;
        for (let i = 0; i < bp.count; i++) {
          const t = (bp.getY(i) + 0.16) / 0.32;
          bp.setX(i, bp.getX(i) * (1 - t * 0.8));
          bp.setZ(i, t * t * 0.06);
        }
        paint(b, (x, y) => _c.copy(cBase).lerp(cTip, (y + 0.16) / 0.32));
        b.translate(0, 0.16, 0);
        b.rotateY(k / 3 * Math.PI * 2);
        gs.push(b.toNonIndexed());
      }
      return BGU.mergeGeometries(gs);
    }
    const GRASS_N = Math.round(420 * TIER.density), PEBBLE_N = Math.round(260 * TIER.density);
    const grass = new THREE.InstancedMesh(bladeGeo(),
      foliage, GRASS_N);
    {
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0),
        s = new THREE.Vector3(), p = new THREE.Vector3();
      let placed = 0, guard = 120000;
      while (placed < GRASS_N && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 2, z = (rng() - 0.5) * ISLAND_R * 2;
        const h = groundHeight(x, z);
        // nothing grows on the beach — the sand is the point of the cove
        if (h < 1.05 || Math.hypot(x, z) < 2.3 || beachness(x, z) > 0.1) continue;
        const k = 0.7 + rng() * 0.8;
        q.setFromAxisAngle(up, rng() * Math.PI * 2);
        m.compose(p.set(x, h - 0.01, z), q, s.set(k, k * (0.8 + rng() * 0.5), k));
        grass.setMatrixAt(placed, m);
        grass.setColorAt(placed, _c.setScalar(0.8 + rng() * 0.35));
        placed++;
      }
      grass.count = placed;
    }
    island.add(grass);

    const pebbles = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 0),
      new THREE.MeshStandardMaterial({ roughness: 0.95 }), PEBBLE_N);
    pebbles.receiveShadow = true;
    {
      const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(),
        p = new THREE.Vector3(), e = new THREE.Euler(), cA = col('#8f867c'), cB = col('#b8a992');
      let placed = 0, guard = 120000;
      while (placed < PEBBLE_N && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 2.4, z = (rng() - 0.5) * ISLAND_R * 2.4;
        const h = groundHeight(x, z);
        if (h < -0.05 || h > 0.35) continue;
        q.setFromEuler(e.set(rng() * 3, rng() * 3, rng() * 3));
        const k = 0.5 + rng() * 1.3;
        m.compose(p.set(x, h + 0.015, z), q, s.set(k, k * 0.55, k));
        pebbles.setMatrixAt(placed, m);
        pebbles.setColorAt(placed, _c.copy(cA).lerp(cB, rng()));
        placed++;
      }
      pebbles.count = placed;
    }
    island.add(pebbles);

    // Reeds. The brief put these along the inlet banks; the owner's call is a
    // clean sandy cove, so they moved inland to the crown's edge, where they
    // read as dune growth rather than as something standing in the beach.
    // Keeping them at all is worth it for the sway — the palms and the foam
    // were otherwise the only things moving on land.
    const reedClumps = [];
    {
      const cStem = col('#7c9b5a'), cHead = col('#6b4a34');
      let placed = 0, guard = 4000;
      while (placed < 7 && guard-- > 0) {
        const a = rng() * Math.PI * 2, rr = 5.5 + rng() * 3.5;
        const cx = Math.cos(a) * rr, cz = Math.sin(a) * rr;
        const ch = groundHeight(cx, cz);
        if (ch < 1.15 || beachness(cx, cz) > 0.08) continue;
        placed++;
        const gs = [];
        for (let i = 0; i < 7; i++) {
          const ox = (rng() - 0.5) * 0.5, oz = (rng() - 0.5) * 0.5, hh = 0.7 + rng() * 0.45;
          const stem = paint(new THREE.CylinderGeometry(0.012, 0.02, hh, 5),
            (x, y) => _c.copy(cStem).multiplyScalar(0.7 + 0.4 * smooth(-hh / 2, hh / 2, y)));
          stem.translate(ox, hh / 2, oz);
          gs.push(stem.toNonIndexed());
          const head = paint(new THREE.CylinderGeometry(0.028, 0.032, 0.16, 5), cHead);
          head.translate(ox, hh + 0.08, oz);
          gs.push(head.toNonIndexed());
        }
        const clump = new THREE.Group();
        clump.add(new THREE.Mesh(BGU.mergeGeometries(gs), foliage));
        clump.position.set(cx, gy(cx, cz) - 0.02, cz);
        clump.userData.phase = rng() * Math.PI * 2;
        scene.add(clump);
        reedClumps.push(clump);
      }
    }

    // fireflies — dusk only
    const fireflies = (() => {
      const n = 70, base = new Float32Array(n * 3), ph = new Float32Array(n);
      let placed = 0, guard = 9000;
      while (placed < n && guard-- > 0) {
        const x = (rng() - 0.5) * ISLAND_R * 1.4, z = (rng() - 0.5) * ISLAND_R * 1.4;
        if (groundHeight(x, z) < 0.6) continue;
        base[placed * 3] = x; base[placed * 3 + 1] = gy(x, z) + 0.4 + rng() * 1.2; base[placed * 3 + 2] = z;
        ph[placed] = rng() * Math.PI * 2;
        placed++;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
      const o = new THREE.Points(g, new THREE.PointsMaterial({
        color: col('#ffe9a0'), size: 0.05, transparent: true, opacity: 0,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      o.userData = { base, ph, n: placed };
      scene.add(o);
      return o;
    })();

    // ═══ MOODS ═══ one config each — adding a mood stays a five-line job.
    const MOODS = [
      { name: 'GOLDEN HOUR', skyTop: '#6f8fb8', skyHoriz: '#e8a05c', sunCol: '#ffd9a0', sunInt: 2.6,
        sunDir: [0.34, 0.16, 0.93], hemiSky: '#ffd7b0', hemiGround: '#b99c72', hemiInt: 0.55,
        fog: '#e8c49a', fogNear: 20, fogFar: 130, water: '#3aa8a0', waterOp: 0.82,
        cloud: '#ffd2a4', lantern: 0.35, fireflies: 0, neon: 0.55 },
      { name: 'DUSK & FIREFLIES', skyTop: '#141f3a', skyHoriz: '#b06a8c', sunCol: '#ff9a6a', sunInt: 1.0,
        sunDir: [0.3, 0.055, 0.95], hemiSky: '#5a6a9a', hemiGround: '#3a3a4a', hemiInt: 0.46,
        fog: '#3a3a56', fogNear: 14, fogFar: 95, water: '#2b6a74', waterOp: 0.88,
        cloud: '#6b5878', lantern: 1.7, fireflies: 0.85, neon: 1.4 },
      { name: 'BRIGHT MIDDAY', skyTop: '#57a0d8', skyHoriz: '#bfe0ea', sunCol: '#fff6e0', sunInt: 3.1,
        sunDir: [0.25, 0.8, 0.4], hemiSky: '#cfe6ee', hemiGround: '#d8c893', hemiInt: 0.8,
        fog: '#cfe6ee', fogNear: 30, fogFar: 140, water: '#46b8b0', waterOp: 0.78,
        cloud: '#ffffff', lantern: 0, fireflies: 0, neon: 0.3 },
    ];
    const MOOD_NUM = ['sunInt', 'hemiInt', 'fogNear', 'fogFar', 'waterOp', 'lantern', 'fireflies', 'neon'];
    const MOOD_COL = ['skyTop', 'skyHoriz', 'sunCol', 'hemiSky', 'hemiGround', 'fog', 'water', 'cloud'];
    const mkMoodState = () => {
      const o = { sunDir: new THREE.Vector3() };
      for (const k of MOOD_COL) o[k] = new THREE.Color();
      return o;
    };
    const cur = mkMoodState(), from = mkMoodState(), target = mkMoodState();
    const snapshot = (m, into) => {
      for (const k of MOOD_NUM) into[k] = m[k];
      for (const k of MOOD_COL) into[k].copy(typeof m[k] === 'string' ? col(m[k]) : m[k]);
      Array.isArray(m.sunDir) ? into.sunDir.fromArray(m.sunDir).normalize() : into.sunDir.copy(m.sunDir);
    };
    let moodIdx = 0, blend = 1;
    function setMood(i, instant = false) {
      moodIdx = ((i % MOODS.length) + MOODS.length) % MOODS.length;
      snapshot(MOODS[moodIdx], target);
      if (instant) { snapshot(MOODS[moodIdx], cur); blend = 1; }
      else { snapshot(cur, from); blend = 0; }
      const tag = document.getElementById('mood-name');
      tag.textContent = MOODS[moodIdx].name;
      tag.style.opacity = 0.8;
      clearTimeout(setMood._t);
      setMood._t = setTimeout(() => { tag.style.opacity = 0; }, 2200);
      applyMood(true);
      shadowDirty();
      audioStart();
    }
    function applyMood(force = false) {
      if (blend >= 1 && !force) return;
      if (blend < 1) {
        const k = blend * blend * (3 - 2 * blend);
        for (const key of MOOD_NUM) cur[key] = lerp(from[key], target[key], k);
        for (const key of MOOD_COL) cur[key].copy(from[key]).lerp(target[key], k);
        cur.sunDir.copy(from.sunDir).lerp(target.sunDir, k).normalize();
      }
      paintSky(cur.skyTop, cur.skyHoriz, cur.water);
      sun.color.copy(cur.sunCol); sun.intensity = cur.sunInt;
      sun.position.copy(cur.sunDir).multiplyScalar(60);
      hemi.color.copy(cur.hemiSky); hemi.groundColor.copy(cur.hemiGround); hemi.intensity = cur.hemiInt;
      scene.fog.color.copy(cur.fog); scene.fog.near = cur.fogNear; scene.fog.far = cur.fogFar;
      // vertex alpha carries the shore fade; the mood only scales it, so the
      // shallows stay see-through whatever the hour
      waterMat.color.copy(cur.water); waterMat.opacity = cur.waterOp;
      sea.material.color.copy(cur.water);
      for (const l of lanternLights) { l.intensity = cur.lantern * 1.6; l.visible = cur.lantern > 0.02; }
      lanternGlassMat.emissiveIntensity = cur.lantern * 1.4;
      fireflies.material.opacity = cur.fireflies;
      for (const m of cloudMats) m.color.copy(cur.cloud);
      // the far islands sit IN the haze rather than in front of it
      for (const m of farIsles) m.color.copy(cur.fog).multiplyScalar(0.72);
      sunDisc.material.color.copy(cur.sunCol);
      sunHalo.material.color.copy(cur.skyHoriz);
      sunDisc.position.copy(cur.sunDir).multiplyScalar(150);
      sunDisc.lookAt(0, 0, 0);
      sunHalo.position.copy(cur.sunDir).multiplyScalar(152);
      sunHalo.lookAt(0, 0, 0);
    }

    // ═══ AUDIO — procedural surf; the radio is its own little machine ═══
    let AC = null;
    const SURF_HZ = 0.065;
    function audioStart() {
      if (AC) return;
      AC = listener.context;
      if (AC.state === 'suspended') AC.resume().catch(() => {});
      const master = AC.createGain(); master.gain.value = 0.5;
      master.connect(AC.destination);
      // one brown-noise loop feeds both layers
      const len = AC.sampleRate * 6, buf = AC.createBuffer(1, len, AC.sampleRate);
      const d = buf.getChannelData(0);
      let b = 0;
      for (let i = 0; i < len; i++) { b += (Math.random() * 2 - 1) * 0.02; b *= 0.995; d[i] = b * 3.5; }
      const mk = (type, freq, base, depth, lfoHz) => {
        const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
        const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
        const g = AC.createGain(); g.gain.value = base;
        const lfo = AC.createOscillator(); lfo.frequency.value = lfoHz;
        const lg = AC.createGain(); lg.gain.value = depth;
        lfo.connect(lg); lg.connect(g.gain);
        src.connect(f); f.connect(g); g.connect(master);
        src.start(); lfo.start();
      };
      mk('lowpass', 380, 0.5, 0.3, SURF_HZ);          // the deep wash
      mk('highpass', 900, 0.1, 0.07, 0.052);          // the hiss riding it
      surfMaster = master;
    }
    let surfMaster = null;
    // one wave, louder than the rest — the island noticing you
    function surfSwell() {
      if (!surfMaster) return;
      const g = surfMaster.gain, t0 = AC.currentTime;
      g.cancelScheduledValues(t0);
      g.setTargetAtTime(0.8, t0, 0.6);
      g.setTargetAtTime(0.5, t0 + 2.2, 1.2);
    }
    // two soft notes, for moments that deserve a sound and no text
    function chime(f1 = 523.25, f2 = 659.25) {
      audioStart();
      if (!AC) return;
      const t0 = AC.currentTime;
      for (const [f, at] of [[f1, 0], [f2, 0.22]]) {
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + at);
        g.gain.linearRampToValueAtTime(0.08, t0 + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 1.4);
        o.connect(g); g.connect(surfMaster ?? AC.destination);
        o.start(t0 + at); o.stop(t0 + at + 1.5);
      }
    }

    // ── the radio ────────────────────────────────────────────────────────
    // Press it and it works, whatever is or is not in audio/: a real record
    // if one is there, its own synth bed if not. Everything is PositionalAudio
    // on the radio mesh, so it fades as you walk down to the water.
    const PLAYLIST = [
      ...TRACKS,
      ...(RADIO_TRACK_URL ? [{ file: RADIO_TRACK_URL, title: '', artist: '', year: '', source: '', note: '' }] : []),
    ];
    let radioOn = false, radioNodes = null, radioAudio = null, trackIdx = -1;
    const buffers = new Map();       // file → AudioBuffer, or null once it has failed

    function radioStopAll() {
      if (radioAudio) { try { radioAudio.stop(); } catch (e) {} radio.remove(radioAudio); radioAudio = null; }
      if (radioNodes) {
        radioNodes.stops.forEach(o => { try { o.stop(); } catch (e) {} });
        radio.remove(radioNodes.pa);
        radioNodes = null;
      }
      showPlaque(null);
    }

    // the synth bed: a soft add9 chord under a slow tremolo, warm-filtered
    function playBed() {
      const pa = new THREE.PositionalAudio(listener);
      pa.setRefDistance(1.1);
      radio.add(pa);
      const mix = AC.createGain(); mix.gain.value = 0.16;
      const stops = [];
      for (const [f2, g2] of [[110, 0.5], [138.6, 0.32], [164.8, 0.4], [246.9, 0.14]]) {
        const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f2;
        o.detune.value = (Math.random() - 0.5) * 8;
        const og = AC.createGain(); og.gain.value = g2;
        o.connect(og); og.connect(mix); o.start();
        stops.push(o);
      }
      const trem = AC.createOscillator(); trem.frequency.value = 0.9;
      const tg = AC.createGain(); tg.gain.value = 0.05;
      trem.connect(tg); tg.connect(mix.gain); trem.start();
      stops.push(trem);
      const lp = AC.createBiquadFilter(); lp.frequency.value = 900;
      mix.connect(lp);
      pa.setNodeSource(lp);
      radioNodes = { pa, stops };
      showPlaque({ title: 'the radio, playing itself', artist: '', year: '', source: '', note: '' });
    }

    function playTrack(track) {
      const a = new THREE.PositionalAudio(listener);
      a.setRefDistance(1.1);
      // a little top taken off, so a 78 sits in the air rather than on top of it
      radio.add(a);
      radioAudio = a;
      const start = buf => {
        if (!radioOn || radioAudio !== a) return;
        a.setBuffer(buf);
        a.setLoop(true);
        a.setVolume(0.85);
        a.play();
        showPlaque(track);
      };
      if (buffers.has(track.file)) {
        const b = buffers.get(track.file);
        if (b) start(b); else { radio.remove(a); radioAudio = null; playBed(); }
        return;
      }
      // A 78 is three minutes of audio and takes a beat to fetch and decode.
      // Say so: a button that appears to do nothing for three seconds is a
      // button people press again.
      showPlaque({ title: 'tuning…', artist: track.artist, year: '', source: '', note: '' });
      new THREE.AudioLoader().load(track.file,
        b => { buffers.set(track.file, b); start(b); },
        undefined,
        () => {                       // no such file — say nothing, play the bed
          buffers.set(track.file, null);
          if (radioAudio === a) { radio.remove(a); radioAudio = null; }
          if (radioOn) playBed();
        });
    }

    function radioToggle() {
      audioStart();
      if (!AC) return;
      // off → each track in turn → the bed → off
      if (!radioOn) { radioOn = true; trackIdx = 0; }
      else trackIdx += 1;
      radioStopAll();
      if (trackIdx < PLAYLIST.length) playTrack(PLAYLIST[trackIdx]);
      else if (trackIdx === PLAYLIST.length) playBed();
      else { radioOn = false; trackIdx = -1; }
    }

    // ── the credit plaque ──
    // A record that plays unattributed is a record somebody has to go looking
    // for. It hangs over the radio while something is playing and goes when
    // the radio does.
    const plaque = new THREE.Mesh(
      new THREE.PlaneGeometry(0.44, 0.15),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    plaque.visible = false;
    scene.add(plaque);
    function showPlaque(track) {
      if (!track) { plaque.visible = false; plaque.material.opacity = 0; return; }
      plaque.material.opacity = 0;   // each card fades up on its own
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 174;
      const g = cv.getContext('2d');
      g.clearRect(0, 0, 512, 174);
      g.fillStyle = 'rgba(12,16,20,0.72)';
      g.beginPath(); g.roundRect(0, 0, 512, 174, 14); g.fill();
      g.textAlign = 'center';
      g.fillStyle = '#f2e9d8';
      g.font = 'bold 40px ui-monospace, Menlo, Consolas, monospace';
      g.fillText(track.title.toUpperCase().slice(0, 26), 256, 62);
      if (track.artist) {
        g.fillStyle = '#3aa8a0';
        g.font = '30px ui-monospace, Menlo, Consolas, monospace';
        g.fillText(track.artist.toUpperCase(), 256, 104);
      }
      const foot = [track.year, track.note, track.source].filter(Boolean).join(' · ');
      if (foot) {
        g.fillStyle = 'rgba(242,233,216,0.62)';
        // the credit is the point of the card — shrink it to fit rather than
        // letting the source clip, which is exactly the half that matters
        let px = 22;
        do {
          g.font = `${px}px ui-monospace, Menlo, Consolas, monospace`;
          px -= 1;
        } while (px > 11 && g.measureText(foot).width > 480);
        g.fillText(foot, 256, 142);
      }
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      plaque.material.map?.dispose();
      plaque.material.map = tx;
      plaque.material.needsUpdate = true;
      plaque.visible = true;
    }

    // ═══ XR — teleport, totem, radio, the way back to the chair ═══
    document.body.appendChild(XRButton.createButton(renderer, {
      // hand-tracking for Quest hands; Vision Pro's gaze + pinch arrives as
      // transient-pointer input sources and needs nothing declared
      optionalFeatures: ['local-floor', 'hand-tracking'],
    }));
    let baseRef = null;
    renderer.xr.addEventListener('sessionstart', () => {
      baseRef = renderer.xr.getReferenceSpace();
      audioStart();
      shadowDirty();
    });

    const raycaster = new THREE.Raycaster();
    const marker = new THREE.Group();
    {
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.3, 24),
        new THREE.MeshBasicMaterial({ color: col(P.teal), transparent: true, opacity: 0.85, depthWrite: false }));
      ring.rotation.x = -Math.PI / 2;
      const dot = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16),
        new THREE.MeshBasicMaterial({ color: col(P.cream), transparent: true, opacity: 0.55, depthWrite: false }));
      dot.rotation.x = -Math.PI / 2;
      dot.position.y = 0.005;
      marker.add(ring, dot);
      marker.visible = false;
      scene.add(marker);
    }
    const rayTargets = [terrain, totem, radio, chairHit, book, sign];
    const controllers = [];
    for (let i = 0; i < 2; i++) {
      const c = renderer.xr.getController(i);
      c.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, -6)]),
        new THREE.LineBasicMaterial({ color: col(P.teal), transparent: true, opacity: 0.4 })));
      c.userData.hit = null;
      c.addEventListener('selectstart', () => { c.userData.downAt = performance.now(); });
      c.addEventListener('selectend', () =>
        actOn(c.userData.hit, performance.now() - (c.userData.downAt ?? performance.now())));
      scene.add(c);
      controllers.push(c);
    }
    // ── the same two sticks, on the controllers ──
    // Twin-stick in the headset too: the left thumbstick glides you along the
    // sand, the right one turns in SNAPS rather than smoothly, because smooth
    // yaw is the single most reliable way to make somebody queasy in a chair.
    // The teleport ray stays — one is for crossing the island, the other for
    // shifting a step, and a zen island should not force a choice.
    let snapCool = 0;
    const _xrFwd = new THREE.Vector3();
    function xrSticks(dt) {
      snapCool = Math.max(0, snapCool - dt);
      const session = renderer.xr.getSession?.();
      if (!session || !baseRef) return;
      let mx = 0, my = 0, turn = 0;
      for (const src of session.inputSources) {
        const ax = src.gamepad?.axes;
        if (!ax || ax.length < 4) continue;
        // xr-standard puts the thumbstick on axes 2/3; some runtimes use 0/1
        const sx = Math.abs(ax[2]) > 0.15 ? ax[2] : (Math.abs(ax[0]) > 0.15 ? ax[0] : 0);
        const sy = Math.abs(ax[3]) > 0.15 ? ax[3] : (Math.abs(ax[1]) > 0.15 ? ax[1] : 0);
        if (src.handedness === 'right') turn += sx;
        else { mx += sx; my += sy; }
      }
      if (turn && snapCool <= 0) { xrYaw -= Math.sign(turn) * Math.PI / 6; snapCool = 0.32; }
      if (mx || my) {
        // move relative to where the head is actually looking
        renderer.xr.getCamera().getWorldDirection(_xrFwd);
        _xrFwd.y = 0;
        if (_xrFwd.lengthSq() < 1e-4) return;
        _xrFwd.normalize();
        const rx = _xrFwd.z, rz = -_xrFwd.x;              // right = forward × up
        const v = 1.9 * dt;
        const nx = xrPos.x + (_xrFwd.x * -my + rx * mx) * v;
        const nz = xrPos.z + (_xrFwd.z * -my + rz * mx) * v;
        if (groundHeight(nx, nz) > -0.05 && Math.hypot(nx, nz) < ISLAND_R * 1.05) {
          xrPos.x = nx; xrPos.z = nz;
        }
      }
      applyXrOffset();
    }
    // the offset reference space every locomotion path writes through
    let xrYaw = 0;
    const xrPos = new THREE.Vector3();
    function applyXrOffset() {
      if (!baseRef) return;
      const h = Math.sin(-xrYaw / 2), w = Math.cos(-xrYaw / 2);
      renderer.xr.setReferenceSpace(baseRef.getOffsetReferenceSpace(
        new XRRigidTransform(
          { x: -xrPos.x, y: -xrPos.y, z: -xrPos.z },
          { x: 0, y: h, z: 0, w })));
    }

    const _m4 = new THREE.Matrix4();
    function castFrom(c) {
      _m4.identity().extractRotation(c.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
      raycaster.ray.direction.set(0, 0, -1).applyMatrix4(_m4);
      return raycaster.intersectObjects(rayTargets, true)[0] || null;
    }
    function ownerOf(obj) {
      for (let o = obj; o; o = o.parent) {
        if (o === totem) return 'totem';
        if (o === radio) return 'radio';
        if (o === book) return 'book';
        if (o === sign) return 'sign';
        if (o === chairHit) return 'chair';
        if (o === terrain) return 'ground';
      }
      return null;
    }
    function actOn(hit, heldMs = 0) {
      if (!hit) return;
      const kind = ownerOf(hit.object);
      if (kind === 'totem') return setMood(moodIdx + 1);
      if (kind === 'radio') return radioToggle();
      if (kind === 'book') return bookAct();
      if (kind === 'sign') return goHome();
      if (kind === 'chair') {
        // A LONG pinch on the chair recalibrates the seat from where your
        // head is right now — the whole calibration path on Vision Pro,
        // where Safari has no immersive-ar for chair-lab and no squeeze to
        // hang anything on. A short one sits you back down: the offset goes
        // to zero and the calibration is true again.
        if (heldMs > 1200) return calibrateFromHead();
        xrPos.set(0, 0, 0); xrYaw = 0;
        applyXrOffset();
        return;
      }
      if (kind === 'ground' && baseRef) {
        const p = hit.point;
        // the teleport clamp asks the same function everything else asks
        if (groundHeight(p.x, p.z) < -0.05) return;
        if (Math.hypot(p.x, p.z) > ISLAND_R * 1.05) return;
        // written through the same offset the sticks use, so the two ways of
        // moving cannot disagree about where you are standing
        xrPos.set(p.x, p.y, p.z);
        applyXrOffset();
      }
    }

    // ── sitting ─────────────────────────────────────────────────────────
    // The headline feature is a real sit, so the island should notice one:
    // head inside the seat band for a moment → one louder wave and a low
    // chime. Nothing is gated on it — it is an acknowledgement, not a menu.
    let seated = false, sitT = 0, calibrateQueued = false;
    const _headV = new THREE.Vector3(), _headD = new THREE.Vector3();
    const sitCheck = (x, y, z) =>
      Math.hypot(x - chairP[0], z - chairP[2]) < 0.65
      && y > chairP[1] + 0.12 && y < chairP[1] + 0.8;
    function sitUpdate(dt) {
      const xcam = renderer.xr.getCamera();
      _headV.setFromMatrixPosition(xcam.matrixWorld);
      if (calibrateQueued) { calibrateQueued = false; saveSeatFromHead(xcam); }
      if (sitCheck(_headV.x, _headV.y, _headV.z)) {
        sitT += dt;
        if (!seated && sitT > 0.8) { seated = true; chime(392, 523.25); surfSwell(); }
      } else {
        sitT = 0;
        if (seated && _headV.y > chairP[1] + 0.95) seated = false;
      }
    }
    function calibrateFromHead() {
      if (!renderer.xr.isPresenting) return;
      // back to base space first, so the head is read in the same
      // local-floor coordinates the calibration keys are defined in —
      // a saved seat measured through a walked offset would be wrong by
      // however far you had wandered
      xrPos.set(0, 0, 0); xrYaw = 0;
      applyXrOffset();
      calibrateQueued = true;   // read it NEXT frame, after the space settles
    }
    function saveSeatFromHead(xcam) {
      xcam.getWorldDirection(_headD);
      _headD.y = 0; _headD.normalize();
      const yaw = Math.atan2(_headD.x, _headD.z);
      const p = [_headV.x - _headD.x * 0.08,
        Math.min(0.8, Math.max(0.3, _headV.y - 0.28)),
        _headV.z - _headD.z * 0.08];
      try {
        localStorage.setItem('tokoTrip.chairPoseFallback', JSON.stringify({ p, yaw }));
        localStorage.setItem('tokoTrip.chairYaw', String(yaw));
      } catch (e) { /* no storage — nothing to save into */ }
      chairP = p; chairYaw = yaw;   // reported now; the nook rebuilds next visit
      chime(523.25, 783.99);
      const tag = document.getElementById('mood-name');
      tag.textContent = 'CHAIR SAVED — THE NEXT VISIT BUILDS AROUND IT';
      tag.style.opacity = 0.8;
      setTimeout(() => { tag.style.opacity = 0; }, 3000);
    }

    // ═══ TWIN STICKS ═══ The flat controls, on every flat screen — phone,
    // tablet and desktop alike. Left half walks, right half looks. They are
    // DRAWN ALWAYS rather than summoned by a first touch, because a control
    // you cannot see is a control a visitor has to be told about, and this is
    // a thing people open once out of curiosity.
    //
    // A stick is born wherever the finger lands inside its half, so nothing
    // depends on hitting a fixed circle, and a short press that barely moves
    // is a TAP — which is how you use the totem, the book, the radio and the
    // sign without a second set of buttons.
    // Camera forward for yaw θ is (−sin θ, −cos θ); the start is behind the
    // chair, looking over it down the cove.
    let yaw = chairYaw + Math.PI, pitch = -0.06;
    const eye = new THREE.Vector3(
      chairP[0] - Math.sin(chairYaw) * 2.4, 0, chairP[2] - Math.cos(chairYaw) * 2.4);
    eye.y = gy(eye.x, eye.z) + 1.5;

    const uiCv = document.getElementById('ui');
    const uiCtx = uiCv.getContext('2d');
    const R_STICK = 62, R_KNOB = 26, TAP_MS = 260, TAP_PX = 14;
    // one entry per live finger; `side` decides what it drives
    const sticks = new Map();
    const stickVec = side => {
      for (const s of sticks.values()) if (s.side === side) return s;
      return null;
    };
    const homeFor = side => ({
      x: side === 'move' ? Math.min(140, innerWidth * 0.18) : innerWidth - Math.min(140, innerWidth * 0.18),
      y: innerHeight - Math.min(150, innerHeight * 0.24),
    });

    renderer.domElement.addEventListener('pointerdown', e => {
      audioStart();
      if (renderer.xr.isPresenting) return;
      const side = e.clientX < innerWidth / 2 ? 'move' : 'look';
      if (stickVec(side)) return;                    // one finger per half
      sticks.set(e.pointerId, {
        side, ox: e.clientX, oy: e.clientY, x: e.clientX, y: e.clientY,
        t0: performance.now(), moved: 0,
      });
      renderer.domElement.setPointerCapture?.(e.pointerId);
    });
    addEventListener('pointermove', e => {
      const s = sticks.get(e.pointerId);
      if (!s) return;
      s.moved = Math.max(s.moved, Math.hypot(e.clientX - s.ox, e.clientY - s.oy));
      s.x = e.clientX; s.y = e.clientY;
    });
    const liftPointer = e => {
      const s = sticks.get(e.pointerId);
      if (!s) return;
      sticks.delete(e.pointerId);
      // a short press that barely moved is a tap on the world, not a stick
      if (performance.now() - s.t0 < TAP_MS && s.moved < TAP_PX && !renderer.xr.isPresenting) {
        raycaster.setFromCamera(new THREE.Vector2(
          (s.ox / innerWidth) * 2 - 1, -(s.oy / innerHeight) * 2 + 1), camera);
        const hit = raycaster.intersectObjects([totem, radio, book, sign], true)[0];
        if (hit) actOn(hit);
      }
    };
    addEventListener('pointerup', liftPointer);
    addEventListener('pointercancel', liftPointer);

    // the deflection of a stick, as a unit-ish vector with a dead zone
    function stickAxes(side) {
      const s = stickVec(side);
      if (!s) return [0, 0];
      let dx = s.x - s.ox, dy = s.y - s.oy;
      const len = Math.hypot(dx, dy);
      if (len < 8) return [0, 0];
      const k = Math.min(1, len / R_STICK) / len;
      return [dx * k, dy * k];
    }

    function drawSticks() {
      const dpr = Math.min(2, devicePixelRatio);
      if (uiCv.width !== innerWidth * dpr || uiCv.height !== innerHeight * dpr) {
        uiCv.width = innerWidth * dpr; uiCv.height = innerHeight * dpr;
        uiCv.style.width = `${innerWidth}px`; uiCv.style.height = `${innerHeight}px`;
      }
      uiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      uiCtx.clearRect(0, 0, innerWidth, innerHeight);
      if (renderer.xr.isPresenting) return;           // the headset has real sticks
      for (const side of ['move', 'look']) {
        const s = stickVec(side);
        const base = s ? { x: s.ox, y: s.oy } : homeFor(side);
        let kx = 0, ky = 0;
        if (s) {
          const dx = s.x - s.ox, dy = s.y - s.oy, len = Math.hypot(dx, dy) || 1;
          const c = Math.min(R_STICK, len) / len;
          kx = dx * c; ky = dy * c;
        }
        uiCtx.lineWidth = 2;
        uiCtx.strokeStyle = 'rgba(242,233,216,0.30)';
        uiCtx.beginPath(); uiCtx.arc(base.x, base.y, R_STICK, 0, Math.PI * 2); uiCtx.stroke();
        uiCtx.fillStyle = s ? 'rgba(58,168,160,0.55)' : 'rgba(242,233,216,0.18)';
        uiCtx.beginPath(); uiCtx.arc(base.x + kx, base.y + ky, R_KNOB, 0, Math.PI * 2); uiCtx.fill();
        uiCtx.strokeStyle = 'rgba(242,233,216,0.45)';
        uiCtx.beginPath(); uiCtx.arc(base.x + kx, base.y + ky, R_KNOB, 0, Math.PI * 2); uiCtx.stroke();
        if (!s) {                                     // name it while it is idle
          uiCtx.fillStyle = 'rgba(242,233,216,0.5)';
          uiCtx.font = '11px ui-monospace, Menlo, Consolas, monospace';
          uiCtx.textAlign = 'center';
          uiCtx.fillText(side === 'move' ? 'WALK' : 'LOOK', base.x, base.y + R_STICK + 18);
        }
      }
    }

    // keys stay as a courtesy for anyone at a desk who reaches for them
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyM') setMood(moodIdx + 1);
      audioStart();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ═══ THE LOOP ═══
    const clock = new THREE.Clock();
    const neonFlick = { until: 0, dim: 1 };
    const _plaqueV = new THREE.Vector3();
    function animate() {
      const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;

      if (blend < 1) { blend = Math.min(1, blend + dt / 2.5); applyMood(); shadowDirty(); }

      if (!renderer.xr.isPresenting) {
        // ── twin sticks, plus the keys for anyone who reaches for them ──
        const [mx, my] = stickAxes('move');
        const [lx2, ly2] = stickAxes('look');
        yaw -= lx2 * 2.2 * dt;
        pitch = Math.min(1.2, Math.max(-1.2, pitch - ly2 * 1.6 * dt));
        const f = -my + (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
        const s2 = mx + (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
        if (f || s2) {
          const v = 2.6 * dt;
          const nx = eye.x + (-Math.sin(yaw) * f + Math.cos(yaw) * s2) * v;
          const nz = eye.z + (-Math.cos(yaw) * f - Math.sin(yaw) * s2) * v;
          // walking asks the same function the teleport does, so the sea
          // refuses a stick exactly the way it refuses a ray
          if (groundHeight(nx, nz) > -0.02 && Math.hypot(nx, nz) < ISLAND_R * 1.05) {
            eye.x = nx; eye.z = nz;
          }
        }
        eye.y += ((gy(eye.x, eye.z) + 1.5) - eye.y) * Math.min(1, dt * 8);
        camera.position.copy(eye);
        camera.rotation.set(0, 0, 0);
        camera.rotateY(yaw);
        camera.rotateX(pitch);
      } else {
        xrSticks(dt);
        sitUpdate(dt);
        // controller rays + the teleport marker
        marker.visible = false;
        for (const c of controllers) {
          const hit = castFrom(c);
          c.userData.hit = hit;
          if (hit && ownerOf(hit.object) === 'ground'
            && groundHeight(hit.point.x, hit.point.z) >= -0.05) {
            marker.position.copy(hit.point);
            marker.position.y += 0.02;
            marker.visible = true;
          }
        }
      }

      // idle motion — the half of the art budget that actually earns presence
      for (const [cloud, ph] of [[foamA, 0], [foamB, Math.PI * 0.7]]) {
        const k = Math.sin(t * Math.PI * 2 * SURF_HZ + ph) * 0.5 + 0.5;
        cloud.material.opacity = 0.34 + 0.28 * k;
        cloud.material.size = 0.045 + 0.02 * k;
      }
      water.position.y = -PAD_H + Math.sin(t * 0.4) * 0.015;
      sea.position.y = water.position.y - 0.02;
      waterMat.map.offset.set(t * 0.0035, t * 0.0022);
      waterMat.bumpMap.offset.set(-t * 0.005, t * 0.0031);
      for (const c of crowns) {
        c.rotation.z = Math.sin(t * 0.6 + c.userData.phase) * 0.035;
        c.rotation.x = Math.cos(t * 0.47 + c.userData.phase) * 0.028;
      }
      for (const r of reedClumps) r.rotation.z = Math.sin(t * 0.9 + r.userData.phase) * 0.05;
      clouds.rotation.y = t * 0.0045;
      for (const b of birds) {
        const d = b.userData, a = t * d.sp + d.ph;
        b.position.set(Math.cos(a) * d.r, d.y + Math.sin(t * 0.3 + d.ph) * 0.6, Math.sin(a) * d.r);
        b.rotation.y = -a + Math.PI / 2;
        // one sine is a whole wingbeat, and it is the only thing that makes
        // three triangles read as a bird rather than as a speck
        b.children[0].rotation.z = Math.sin(t * 5 + d.ph) * 0.5;
        b.children[1].rotation.z = -Math.sin(t * 5 + d.ph) * 0.5;
      }
      // the credit hangs over the radio and turns to face whoever is reading it
      if (plaque.visible) {
        plaque.position.set(radio.position.x, radio.position.y + 0.34, radio.position.z);
        plaque.position.y += Math.sin(t * 0.9) * 0.004;
        plaque.lookAt(camera.getWorldPosition(_plaqueV));
        plaque.material.opacity = Math.min(0.92, plaque.material.opacity + dt * 1.6);
      }
      // the book rises to reading height when open and settles when shut —
      // the same spot either way, so it is never somewhere you did not leave it
      bookSpread += ((bookOpen ? 1 : 0) - bookSpread) * Math.min(1, dt * 4.5);
      if (bookSpread > 0.001) {
        // reading height is BELOW a seated eye (~seat + 0.28) — a book held
        // in the lap, not one hovering in front of your face
        book.position.y = 0.075 + bookSpread * (chairP[1] + 0.2 - 0.075);
        book.position.x = bookRest.x + (bookRead.x - bookRest.x) * bookSpread;
        book.position.z = bookRest.z + (bookRead.z - bookRest.z) * bookSpread;
        book.rotation.set(-bookSpread * 0.5, NOOK_YAW + 0.4 * (1 - bookSpread), 0);
        book.position.y += Math.sin(t * 0.8) * 0.006 * bookSpread;
      } else {
        book.position.set(bookRest.x, 0.075, bookRest.z);
        book.rotation.set(0, NOOK_YAW + 0.4, 0);
      }
      totemCap.rotation.y = t * 0.6;
      totemCapMat.emissiveIntensity = 0.55 + 0.3 * Math.sin(t * 2.1);
      // neon: mostly on, with honest dropouts
      if (neonFlick.until < t) {
        if (Math.random() < 0.008) {
          neonFlick.until = t + 0.06 + Math.random() * 0.12;
          neonFlick.dim = 0.15 + Math.random() * 0.3;
        } else neonFlick.dim = 1;
      }
      const neonK = cur.neon * (neonFlick.until > t ? neonFlick.dim : 1);
      neonMat.color.copy(C_NEON).multiplyScalar(0.4 + neonK);
      neonLight.intensity = neonK * 3.2;
      neonLight.visible = neonK > 0.05;
      if (fireflies.material.opacity > 0.01) {
        const { base, ph, n } = fireflies.userData;
        const pp = fireflies.geometry.attributes.position;
        for (let i = 0; i < n; i++) {
          pp.setXYZ(i,
            base[i * 3] + Math.sin(t * 0.5 + ph[i]) * 0.35,
            base[i * 3 + 1] + Math.sin(t * 0.8 + ph[i] * 2) * 0.2,
            base[i * 3 + 2] + Math.cos(t * 0.4 + ph[i]) * 0.35);
        }
        pp.needsUpdate = true;
      }

      drawSticks();
      renderer.render(scene, camera);
    }

    setMood(0, true);
    (renderer.init ? renderer.init() : Promise.resolve())
      .then(() => { shadowDirty(); renderer.setAnimationLoop(animate); });

    // the smoke test drives game state, not the wall clock
    window.__tt = {
      scene, renderer, camera, groundHeight, setMood,
      get mood() { return moodIdx; },
      get chair() { return { p: chairP, yaw: chairYaw }; },
      occluders, MOODS, TIER,
      debug: {
        radioToggle, actOn, rayTargets, sitCheck, bookAct, PLAYLIST,
        radio: () => ({ on: radioOn, track: trackIdx, plaque: plaque.visible }),
        sign, goHome,
        // stand somewhere and face something — the flat camera, for the gate
        stand: (x, z, ry, p = -0.15) => {
          eye.set(x, gy(x, z) + 1.5, z); yaw = ry; pitch = p;
        },
        book: () => ({ open: bookOpen, page: bookPage, pages: PAGES.length }),
        seated: () => seated,
        canTeleport: (x, z) => groundHeight(x, z) >= -0.05 && Math.hypot(x, z) <= ISLAND_R * 1.05,
      },
    };
  </script>
  <script type="module" src="../hub/shell.js?v=18"></script>
</body>
</html>
