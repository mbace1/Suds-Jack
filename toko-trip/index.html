    }
    const book = new THREE.Group();
    const bookPages = { L: null, R: null };
    let bookOpen = false, bookSpread = 0;   // 0 = closed on the deck
    // shut: on the planks to the left of the chair. open: held in front of it.
    const [bookRestX, bookRestZ] = nook(-0.55, -0.6);
    const [bookReadX, bookReadZ] = nook(0, -0.46);
    const bookRest = { x: bookRestX, z: bookRestZ };
    const bookRead = { x: bookReadX, z: bookReadZ };
    {
      const cover = new THREE.Mesh(paint(box(0.19, 0.032, 0.26), col('#8a3a2e')), satin);
      const leaves = new THREE.Mesh(paint(box(0.175, 0.028, 0.245), col('#e4d9bd')), satin);
      leaves.position.y = 0.004;
      const band = new THREE.Mesh(paint(box(0.02, 0.033, 0.26), col(P.sunset)), satin);
      band.position.set(-0.07, 0.001, 0);
      book.add(cover, leaves, band);
      // the open spread, hidden until the book is opened
      const pageGeo = new THREE.PlaneGeometry(0.22, 0.28);
      for (const side of ['L', 'R']) {
        // a page carries its own faint light: a book you cannot read at dusk
        // is a prop, and the alternative is a lamp that would relight the nook
        const m = new THREE.Mesh(pageGeo, new THREE.MeshStandardMaterial({
          roughness: 0.95, side: THREE.DoubleSide,
          emissive: 0xffffff, emissiveIntensity: 0.34,
        }));
        m.position.x = side === 'L' ? -0.113 : 0.113;
        m.rotation.set(-Math.PI / 2 + 0.22, 0, side === 'L' ? 0.06 : -0.06);
        m.visible = false;
        bookPages[side] = m;
        book.add(m);
      }
      book.traverse(o => { if (o.isMesh) o.castShadow = true; });
      book.position.set(bookRest.x, 0.075, bookRest.z);
      book.rotation.y = NOOK_YAW + 0.4;
      scene.add(book);
    }
    let bookPage = 0;
    function paintSpread() {
      for (const side of ['L', 'R']) {
        const idx = side === 'L' ? bookPage : bookPage + 1;
        if (!bookPages[side]) continue;
        const mat = bookPages[side].material;
        mat.map?.dispose();
        mat.map = pageTexture(PAGES[idx] ?? [], side === 'R');
        mat.needsUpdate = true;
      }
    }
    function bookAct() {
      audioStart();
      if (!bookOpen) {                       // open it, in front of the chair
        bookOpen = true; bookPage = 0;
        paintSpread();
        bookPages.L.visible = bookPages.R.visible = true;
        chime(349.23, 440);
        return;
      }
      bookPage += 2;
      if (bookPage >= PAGES.length) {        // read out — shut it and set it down
        bookOpen = false; bookPage = 0;
        bookPages.L.visible = bookPages.R.visible = false;
        chime(440, 349.23);
        return;
      }
      paintSpread();
      chime(392, 466.16);
    }

    // the radio — its own mesh: it is a ray target and the audio anchor
    const radio = new THREE.Group();
    {
      const body = new THREE.Mesh(paint(box(0.3, 0.17, 0.1), col('#8a4a3a')), satin);
      const grille = new THREE.Mesh(paint(box(0.16, 0.11, 0.012), col(P.cream)), satin);
      grille.position.set(-0.045, 0, 0.055);
      const dial = new THREE.Mesh(paint(new THREE.CylinderGeometry(0.03, 0.03, 0.015, 8), col(P.sunset)), satin);
      dial.rotation.x = Math.PI / 2; dial.position.set(0.09, 0.02, 0.055);
      const ant = new THREE.Mesh(paint(new THREE.CylinderGeometry(0.004, 0.004, 0.3, 5), col('#555550')), satin);
      ant.position.set(0.12, 0.22, -0.02); ant.rotation.z = -0.35;
      radio.add(body, grille, dial, ant);
      // on the side table, in world space
      radio.traverse(o => { if (o.isMesh) o.castShadow = true; });
      const [rx, rz] = nook(0.62, -0.05);
      radio.position.set(rx, 0.7, rz);
      radio.rotation.y = NOOK_YAW + 0.5;
      scene.add(radio);
    }

    // ═══ THE SLATE ═══ a board leaning against the chair, and the only menu
    // on the island. Four rows, tapped to cycle: the top one turns the frame
    // cost on, the other three are the comfort dials. It is a real object
    // standing in the sand rather than a panel floating in front of your
    // face, because a rectangle hanging in the air is the one thing a room
    // built to be sat in cannot have. Rows are read off the hit's UV, so the
    // whole menu is ONE mesh and adding a row is a line of painting.
    const SLATE_ROWS = 6;
    const slate = new THREE.Group();
    const slateFace = new THREE.Mesh(
      new THREE.PlaneGeometry(0.34, 0.3),
      new THREE.MeshBasicMaterial({ transparent: true, toneMapped: false }));
    {
      const backing = new THREE.Mesh(paint(box(0.38, 0.34, 0.02), col(P.driftwood)), satin);
      backing.castShadow = true;
      slateFace.position.z = 0.013;
      slate.add(backing, slateFace);
      const [sx, sz] = nook(-0.5, -0.12);
      slate.position.set(sx, gy(sx, sz) + 0.19, sz);
      // nook() maps local→world through a rotation by MINUS the nook yaw, so a
      // mesh set to NOOK_YAW ends up facing the other way from everything the
      // nook layout implies. The face has to look back at the seat or the only
      // menu on the island reads as a plank.
      slate.rotation.y = NOOK_YAW + Math.PI + 0.35;   // turned toward the seat
      slate.rotateX(-0.26);                           // leaning back on the chair
      scene.add(slate);
    }
    // which row a ray landed on: uv.y is 1 at the top of the face
    const slateRow = hit => (hit && hit.object === slateFace && hit.uv)
      ? Math.min(SLATE_ROWS - 1, Math.max(0, Math.floor((1 - hit.uv.y) * SLATE_ROWS)))
      : -1;
    function slateAct(row) {
      if (row < 0) return;
      if (row === 0) { perfOn = !perfOn; paintPerfEl(); paintSlate(); }
      else if (row === 1) setComfort('speed', comfort.speed + 1);
      else if (row === 2) setComfort('turn', comfort.turn + 1);
      else if (row === 3) setComfort('vig', comfort.vig + 1);
      else if (row === 4) setComfort('sound', comfort.sound + 1);
      else setComfort('time', comfort.time + 1);
      chime(659.25, 784);
    }
    // ── what the slate says ──
    // Repainted when a dial moves, and twice a second while the frame cost is
    // showing. A fresh 384x288 canvas at 2 Hz is nothing; painting it every
    // frame would make the readout the most expensive thing it measures.
    const perfSample = { fps: 0, ms: 0, worst: 0, calls: 0, tris: 0 };
    const backendName = () => (renderer.backend?.isWebGPUBackend ? 'WebGPU'
      : renderer.backend?.isWebGLBackend ? 'WebGL2' : 'GL');
    function paintSlate() {
      const cv = document.createElement('canvas');
      cv.width = 384; cv.height = 360;
      const g = cv.getContext('2d');
      g.fillStyle = 'rgba(16,20,24,0.92)';
      g.beginPath(); g.roundRect(0, 0, 384, 360, 12); g.fill();
      const rowH = 360 / SLATE_ROWS;
      const rows = [
        perfOn
          ? [`${perfSample.fps} fps`, `${perfSample.ms} ms · ${perfSample.calls} draws`]
          : ['COMFORT', 'tap a row'],
        ['GLIDE', SPEEDS[comfort.speed][0]],
        ['TURN', TURNS[comfort.turn][0]],
        ['EDGES', comfort.vig ? 'closing in' : 'open'],
        ['SOUND', comfort.sound ? 'on' : 'off'],
        ['TIME', TIDE_RATES[comfort.time][0]],
      ];
      rows.forEach(([label, value], i) => {
        const y = i * rowH;
        if (i) {
          g.strokeStyle = 'rgba(242,233,216,0.14)';
          g.beginPath(); g.moveTo(16, y); g.lineTo(368, y); g.stroke();
        }
        g.textAlign = 'left';
        g.fillStyle = i === 0 ? '#f2e9d8' : 'rgba(242,233,216,0.62)';
        g.font = `${i === 0 ? 'bold ' : ''}25px ui-monospace, Menlo, Consolas, monospace`;
        g.fillText(label, 20, y + rowH * 0.62);
        g.textAlign = 'right';
        g.fillStyle = i === 0 ? 'rgba(242,233,216,0.5)' : '#3aa8a0';
        let px = 24;
        do {
          g.font = `${px}px ui-monospace, Menlo, Consolas, monospace`;
          px -= 1;
        } while (px > 11 && g.measureText(value).width > 200);
        g.fillText(value, 364, y + rowH * 0.62);
      });
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      slateFace.material.map?.dispose();
      slateFace.material.map = tx;
      slateFace.material.needsUpdate = true;
    }
    // and the same numbers in the corner of a flat screen, for a laptop pass
    const perfEl = document.createElement('div');
    perfEl.id = 'perf';
    perfEl.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:6;'
      + 'font:12px ui-monospace,Menlo,Consolas,monospace;color:#3aa8a0;'
      + 'background:rgba(16,20,24,0.72);padding:6px 9px;border-radius:6px;'
      + 'pointer-events:none;white-space:pre;display:none';
    document.body.appendChild(perfEl);
    function paintPerfEl() {
      perfEl.style.display = perfOn ? 'block' : 'none';
      if (!perfOn) return;
      perfEl.textContent = `${perfSample.fps} fps  ${perfSample.ms} ms (worst ${perfSample.worst})\n`
        + `${perfSample.calls} draws  ${(perfSample.tris / 1000).toFixed(1)}k tris\n`
        + `${backendName()} · ${TIER.name}`;
    }
    paintSlate();

    // ═══ PALMS — leaning segmented trunks, drooping fronds, coconuts ═══
    const crowns = [];   // swayed per frame
    const cLeafD = col(P.leaf), cLeafL = col(P.leafLight);
    for (const spot of palmSpots) {
      const lean = 0.14 + rng() * 0.12, leanDir = spot.lean;
      const segs = 6, segH = 0.62;
      let px = 0, pz = 0, py = groundHeight(spot.x, spot.z), ang = 0;
      for (let i = 0; i < segs; i++) {
        ang += lean / segs * (i + 1);
        const seg = new THREE.CylinderGeometry(0.16 - (i + 1) * 0.013, 0.16 - i * 0.013, segH, 7);
        const tone = i % 2 ? 0.82 : 0.98;
        paint(seg, (x, y) => _c.copy(cWood).multiplyScalar(
          tone * (0.82 + 0.22 * smooth(-segH / 2, segH / 2, y))
          * (i === 0 ? 0.72 + 0.28 * smooth(-segH / 2, 0, y) : 1)));
        seg.applyMatrix4(new THREE.Matrix4().makeRotationAxis(
          new THREE.Vector3(Math.cos(leanDir), 0, -Math.sin(leanDir)), ang));
        seg.translate(spot.x + px, py + Math.cos(ang) * segH / 2, spot.z + pz);
        pile.push(seg);
        px += Math.sin(ang) * segH * Math.sin(leanDir);
        pz += Math.sin(ang) * segH * Math.cos(leanDir);
        py += Math.cos(ang) * segH;
      }
      // ── the crown ──
      // v1–v6 fronds were seven flat planes. Against the sky — which is where
      // a palm lives, in every mood — a flat plane reads as a flat plane. A
      // real frond is a spine with LEAFLETS: a rachis that rises and then
      // droops, and pairs of narrow blades along it, angled forward and down
      // so the outline is a feathered sweep rather than a paddle. Nine live
      // fronds at varying pitch, a couple of dead ones hanging brown below
      // (the single most recognisable thing about a coconut palm), and the
      // nuts in a cluster at the base.
      const crownGeos = [];
      const cDead = col('#8a6b45'), cRachis = col('#6f7a3f');
      function frondGeo(L, up, droop, base, tip, dead) {
        const P = [], N = [], C = [];
        const spine = t => [0, up * t - droop * t * t, L * t];
        const push = (v, n, c) => { P.push(...v); N.push(...n); C.push(c.r, c.g, c.b); };
        const quad = (p0, p1, p2, p3, c0, c1) => {
          // two triangles, one face normal — flat leaflets, hard edges
          const ux = p1[0] - p0[0], uy = p1[1] - p0[1], uz = p1[2] - p0[2];
          const vx = p3[0] - p0[0], vy = p3[1] - p0[1], vz = p3[2] - p0[2];
          let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          const nl = Math.hypot(nx, ny, nz) || 1; nx /= nl; ny /= nl; nz /= nl;
          const n = [nx, ny, nz];
          push(p0, n, c0); push(p1, n, c0); push(p2, n, c1);
          push(p0, n, c0); push(p2, n, c1); push(p3, n, c1);
        };
        // the rachis: a thin ribbon along the curve
        const S = 12;
        for (let i = 0; i < S; i++) {
          const t0 = i / S, t1 = (i + 1) / S, w0 = 0.028 * (1 - t0 * 0.7), w1 = 0.028 * (1 - t1 * 0.7);
          const a0 = spine(t0), a1 = spine(t1);
          quad([a0[0] - w0, a0[1], a0[2]], [a0[0] + w0, a0[1], a0[2]],
            [a1[0] + w1, a1[1], a1[2]], [a1[0] - w1, a1[1], a1[2]], cRachis, cRachis);
        }
        // the leaflets, in pairs
        const n = 15;
        for (let i = 0; i < n; i++) {
          const t = 0.1 + 0.88 * i / (n - 1);
          const a = spine(t), a2 = spine(Math.min(1, t + 0.02));
          // spine tangent, for the forward lean of each leaflet
          let tx = a2[0] - a[0], ty = a2[1] - a[1], tz = a2[2] - a[2];
          const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
          const len = 0.1 + 0.5 * (0.35 + 0.65 * Math.sin(Math.PI * Math.pow(t, 0.85)));
          const jit = 0.85 + 0.3 * hash(i, 41);
          for (const side of [-1, 1]) {
            // out to the side, leaning toward the tip, dropping as it goes
            const dx = side * 0.78, dy = -0.42 - t * 0.25, dz = 0.42;
            const dl = Math.hypot(dx, dy, dz);
            const ex = dx / dl, ey = dy / dl, ez = dz / dl;
            const l = len * jit;
            const wb = 0.05, wt = 0.012;
            // width runs along the spine tangent, so the blade lies flat-ish
            const p0 = [a[0] - tx * wb, a[1] - ty * wb, a[2] - tz * wb];
            const p1 = [a[0] + tx * wb, a[1] + ty * wb, a[2] + tz * wb];
            const p2 = [a[0] + ex * l + tx * wt, a[1] + ey * l + ty * wt, a[2] + ez * l + tz * wt];
            const p3 = [a[0] + ex * l - tx * wt, a[1] + ey * l - ty * wt, a[2] + ez * l - tz * wt];
            const c0 = _c.copy(base).lerp(tip, t * 0.8).multiplyScalar(0.9 + 0.2 * hash(i, 7 + side)).clone();
            const c1 = _c2.copy(c0).multiplyScalar(dead ? 0.85 : 1.12).clone();
            quad(p0, p1, p2, p3, c0, c1);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P), 3));
        g.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(N), 3));
        g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(C), 3));
        g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(P.length / 3 * 2), 2));
        return g;
      }
      const live = 9;
      for (let f = 0; f < live; f++) {
        // pitch varies round the crown: some fronds stand, some lie out flat
        const k = hash(f, 19 + spot.x | 0);
        const L = 2.0 + k * 0.5, up = 0.55 + k * 0.85, droop = 1.15 + (1 - k) * 0.55;
        const g = frondGeo(L, up, droop, cLeafD, cLeafL, false);
        g.rotateY(f / live * Math.PI * 2 + rng() * 0.35);
        g.translate(0, 0.06, 0);
        crownGeos.push(g);
      }
      for (let f = 0; f < 3; f++) {
        // the dead ones: shorter, hanging, brown
        const g = frondGeo(1.4, -0.35, 0.75, cDead, cDead, true);
        g.rotateY(f * 2.2 + rng() * 0.6);
        g.translate(0, -0.05, 0);
        crownGeos.push(g);
      }
      // the growing point and the nuts
      crownGeos.push(paint(new THREE.SphereGeometry(0.17, 7, 6), col('#5c4a34')).translate(0, 0.02, 0));
      for (let c = 0; c < 5; c++) {
        const coco = paint(new THREE.SphereGeometry(0.09, 6, 5), col(c % 2 ? '#7a5c40' : '#8f7a4a'));
        const a = c * 1.3 + rng() * 0.5;
        coco.translate(Math.cos(a) * 0.16, -0.14 - (c % 2) * 0.06, Math.sin(a) * 0.16);
        crownGeos.push(coco);
      }
      const crown = new THREE.Mesh(BGU.mergeGeometries(crownGeos.map(g => g.toNonIndexed())), foliage);
      crown.castShadow = true;
      crown.position.set(spot.x + px, py - PAD_H, spot.z + pz);
      crown.userData.phase = rng() * Math.PI * 2;
      scene.add(crown);
      crowns.push(crown);
    }

    // ═══ ROCKS · LOG · SHELLS ═══
    for (const r of rockSpots) {
      const g = new THREE.IcosahedronGeometry(r.s, 1);
      const pos = g.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const k = 0.75 + hash(i, 11) * 0.5;
        pos.setXYZ(i, pos.getX(i) * k, pos.getY(i) * k * (0.6 + hash(i, 5) * 0.5), pos.getZ(i) * k);
      }
      const base = col(P.rock).lerp(col(P.rockDark), rng() * 0.6);
      paint(g, (x, y) => _c.copy(base).multiplyScalar(0.6 + 0.45 * smooth(-r.s, r.s * 0.8, y)));
      drop(g, r.x, groundHeight(r.x, r.z) + r.s * 0.15, r.z, rng() * 6.3);
    }
    {
      // driftwood log lying in the wet band, plus a broken branch stub
      const log = new THREE.CylinderGeometry(0.14, 0.18, 2.6, 7, 6);
      const lp = log.attributes.position;
      for (let i = 0; i < lp.count; i++) lp.setX(i, lp.getX(i) + Math.pow((lp.getY(i) + 1.3) / 2.6, 2) * 0.45);
      paint(log, (x, y) => _c.copy(cWood).multiplyScalar(
        0.72 + 0.3 * smooth(-0.18, 0.18, x - Math.pow((y + 1.3) / 2.6, 2) * 0.45)));
      log.rotateZ(Math.PI / 2 - 0.06);
      drop(log, logSpot.x, groundHeight(logSpot.x, logSpot.z) + 0.14, logSpot.z, logSpot.ry);
      const stub = paint(new THREE.CylinderGeometry(0.05, 0.07, 0.5, 6), cWood);
      stub.rotateZ(0.9);
      drop(stub, logSpot.x + 0.5, groundHeight(logSpot.x, logSpot.z) + 0.3, logSpot.z + 0.3, logSpot.ry);
    }
    {
      // ═══ THE JETTY ═══ planks across, two beams under, posts into the bed.
      // Built the way the nook's deck is built — a box per board, tone jitter
      // per board, ends baked darker — because that is what makes nine planks
      // read as timber rather than as one striped slab.
      const [ax, az] = JETTY.across, LEN = JETTY.s1 - JETTY.s0;
      const PITCH = 0.305, TH = 0.05, HALF = JETTY.w / 2;
      const side = (p, d) => [p[0] + ax * d, p[1] + az * d];
      const cWet = col(P.wetSand), cRime = col(P.cream);
      const nPlank = Math.floor(LEN / PITCH);

      for (let i = 0; i < nPlank; i++) {
        // Two things ride the walk out, and both are the tide's doing: the
        // boards get damper and darker the further they are from dry sand,
        // and one board near the sea end is missing. The gap is not damage
        // for its own sake — it is the cheapest way to say this thing has
        // been here through weather, and it is placed out where nobody walks.
        const t = (i + 0.5) / nPlank;
        if (i === nPlank - 4) continue;
        const p = JETTY.at(JETTY.s0 + 0.16 + i * PITCH);
        const tone = (0.9 + 0.18 * hash(i, 23)) * (1 - 0.15 * t);
        const plank = box(JETTY.w, TH, 0.26);
        paint(plank, x => _c.copy(cWood).multiplyScalar(
          tone * (1 - 0.26 * smooth(HALF * 0.62, HALF, Math.abs(x)))));
        // a few degrees of yaw per board, so the edge is a hand's line
        drop(plank, p[0], JETTY.deck - TH / 2, p[1], JETTY.ry + (hash(i, 11) - 0.5) * 0.06);
      }

      // the two beams the boards sit on, running the length under the deck
      const mid = JETTY.at((JETTY.s0 + JETTY.s1) / 2);
      for (const s of [-1, 1]) {
        const beam = box(0.1, 0.1, LEN);
        paint(beam, (x, y) => _c.copy(cWood).multiplyScalar(0.72 + 0.3 * smooth(-0.05, 0.05, y)));
        const p = side(mid, s * (HALF - 0.09));
        drop(beam, p[0], JETTY.deck - TH - 0.05, p[1], JETTY.ry);
      }

      // Posts. Each one is measured to its OWN patch of seabed rather than to
      // a common length — the bed falls half a metre across this walk, so one
      // height leaves the far pair hanging in the water and the near pair
      // buried. Each sinks 0.3 m in, which is what stops a low tide in the
      // shallows showing daylight under a post.
      let k = 0;
      for (let s = JETTY.s0 + 0.5; s <= JETTY.s1 - 0.15; s += 1.85) {
        for (const sg of [-1, 1]) {
          const p = side(JETTY.at(s), sg * (HALF - 0.13));
          const bed = groundHeight(p[0], p[1]) - 0.3;
          const h = JETTY.deck - TH - bed;
          const cy = bed + h / 2;
          const post = box(0.12, h, 0.12);
          paint(post, (x, y) => {
            // the waterline written on the post: soaked below it, and a pale
            // rime of dried salt just above — the same tell v4 gave the sand
            const wy = cy + y;
            const wet = smooth(0.14, -0.02, wy);
            const rime = smooth(0.30, 0.16, wy) * (1 - wet);
            return _c.copy(cWood).lerp(cWet, wet * 0.5).lerp(cRime, rime * 0.3)
              .multiplyScalar(0.8 + 0.2 * smooth(-h / 2, h / 2, y));
          });
          post.rotateX((hash(k, 5) - 0.5) * 0.05);       // nothing stands true
          post.rotateZ((hash(k, 9) - 0.5) * 0.05);
          drop(post, p[0], cy, p[1], JETTY.ry);
          k++;
        }
      }
    }
    for (let i = 0; i < 12; i++) {
      const a = rng() * Math.PI * 2, r = 5 + rng() * 8;
      const x = Math.cos(a) * r, z = Math.sin(a) * r, h = groundHeight(x, z);
      if (h < 0.0 || h > 0.35) { i--; continue; }
      drop(paint(new THREE.ConeGeometry(0.05, 0.05, 5), col(rng() > 0.5 ? P.cream : P.sunset)),
        x, h + 0.02, z, rng() * 6.3, 1, 0.5, 1);
    }

    // ═══ LANTERNS — they brighten as the mood darkens ═══
    const lanternLights = [], lanternGlassGeos = [];
    const cPost = col('#6b5c48');
    for (const l of lanternSpots) {
      const gh = groundHeight(l.x, l.z);
      drop(paint(box(0.06, 1.35, 0.06),
        (x, y) => _c.copy(cPost).multiplyScalar(0.66 + 0.34 * smooth(-0.675, 0.2, y))), l.x, gh + 0.675, l.z);
      drop(paint(box(0.3, 0.05, 0.05), cPost), l.x + 0.06, gh + 1.32, l.z);
      const glass = paint(box(0.14, 0.18, 0.14), col('#ffd9a0'));
      glass.translate(l.x + 0.18, gh + 1.2, l.z);
      lanternGlassGeos.push(glass);

    // ═══ THE WAY HOME ═══ A driftwood post with a little CRT nailed to it —
    // the arcade, seen from the beach. It is a sign rather than a portal
    // because leaving is a real navigation: the XR session ends first, then
    // the browser goes to the hub. A portal that dissolved into a menu would
    // be pretending. The screen is drawn in code, like every marquee on the
    // site, and glows enough to be findable at dusk.
    const signScreenMat = new THREE.MeshStandardMaterial({
      roughness: 0.45, emissive: 0xffffff, emissiveIntensity: 0.85,

    // is that CC-BY work is credited where a PLAYER can see it, not only in a
    // source file — and until now the prop table carried a `licence` field
    // that was displayed precisely nowhere, which is a promise in a comment
    // rather than a credit. CC0 needs none and is not listed.
    const propCredits = [];
    function paintSign() {
      const cv = document.createElement('canvas');
      cv.width = 256; cv.height = 144;
      const g = cv.getContext('2d');
      g.fillStyle = '#06070a'; g.fillRect(0, 0, 256, 144);
      g.fillStyle = '#0d1420'; g.fillRect(6, 6, 244, 132);
      g.textAlign = 'center';
      const credited = propCredits.length > 0;
      g.fillStyle = '#3aa8a0';
      g.font = `bold ${credited ? 26 : 30}px ui-monospace, Menlo, Consolas, monospace`;
      g.fillText('THE ARCADE', 128, credited ? 40 : 46);
      g.fillStyle = '#f2e9d8';
      g.font = '17px ui-monospace, Menlo, Consolas, monospace';
      g.fillText('every game, one page', 128, credited ? 66 : 76);
      g.fillStyle = '#ff4fd8';
      g.font = `bold ${credited ? 17 : 19}px ui-monospace, Menlo, Consolas, monospace`;
      g.fillText('[ THIS WAY ]', 128, credited ? 94 : 112);
      if (credited) {
        g.fillStyle = 'rgba(242,233,216,0.62)';
        // the credit is the point of the line, so shrink it to fit rather
        // than letting the author's name clip — the same rule the radio's
        // plaque follows
        for (let i = 0; i < Math.min(2, propCredits.length); i++) {
          const line = propCredits[i];
          let px = 13;
          do { g.font = `${px}px ui-monospace, Menlo, Consolas, monospace`; px -= 1; }
          while (px > 7 && g.measureText(line).width > 236);
          g.fillText(line, 128, 114 + i * 15);
        }
      }
      // one scanline per two rows, the same trick the hub's marquees use
      g.fillStyle = 'rgba(0,0,0,0.22)';
      for (let y = 0; y < 144; y += 2) g.fillRect(0, y, 256, 1);
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      signScreenMat.map?.dispose();
      signScreenMat.map = tx;
      signScreenMat.emissiveMap = tx;
      signScreenMat.needsUpdate = true;
    }
    {
      paintSign();

      const gh = groundHeight(signSpot.x, signSpot.z);
      const post = new THREE.Mesh(paint(box(0.08, 1.5, 0.08),
        (x, y) => _c.copy(cWood).multiplyScalar(0.6 + 0.4 * smooth(-0.75, 0.1, y))), satin);
      post.position.y = 0.75;
      const frame = new THREE.Mesh(paint(box(0.56, 0.36, 0.05), col('#4a4038')), satin);
      frame.position.y = 1.42;
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.48, 0.28), signScreenMat);
      screen.position.set(0, 1.42, 0.027);
      sign.add(post, frame, screen);
      sign.traverse(o => { if (o.isMesh) o.castShadow = true; });
      sign.position.set(signSpot.x, gy(signSpot.x, signSpot.z), signSpot.z);

    }
    function goHome() {
      // end the session before navigating: a browser that changes page while
      // still presenting leaves the headset staring at a dead compositor

    }

    // ── the importer ──
    // Everything here is allowed to fail quietly. A missing or broken model
    // must never be the reason the island does not open, so each load is
    // independent and the catch does nothing but log.
    const imported = [];
    // ═══ THE PROP DOOR ═══════════════════════════════════════════════════
    // Validate, then place — and when a slot fails, fail WHERE IT CAN BE SEEN.
    //
    // The old door logged a warning and skipped the prop, which is the worst
    // of the available behaviours: the island looks finished, the prop is
    // simply absent, and absent is indistinguishable from never-placed. In a
    // headset there is no console to check, so a quiet failure is a failure
    // that ships. A slot that breaks now puts a magenta cage exactly where the
    // prop should have stood, labelled with the reason.
    const propReports = [];
    const propCages = [];
    const _cageV = new THREE.Vector3(), _cageL = new THREE.Vector3();

    // Where a slot lives, in TERRAIN space — the same coordinates the merge
    // piles and groundHeight() speak, so a prop and the cage that stands in
    // for a broken one cannot disagree about where the prop was meant to be.
    function propAnchor(spec) {
      if (spec.id === 'chair') {
        return { x: chairP[0], y: groundHeight(chairP[0], chairP[2]), z: chairP[2], yaw: NOOK_YAW };
      }
      if (spec.id === 'radio') {
        const [rx, rz] = nook(0.62, -0.05);
        return { x: rx, y: PAD_H + 0.61, z: rz, yaw: NOOK_YAW + 0.5 };   // the table top
      }
      if (spec.id === 'cove') return { x: 0, y: 0, z: 0, yaw: 0 };       // island origin
      const [ax, az] = spec.at ?? [0, 0];
      return { x: ax, y: groundHeight(ax, az), z: az, yaw: spec.yaw ?? 0 };
    }

    // Everything the contract promises, asked of the file rather than assumed.
    function checkProp(spec, gltf) {
      const why = [];
      const root = gltf.scene;
      // STATIC. There is no animation system on this island to run a clip in,
      // so a file carrying one is refused rather than silently frozen — a
      // frozen clip is a prop in a pose nobody chose.
      if (gltf.animations?.length) {
        why.push(`carries ${gltf.animations.length} animation clip(s); props are static`);
      }
      let tris = 0, skinned = 0, textures = 0;
      root.traverse(o => {
        if (o.isSkinnedMesh) skinned++;
        if (!o.isMesh || !o.geometry) return;
        const g = o.geometry;
        tris += (g.index ? g.index.count : g.attributes.position?.count ?? 0) / 3;
        for (const m of (Array.isArray(o.material) ? o.material : [o.material])) {
          if (m?.map) textures++;
        }
      });
      tris = Math.round(tris);
      if (skinned) why.push(`${skinned} skinned mesh(es); props are static`);
      if (tris > spec.tris) why.push(`${tris} triangles against a budget of ${spec.tris}`);
      // MEASURE LAST, and only what is worth measuring. Box3.setFromObject
      // walks a SkinnedMesh through applyBoneTransform, which throws outright
      // on a rig whose skin attributes are missing — so measuring before
      // refusing means a malformed file takes the whole island down instead of
      // failing visibly, which is the one outcome this door exists to prevent.
      // The rig is already refused above; there is nothing left to learn from
      // its size.
      if (why.length) return { tris, textures, dim: [0, 0, 0], why };
      const span = spec.span ?? [99, 99, 99];
      let dim = [0, 0, 0];
      try {
        const size = new THREE.Vector3();
        new THREE.Box3().setFromObject(root).getSize(size);
        dim = [+size.x.toFixed(2), +size.y.toFixed(2), +size.z.toFixed(2)];
        // THE ENVELOPE, which is really a units check. A glTF exported in
        // centimetres arrives a hundred times too big and one authored at
        // scene scale arrives a hundred times too small; both look like a
        // missing prop from the chair and neither says so.
        const ax = ['x', 'y', 'z'];
        if (ax.some((k, i) => size[k] > span[i] * 1.25)) {
          why.push(`measures ${dim.join('x')} m against a declared ${span.join('x')} m; check the export's units`);
        } else if (ax.every((k, i) => size[k] < span[i] * 0.25)) {
          why.push(`measures only ${dim.join('x')} m against a declared ${span.join('x')} m; check the export's units`);
        }
      } catch (e) {
        why.push(`could not be measured — ${e?.message ?? e}`);
      }
      return { tris, textures, dim, why };
    }

    // The cage: magenta, unfogged, turning. Magenta is the one colour nowhere
    // in this island's palette, and a thing that turns on a beach where
    // nothing else does cannot be mistaken for art.
    function propCage(spec, anchor, why) {
      const g = new THREE.Group();
      const [sx, sy, sz] = spec.span ?? [1, 1, 1];
      // EDGES, not `wireframe: true` — a wireframe box draws every triangle
      // diagonal too, which reads as a crumpled cat's cradle rather than as
      // the envelope the prop was supposed to fill. Twelve lines say "this is
      // the shape of the hole"; eighteen say nothing.
      const cageGeo = box(sx, sy, sz);
      const wire = new THREE.LineSegments(new THREE.EdgesGeometry(cageGeo),
        new THREE.LineBasicMaterial({ color: col(P.neon), fog: false, transparent: true, opacity: 0.95 }));
      cageGeo.dispose();
      wire.position.y = sy / 2;
      g.add(wire);
      // and it SAYS which slot and why, because a mystery cage is only half a
      // report and the other half is in a console nobody is wearing
      const cv = document.createElement('canvas');
      cv.width = 512; cv.height = 128;
      const c2 = cv.getContext('2d');
      c2.fillStyle = 'rgba(10,6,12,0.85)';
      c2.beginPath(); c2.roundRect(0, 0, 512, 128, 10); c2.fill();
      c2.textAlign = 'center';
      c2.fillStyle = '#ff4fd8';
      c2.font = 'bold 34px ui-monospace, Menlo, Consolas, monospace';
      c2.fillText(`PROP FAILED: ${spec.id}`.toUpperCase(), 256, 46);
      // the REASON is the half that saves you the trip to the console, so it
      // is lit rather than muted — a dim explanation over a bright cage is a
      // cage that only tells you something is wrong
      c2.fillStyle = '#f2e9d8';
      let px = 21;
      do { c2.font = `${px}px ui-monospace, Menlo, Consolas, monospace`; px -= 1; }
      while (px > 12 && c2.measureText(why).width > 486);
      c2.fillText(why.slice(0, 84), 256, 94);
      const tx = new THREE.CanvasTexture(cv);
      tx.colorSpace = THREE.SRGBColorSpace;
      const label = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(1.2, sx * 1.1), Math.max(0.3, sx * 0.275)),
        new THREE.MeshBasicMaterial({ map: tx, transparent: true, fog: false, depthWrite: false }));
      // clear of the cage, not across it
      label.position.y = sy + Math.max(0.42, sy * 0.3);
      label.userData.billboard = true;
      g.add(label);
      g.position.set(anchor.x, anchor.y, anchor.z);
      island.add(g);
      propCages.push(g);
      // and the stand-in steps ASIDE. Leaving it under the cage would read as
      // "there is a chair, and also an error", which is the comfortable lie
      // this door exists to refuse: a live slot means the file IS the prop.
      // Only the mesh goes — the sit detection and the nook's ray target are
      // separate objects and keep working, so a broken slot costs you the
      // model and not the island.
      if (spec.id === 'chair' && chairProp) chairProp.visible = false;
    }

    // and one line on the page, for the pass that is being done on a laptop
    function propBanner() {
      const bad = propReports.filter(r => r.why.length);
      let el = document.getElementById('propfail');
      if (!bad.length) { el?.remove(); return; }
      if (!el) {
        el = document.createElement('div');
        el.id = 'propfail';
        el.style.cssText = 'position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:7;'
          + 'font:12px ui-monospace,Menlo,Consolas,monospace;color:#ff4fd8;'
          + 'background:rgba(10,6,12,0.85);padding:7px 11px;border-radius:7px;'
          + 'pointer-events:none;white-space:pre;text-align:center';
        document.body.appendChild(el);
      }
      el.textContent = bad.map(r => `PROP FAILED  ${r.id}  ${r.why[0]}`).join('\n');
    }

    function openPropDoor() {
      const live = [...PROPS, ...DRESSING].filter(sp => sp.state === 'live');
      for (const sp of [...PROPS, ...DRESSING].filter(x => x.state !== 'live')) {
        propReports.push({ id: sp.id, state: sp.state, why: [] });
      }
      if (!live.length) return propBanner();
      const loader = new GLTFLoader();
      for (const spec of live) {
        const anchor = propAnchor(spec);
        loader.load(spec.file, (gltf) => {
          const rep = checkProp(spec, gltf);
          propReports.push({ id: spec.id, state: 'live', ...rep });
          if (rep.why.length) {
            // NO FALLBACK. The stand-in is not quietly put back, because then
            // the island looks right and the file is silently doing nothing.
            propCage(spec, anchor, rep.why[0]);
            propBanner();
            shadowDirty();
            return;
          }
          const obj = gltf.scene;
          const sc = spec.scale ?? 1;
          obj.scale.setScalar(sc);
          obj.rotation.y = anchor.yaw;
          const b = new THREE.Box3().setFromObject(obj);
          // how the slot is seated: onto the ground from its own measured
          // base, onto a shelf at an exact height, or left at the island's
          // own origin — which is the only sane rule for a prop the size of
          // the cove, since there is no single point to rest 30 m of rock on
          const fit = spec.fit ?? 'ground';
          obj.position.set(
            fit === 'origin' ? 0 : anchor.x,
            fit === 'origin' ? 0 : anchor.y - b.min.y,
            fit === 'origin' ? 0 : anchor.z);

            if (!o.isMesh) return;
            o.castShadow = true;

              // it joins the satin family instead of fighting it

                map: src?.map ?? null,
                roughness: 0.92, metalness: 0,
                vertexColors: !!o.geometry.attributes.color,
              });
            }
          });
          // a live chair REPLACES the stand-in rather than standing in it
          if (spec.id === 'chair' && chairProp) {
            island.remove(chairProp);
            const i = solids.indexOf(chairProp);
            if (i >= 0) solids.splice(i, 1);
            chairProp.geometry.disposeBoundsTree?.();
            chairProp.geometry.dispose();
            chairProp = null;
          }
          island.add(obj);
          // a structure prop is something you stand on or bump into, so it
          // joins the collision set; dressing is only ever looked at
          if (spec.kind === 'structure') {
            obj.updateMatrixWorld(true);
            obj.traverse(o => { if (o.isMesh) makeSolid(o); });
          }
          imported.push({ spec, obj });
          // CC0 asks for nothing; everything else gets its line on the sign
          const lic = (spec.licence ?? '').trim();
          if (lic && !/^cc0|^public domain/i.test(lic)) {
            propCredits.push(`${spec.title || spec.id} — ${spec.author || 'unknown'} (${lic})`);
            paintSign();
          }
          propBanner();
          shadowDirty();
        }, undefined, (err) => {
          const why = `did not load — ${err?.message ?? err}`;
          propReports.push({ id: spec.id, state: 'live', tris: 0, textures: 0, dim: [0, 0, 0], why: [why] });
          propCage(spec, anchor, why);
          propBanner();
        });
      }
    }

    // ═══ THE CAVE ═══ on its islet, across the bar, open at low water ════════
    const C_NEON = col(P.neon);
    const neonMat = new THREE.MeshBasicMaterial({ color: C_NEON.clone(), fog: false });
    const neonLight = new THREE.PointLight(C_NEON.getHex(), 0, 12, 1.6);
    // What is in it: a pool that glows, because a cave you crossed a bar at
    // dusk to reach should be worth the crossing, and a shell by the water
    // that takes you back to your chair — because the tide comes back in, and
    // a place you can be cut off in needs a way home that is not the sea.
    const C_POOL = col('#5ff0dc');

    // A soft-edged glow rather than a disc: at full opacity with a hard rim
    // it read as a lit plate lying on the floor.

      const cv = document.createElement('canvas'); cv.width = cv.height = 64;
      const g = cv.getContext('2d'), rg = g.createRadialGradient(32, 32, 4, 32, 32, 32);
      rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.55, 'rgba(255,255,255,0.55)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');

    })();
    const pool = new THREE.Mesh(new THREE.CircleGeometry(0.75, 28),
      new THREE.MeshBasicMaterial({ color: C_POOL.clone(), map: poolTex, transparent: true,
        opacity: 0.5, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
    const shell = new THREE.Group();
    {
      const gh = groundHeight(caveSpot.x, caveSpot.z);
      const cDark = col(P.rockDark), cRock = col(P.rock);
      for (const [i, b] of CAVE_BLOBS.entries()) {
        const g = new THREE.IcosahedronGeometry(b.s, 1);
        const pos = g.attributes.position;
        for (let j = 0; j < pos.count; j++) {
          // ±10%, not ±20: at ±20 an icosahedron shatters into shards and a
          // cave wall becomes a pile of black glass
          const k = 0.9 + hash(j, i + 90) * 0.2;
          pos.setXYZ(j, pos.getX(j) * k, pos.getY(j) * k * b.sy, pos.getZ(j) * k);
        }
        // darker toward the bottom and darker on the roof, whose faces only
        // ever see the inside of the cave

        // dark scene holds for a landmark too: a black mass on a dusk sky is
        // a hole in the picture, and this is the thing the chair looks at.
        paint(g, (x, y) => _c.copy(b.roof ? cRock.clone().lerp(cDark, 0.45) : cRock)
          .multiplyScalar(0.7 + 0.4 * smooth(-b.s, b.s, y)));

      }
